li>我差点儿把钥匙忘在公司了，幸亏同事提醒了我。<\/li>\n<\/ol>\n<\/li>\n<li>\n<ol start=\"2\">\n<li>我一到周末就想睡懒觉，连早饭都不想吃。<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 07\">중국어 Day 07<\/a> — 2026-11-15 (일상)<ul>\n<li>\n<ol>\n<li>你回来的路上顺便帮我买瓶牛奶，冰箱里一瓶都没有了。<\/li>\n<\/ol>\n<\/li>\n<li>\n<ol start=\"2\">\n<li>这部电视剧我看了一半就看不下去了，你还是别浪费时间了。<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 08\">중국어 Day 08<\/a> — 2026-11-16 (일상)<ul>\n<li>\n<ol>\n<li>外卖估计还得等二十分钟才能到，你饿了就先吃点儿水果。<\/li>\n<\/ol>\n<\/li>\n<li>\n<ol start=\"2\">\n<li>我最近迷上了做饭，不管多累，下班回家都要自己做一顿。<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 09\">중국어 Day 09<\/a> — 2026-11-17 (일상)<ul>\n<li>\n<ol>\n<li>我昨晚怎么也睡不着，干脆起来看了会儿书。<\/li>\n<\/ol>\n<\/li>\n<li>\n<ol start=\"2\">\n<li>这件衣服我穿着有点儿大，能不能换小一号的？<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 10\">중국어 Day 10<\/a> — 2026-11-18 (일상)<ul>\n<li>\n<ol>\n<li>早知道今天这么堵，我就坐地铁来了。<\/li>\n<\/ol>\n<\/li>\n<li>\n<ol start=\"2\">\n<li>你上次推荐的那家面馆我去过了，味道确实不错，难怪每次都没有空位。<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 11\">중국어 Day 11<\/a> — 2026-11-19 (일상)<ul>\n<li>\n<ol>\n<li>你先别急着挂电话，我还有件事没说完呢。<\/li>\n<\/ol>\n<\/li>\n<li>\n<ol start=\"2\">\n<li>除了周一以外，这周我晚上都行，你看哪天方便？<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 12\">중국어 Day 12<\/a> — 2026-11-20 (일상)<ul>\n<li>\n<ol>\n<li>好久没收拾房间了，屋里乱得不行，这个周末非得好好打扫不可。<\/li>\n<\/ol>\n<\/li>\n<li>\n<ol start=\"2\">\n<li>我正要出门，突然下起雨来了，看来今天只能在家待着了。<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 13\">중국어 Day 13<\/a> — 2026-11-21 (일상)<ul>\n<li>\n<ol>\n<li>我的快递被邻居拿错了，害得我找了半天。<\/li>\n<\/ol>\n<\/li>\n<li>\n<ol start=\"2\">\n<li>既然你明天不用上班，那今晚就陪我看场电影呗。<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 14\">중국어 Day 14<\/a> — 2026-11-22 (일상)<ul>\n<li>\n<ol>\n<li>我 ，干脆起来看了会儿书。 这件衣服我穿着有点儿大，能不能换小一号的？ 중국어 Day 10 — 2026-11-18 (일상) 早知道今天这么堵，我就坐地铁来了。 你上次推荐的那家面馆我去过了，味道确实不错，难怪每次都没有空位。 중국어 Day 11 — 2026-11-19 (일상) 你先别急着挂电话，我还有件事没说完呢。 除了周一以外，这周我晚上都行，你看哪天方便？ 중국어 Day 12 — 2026-11-20 (일상) 好久没收拾房间了，屋里乱得不行，这个周末非得好好打扫不可。 我正要出门，突然下起雨来了，看来今天只能在家待着了。 중국어 Day 13 — 2026-11-21 (일상) 我的快递被邻居拿错了，害得我找了半天。 既然你明天不用上班，那今晚就陪我看场电影呗。 중국어 Day 14 — 2026-11-22 (일상) 我光顾着跟朋友聊天，一不小心坐过了两站。 天阴得厉害，带把伞吧，万一下雨了也不怕。 중국어 Day 15 — 2026-11-23 (일상) 这家咖啡店的拿铁比我想象的好喝多了，下次带你来尝尝。 我一边洗碗一边听播客，不知不觉就到半夜了。 중국어 Day 16 — 2026-11-24 (일상) 这个周末我哪儿也不想去，就想在家躺着追剧。 我还以为你早就到了呢，原来你还在路上啊。 중국어 Day 17 — 2026-11-25 (일상) 趁超市打折，我囤了好几包纸巾，省得过几天再跑一趟。 我最近动不动就犯困，说不定是因为晚上睡得太晚了。 중국어 Day 18 — 2026-11-26 (일상) 难得有个不加班的晚上，要不咱们出去吃火锅？ 这双运动鞋虽然已经很旧了，可我一直舍不得扔，毕竟是我妈送的。"}, {"title": "중국어 Day 01", "category": "chinese", "updated": "2026-09-29", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: Day 1 · 2026-09-29<\/li>\n<\/ul>\n<h2>1. 我们下周可以安排一次视频会议吗？<\/h2>\n<ul>\n<li>병음: Wǒmen xiàzhōu kěyǐ ānpái yí cì shìpín huìyì ma?<\/li>\n<li>뜻: 다음 주에 화상회의 한 번 잡을 수 있을까요?<\/li>\n<li>문법:<ul>\n<li>安排(ānpái) + 일정/활동: \"~을 잡다, 준비하다\". (安排时间(ānpái shíjiān), 安排见面(ānpái jiànmiàn))<\/li>\n<li>一次(yí cì): 동작의 횟수를 나타내는 양사, \"한 번\".<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. 这个问题我们内部确认一下，明天给您回复。<\/h2>\n<ul>\n<li>병음: Zhège wèntí wǒmen nèibù quèrèn yíxià, míngtiān gěi nín huífù.<\/li>\n<li>뜻: 이 건은 저희 내부적으로 확인해 보고, 내일 회신 드리겠습니다.<\/li>\n<li>문법:<ul>\n<li>주제 먼저 말하기: 这个问题(zhège wèntí)를 문장 맨 앞에 두는 회화체 구조.<\/li>\n<li>동사 + 一下(yíxià): \"좀 ~해 보다\", 말투를 부드럽게 함. (看一下(kàn yíxià), 查一下(chá yíxià))<\/li>\n<li>给(gěi) + 사람 + 回复(huífù): \"~에게 회신하다\", 给您(gěi nín)은 공손한 표현.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>下周<\/td>\n<td>xiàzhōu<\/td>\n<td>다음 주<\/td>\n<\/tr>\n<tr>\n<td>安排<\/td>\n<td>ānpái<\/td>\n<td>(일정을) 잡다, 준비하다<\/td>\n<\/tr>\n<tr>\n<td>视频会议<\/td>\n<td>shìpín huìyì<\/td>\n<td>화상회의<\/td>\n<\/tr>\n<tr>\n<td>内部<\/td>\n<td>nèibù<\/td>\n<td>내부<\/td>\n<\/tr>\n<tr>\n<td>确认<\/td>\n<td>quèrèn<\/td>\n<td>확인하다<\/td>\n<\/tr>\n<tr>\n<td>回复<\/td>\n<td>huífù<\/td>\n<td>회신하다, 답변하다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>다음: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 02\">중국어 Day 02<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: Day 1 · 2026-09-29 1. 我们下周可以安排一次视频会议吗？ 병음: Wǒmen xiàzhōu kěyǐ ānpái yí cì shìpín huìyì ma? 뜻: 다음 주에 화상회의 한 번 잡을 수 있을까요? 문법: 安排(ānpái) + 일정/활동: \"~을 잡다, 준비하다\". (安排时间(ānpái shíjiān), 安排见面(ānpái jiànmiàn)) 一次(yí cì): 동작의 횟수를 나타내는 양사, \"한 번\". 2. 这个问题我们内部确认一下，明天给您回复。 병음: Zhège wèntí wǒmen nèibù quèrèn yíxià, míngtiān gěi nín huífù. 뜻: 이 건은 저희 내부적으로 확인해 보고, 내일 회신 드리겠습니다. 문법: 주제 먼저 말하기: 这个问题(zhège wèntí)를 문장 맨 앞에 두는 회화체 구조. 동사 + 一下(yíxià): \"좀 ~해 보다\", 말투를 부드럽게 함. (看一下(kàn yíxià), 查一下(chá yíxià)) 给(gěi) + 사람 + 回复(huífù): \"~에게 회신하다\", 给您(gěi nín)은 공손한 표현. 주요 단어 단어 병음 뜻 下周 xiàzhōu 다음 주 安排 ānpái (일정을) 잡다, 준비하다 视频会议 shìpín huìyì 화상회의 内部 nèibù 내부 确认 quèrèn 확인하다 回复 huífù 회신하다, 답변하다 관련 비즈니스 중국어 노트 다음: 중국어 Day 02"}, {"title": "중국어 Day 02", "category": "chinese", "updated": "2026-09-30", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: Day 2 · 2026-09-30<\/li>\n<\/ul>\n<h2>1. 请问这笔交易的结算款什么时候能到账？<\/h2>\n<ul>\n<li>병음: Qǐngwèn zhè bǐ jiāoyì de jiésuàn kuǎn shénme shíhou néng dàozhàng?<\/li>\n<li>뜻: 이 거래의 정산금은 언제 입금될까요?<\/li>\n<li>문법:<ul>\n<li>请问(qǐngwèn) + 질문: \"실례지만, 여쭤보겠습니다\". 질문을 정중하게 시작하는 표현.<\/li>\n<li>笔(bǐ): 거래·금액·자금을 세는 양사. (一笔钱(yì bǐ qián), 这笔订单(zhè bǐ dìngdān))<\/li>\n<li>到账(dàozhàng): \"(돈이) 계좌에 들어오다, 입금되다\". 能(néng)과 함께 \"입금될 수 있다\"로 씀.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. 附件是修改后的合同，麻烦您看一下。<\/h2>\n<ul>\n<li>병음: Fùjiàn shì xiūgǎi hòu de hétong, máfan nín kàn yíxià.<\/li>\n<li>뜻: 첨부 파일은 수정한 계약서입니다. 한번 검토 부탁드립니다.<\/li>\n<li>문법:<ul>\n<li>동사 + 后的(hòu de) + 명사: \"~한 후의 ~\". (修改后的版本(xiūgǎi hòu de bǎnběn), 签字后的合同(qiānzì hòu de hétong))<\/li>\n<li>麻烦您(máfan nín) + 동사: \"번거로우시겠지만 ~해 주세요\". 请(qǐng)보다 부드러운 부탁 표현.<\/li>\n<li>看一下(kàn yíxià): Day 1의 동사 + 一下(yíxià) 복습, \"좀 봐 주세요\".<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>请问<\/td>\n<td>qǐngwèn<\/td>\n<td>실례지만 (질문 시작)<\/td>\n<\/tr>\n<tr>\n<td>交易<\/td>\n<td>jiāoyì<\/td>\n<td>거래<\/td>\n<\/tr>\n<tr>\n<td>结算款<\/td>\n<td>jiésuàn kuǎn<\/td>\n<td>정산금<\/td>\n<\/tr>\n<tr>\n<td>到账<\/td>\n<td>dàozhàng<\/td>\n<td>입금되다<\/td>\n<\/tr>\n<tr>\n<td>附件<\/td>\n<td>fùjiàn<\/td>\n<td>첨부 파일<\/td>\n<\/tr>\n<tr>\n<td>修改<\/td>\n<td>xiūgǎi<\/td>\n<td>수정하다<\/td>\n<\/tr>\n<tr>\n<td>合同<\/td>\n<td>hétong<\/td>\n<td>계약서<\/td>\n<\/tr>\n<tr>\n<td>麻烦<\/td>\n<td>máfan<\/td>\n<td>번거롭게 하다, 부탁하다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 01\">중국어 Day 01<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 03\">중국어 Day 03<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: Day 2 · 2026-09-30 1. 请问这笔交易的结算款什么时候能到账？ 병음: Qǐngwèn zhè bǐ jiāoyì de jiésuàn kuǎn shénme shíhou néng dàozhàng? 뜻: 이 거래의 정산금은 언제 입금될까요? 문법: 请问(qǐngwèn) + 질문: \"실례지만, 여쭤보겠습니다\". 질문을 정중하게 시작하는 표현. 笔(bǐ): 거래·금액·자금을 세는 양사. (一笔钱(yì bǐ qián), 这笔订单(zhè bǐ dìngdān)) 到账(dàozhàng): \"(돈이) 계좌에 들어오다, 입금되다\". 能(néng)과 함께 \"입금될 수 있다\"로 씀. 2. 附件是修改后的合同，麻烦您看一下。 병음: Fùjiàn shì xiūgǎi hòu de hétong, máfan nín kàn yíxià. 뜻: 첨부 파일은 수정한 계약서입니다. 한번 검토 부탁드립니다. 문법: 동사 + 后的(hòu de) + 명사: \"~한 후의 ~\". (修改后的版本(xiūgǎi hòu de bǎnběn), 签字后的合同(qiānzì hòu de hétong)) 麻烦您(máfan nín) + 동사: \"번거로우시겠지만 ~해 주세요\". 请(qǐng)보다 부드러운 부탁 표현. 看一下(kàn yíxià): Day 1의 동사 + 一下(yíxià) 복습, \"좀 봐 주세요\". 주요 단어 단어 병음 뜻 请问 qǐngwèn 실례지만 (질문 시작) 交易 jiāoyì 거래 结算款 jiésuàn kuǎn 정산금 到账 dàozhàng 입금되다 附件 fùjiàn 첨부 파일 修改 xiūgǎi 수정하다 合同 hétong 계약서 麻烦 máfan 번거롭게 하다, 부탁하다 관련 비즈니스 중국어 노트 이전: 중국어 Day 01 · 다음: 중국어 Day 03"}, {"title": "중국어 Day 03", "category": "chinese", "updated": "2026-10-18", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: Day 3 · 2026-10-18 (일상)<\/li>\n<\/ul>\n<h2>1. 周末过得怎么样？我在家休息了一整天。<\/h2>\n<ul>\n<li>병음: Zhōumò guò de zěnmeyàng? Wǒ zài jiā xiūxi le yì zhěng tiān.<\/li>\n<li>뜻: 주말 어떻게 보냈어요? 저는 하루 종일 집에서 쉬었어요.<\/li>\n<li>문법:<ul>\n<li>동사 + 得(de) + 怎么样(zěnmeyàng): \"~한 게 어때요?\" 정도보어로 상태·결과를 물음. (睡得怎么样(shuì de zěnmeyàng), 吃得怎么样(chī de zěnmeyàng))<\/li>\n<li>过(guò): 여기서는 \"(시간을) 보내다\". (过周末(guò zhōumò), 过生日(guò shēngrì))<\/li>\n<li>一整天(yì zhěng tiān): \"하루 종일\". 시간을 나타내는 말이 동사 + 了(le) 뒤에 와서 지속 시간을 나타냄.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. 天气越来越冷了，出门的时候多穿点儿衣服。<\/h2>\n<ul>\n<li>병음: Tiānqì yuè lái yuè lěng le, chūmén de shíhou duō chuān diǎnr yīfu.<\/li>\n<li>뜻: 날씨가 점점 추워지네요. 외출할 때 옷 좀 더 껴입으세요.<\/li>\n<li>문법:<ul>\n<li>越来越(yuè lái yuè) + 형용사: \"점점 ~해지다\". 문장 끝 了(le)와 함께 변화를 나타냄. (越来越忙(yuè lái yuè máng))<\/li>\n<li>……的时候(de shíhou): \"~할 때\". (吃饭的时候(chīfàn de shíhou))<\/li>\n<li>多(duō) + 동사 + 点儿(diǎnr): \"좀 더 ~하다\". 권유할 때 자주 씀. (多吃点儿(duō chī diǎnr), 多喝点儿水(duō hē diǎnr shuǐ))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>周末<\/td>\n<td>zhōumò<\/td>\n<td>주말<\/td>\n<\/tr>\n<tr>\n<td>过<\/td>\n<td>guò<\/td>\n<td>(시간을) 보내다<\/td>\n<\/tr>\n<tr>\n<td>休息<\/td>\n<td>xiūxi<\/td>\n<td>쉬다<\/td>\n<\/tr>\n<tr>\n<td>一整天<\/td>\n<td>yì zhěng tiān<\/td>\n<td>하루 종일<\/td>\n<\/tr>\n<tr>\n<td>天气<\/td>\n<td>tiānqì<\/td>\n<td>날씨<\/td>\n<\/tr>\n<tr>\n<td>越来越<\/td>\n<td>yuè lái yuè<\/td>\n<td>점점, 갈수록<\/td>\n<\/tr>\n<tr>\n<td>出门<\/td>\n<td>chūmén<\/td>\n<td>외출하다<\/td>\n<\/tr>\n<tr>\n<td>穿<\/td>\n<td>chuān<\/td>\n<td>(옷을) 입다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 02\">중국어 Day 02<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"중국어 심화 문장\">중국어 심화 문장<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: Day 3 · 2026-10-18 (일상) 1. 周末过得怎么样？我在家休息了一整天。 병음: Zhōumò guò de zěnmeyàng? Wǒ zài jiā xiūxi le yì zhěng tiān. 뜻: 주말 어떻게 보냈어요? 저는 하루 종일 집에서 쉬었어요. 문법: 동사 + 得(de) + 怎么样(zěnmeyàng): \"~한 게 어때요?\" 정도보어로 상태·결과를 물음. (睡得怎么样(shuì de zěnmeyàng), 吃得怎么样(chī de zěnmeyàng)) 过(guò): 여기서는 \"(시간을) 보내다\". (过周末(guò zhōumò), 过生日(guò shēngrì)) 一整天(yì zhěng tiān): \"하루 종일\". 시간을 나타내는 말이 동사 + 了(le) 뒤에 와서 지속 시간을 나타냄. 2. 天气越来越冷了，出门的时候多穿点儿衣服。 병음: Tiānqì yuè lái yuè lěng le, chūmén de shíhou duō chuān diǎnr yīfu. 뜻: 날씨가 점점 추워지네요. 외출할 때 옷 좀 더 껴입으세요. 문법: 越来越(yuè lái yuè) + 형용사: \"점점 ~해지다\". 문장 끝 了(le)와 함께 변화를 나타냄. (越来越忙(yuè lái yuè máng)) ……的时候(de shíhou): \"~할 때\". (吃饭的时候(chīfàn de shíhou)) 多(duō) + 동사 + 点儿(diǎnr): \"좀 더 ~하다\". 권유할 때 자주 씀. (多吃点儿(duō chī diǎnr), 多喝点儿水(duō hē diǎnr shuǐ)) 주요 단어 단어 병음 뜻 周末 zhōumò 주말 过 guò (시간을) 보내다 休息 xiūxi 쉬다 一整天 yì zhěng tiān 하루 종일 天气 tiānqì 날씨 越来越 yuè lái yuè 점점, 갈수록 出门 chūmén 외출하다 穿 chuān (옷을) 입다 관련 비즈니스 중국어 노트 이전: 중국어 Day 02 · 다음: 중국어 심화 문장"}, {"title": "중국어 Day 04", "category": "chinese", "updated": "2026-11-12", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: Day 4 · 2026-11-12 (일상)<\/li>\n<\/ul>\n<h2>1. 我刚到家，手机快没电了，等充好电再打给你。<\/h2>\n<ul>\n<li>병음: Wǒ gāng dào jiā, shǒujī kuài méi diàn le, děng chōng hǎo diàn zài dǎ gěi nǐ.<\/li>\n<li>뜻: 나 방금 집에 왔는데 핸드폰 배터리가 거의 다 됐어. 충전하고 다시 전화할게.<\/li>\n<li>문법:<ul>\n<li>刚(gāng) + 동사: \"막 ~했다\". 방금 일어난 일을 나타냄. (刚起床(gāng qǐchuáng), 刚下班(gāng xiàbān))<\/li>\n<li>快(kuài) + 동사/형용사 + 了(le): \"곧 ~하게 되다\". 임박한 상황을 나타냄. (快到了(kuài dào le), 快下雨了(kuài xiàyǔ le))<\/li>\n<li>等(děng) + A + 再(zài) + B: \"A하고 나서 B하다\". 순서를 정해 미룰 때 씀. (等你回来再说(děng nǐ huílai zài shuō))<\/li>\n<li>동사 + 好(hǎo): 결과보어, \"(제대로) 다 ~하다\". 充好电(chōng hǎo diàn), 准备好(zhǔnbèi hǎo)<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. 这家店的菜好吃是好吃，就是排队的人太多了。<\/h2>\n<ul>\n<li>병음: Zhè jiā diàn de cài hǎochī shì hǎochī, jiùshì páiduì de rén tài duō le.<\/li>\n<li>뜻: 이 가게 음식이 맛있긴 맛있는데, 줄 서는 사람이 너무 많아.<\/li>\n<li>문법:<ul>\n<li>A是A，就是……: \"A하긴 A한데, 다만 ~\". 일단 인정하고 아쉬운 점을 덧붙이는 회화 표현. (便宜是便宜，就是有点儿远(piányi shì piányi, jiùshì yǒudiǎnr yuǎn))<\/li>\n<li>就是(jiùshì): 여기서는 \"다만, 단지\". 앞 내용에 대한 아쉬움·단점을 말할 때 씀.<\/li>\n<li>家(jiā): 가게·회사·식당을 세는 양사. (一家咖啡店(yì jiā kāfēidiàn))<\/li>\n<li>太(tài) + 형용사 + 了(le): \"너무 ~하다\". 정도가 지나침을 나타냄.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>刚<\/td>\n<td>gāng<\/td>\n<td>막, 방금<\/td>\n<\/tr>\n<tr>\n<td>没电<\/td>\n<td>méi diàn<\/td>\n<td>배터리가 다 되다<\/td>\n<\/tr>\n<tr>\n<td>充电<\/td>\n<td>chōngdiàn<\/td>\n<td>충전하다<\/td>\n<\/tr>\n<tr>\n<td>打给<\/td>\n<td>dǎ gěi<\/td>\n<td>~에게 전화하다<\/td>\n<\/tr>\n<tr>\n<td>家<\/td>\n<td>jiā<\/td>\n<td>(가게·회사를 세는) 양사<\/td>\n<\/tr>\n<tr>\n<td>菜<\/td>\n<td>cài<\/td>\n<td>요리, 음식<\/td>\n<\/tr>\n<tr>\n<td>就是<\/td>\n<td>jiùshì<\/td>\n<td>다만, 단지<\/td>\n<\/tr>\n<tr>\n<td>排队<\/td>\n<td>páiduì<\/td>\n<td>줄을 서다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"중국어 심화 문장\">중국어 심화 문장<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 05\">중국어 Day 05<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: Day 4 · 2026-11-12 (일상) 1. 我刚到家，手机快没电了，等充好电再打给你。 병음: Wǒ gāng dào jiā, shǒujī kuài méi diàn le, děng chōng hǎo diàn zài dǎ gěi nǐ. 뜻: 나 방금 집에 왔는데 핸드폰 배터리가 거의 다 됐어. 충전하고 다시 전화할게. 문법: 刚(gāng) + 동사: \"막 ~했다\". 방금 일어난 일을 나타냄. (刚起床(gāng qǐchuáng), 刚下班(gāng xiàbān)) 快(kuài) + 동사/형용사 + 了(le): \"곧 ~하게 되다\". 임박한 상황을 나타냄. (快到了(kuài dào le), 快下雨了(kuài xiàyǔ le)) 等(děng) + A + 再(zài) + B: \"A하고 나서 B하다\". 순서를 정해 미룰 때 씀. (等你回来再说(děng nǐ huílai zài shuō)) 동사 + 好(hǎo): 결과보어, \"(제대로) 다 ~하다\". 充好电(chōng hǎo diàn), 准备好(zhǔnbèi hǎo) 2. 这家店的菜好吃是好吃，就是排队的人太多了。 병음: Zhè jiā diàn de cài hǎochī shì hǎochī, jiùshì páiduì de rén tài duō le. 뜻: 이 가게 음식이 맛있긴 맛있는데, 줄 서는 사람이 너무 많아. 문법: A是A，就是……: \"A하긴 A한데, 다만 ~\". 일단 인정하고 아쉬운 점을 덧붙이는 회화 표현. (便宜是便宜，就是有点儿远(piányi shì piányi, jiùshì yǒudiǎnr yuǎn)) 就是(jiùshì): 여기서는 \"다만, 단지\". 앞 내용에 대한 아쉬움·단점을 말할 때 씀. 家(jiā): 가게·회사·식당을 세는 양사. (一家咖啡店(yì jiā kāfēidiàn)) 太(tài) + 형용사 + 了(le): \"너무 ~하다\". 정도가 지나침을 나타냄. 주요 단어 단어 병음 뜻 刚 gāng 막, 방금 没电 méi diàn 배터리가 다 되다 充电 chōngdiàn 충전하다 打给 dǎ gěi ~에게 전화하다 家 jiā (가게·회사를 세는) 양사 菜 cài 요리, 음식 就是 jiùshì 다만, 단지 排队 páiduì 줄을 서다 관련 비즈니스 중국어 노트 이전: 중국어 심화 문장 · 다음: 중국어 Day 05"}, {"title": "중국어 Day 05", "category": "chinese", "updated": "2026-11-13", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: Day 5 · 2026-11-13 (일상)<\/li>\n<\/ul>\n<h2>1. 我本来打算今天去健身房，结果下班太晚，只好改天了。<\/h2>\n<ul>\n<li>병음: Wǒ běnlái dǎsuàn jīntiān qù jiànshēnfáng, jiéguǒ xiàbān tài wǎn, zhǐhǎo gǎitiān le.<\/li>\n<li>뜻: 원래 오늘 헬스장에 가려고 했는데, 퇴근이 너무 늦어서 어쩔 수 없이 다음에 가야겠어.<\/li>\n<li>문법:<ul>\n<li>本来(běnlái) + 打算(dǎsuàn): \"원래 ~하려고 했다\". 계획이 바뀌었음을 미리 알려 줌. (我本来想去(wǒ běnlái xiǎng qù))<\/li>\n<li>结果(jiéguǒ): 문장 중간에서 \"그런데 결국, 결과적으로\". 예상과 다른 결과를 이어 줌. (结果下雨了(jiéguǒ xiàyǔ le))<\/li>\n<li>只好(zhǐhǎo) + 동사: \"어쩔 수 없이 ~하다\". 다른 선택지가 없을 때 씀. (只好打车(zhǐhǎo dǎchē))<\/li>\n<li>改天(gǎitiān): \"다음에, 다른 날에\". 약속을 미룰 때 자주 씀. (改天再聊(gǎitiān zài liáo))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. 你要是周末有空的话，咱们一起去逛逛街吧。<\/h2>\n<ul>\n<li>병음: Nǐ yàoshi zhōumò yǒu kòng dehuà, zánmen yìqǐ qù guàngguang jiē ba.<\/li>\n<li>뜻: 주말에 시간 있으면 우리 같이 쇼핑하러 가자.<\/li>\n<li>문법:<ul>\n<li>要是(yàoshi)……的话(dehuà): \"만약 ~라면\". 如果(rúguǒ)보다 회화에서 더 자주 씀. (要是下雨的话(yàoshi xiàyǔ dehuà))<\/li>\n<li>咱们(zánmen): 듣는 사람을 포함한 \"우리\". 我们(wǒmen)보다 친근한 말투.<\/li>\n<li>동사 중첩 逛逛(guàngguang): \"좀 ~해 보다\". 가볍고 편한 느낌을 줌. 이합사는 앞 글자만 겹침. (散散步(sàn san bù), 聊聊天(liáo liao tiān))<\/li>\n<li>문장 끝 吧(ba): \"~하자\". 제안·권유를 나타냄. (走吧(zǒu ba))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>本来<\/td>\n<td>běnlái<\/td>\n<td>원래, 본래<\/td>\n<\/tr>\n<tr>\n<td>打算<\/td>\n<td>dǎsuàn<\/td>\n<td>~할 계획이다<\/td>\n<\/tr>\n<tr>\n<td>健身房<\/td>\n<td>jiànshēnfáng<\/td>\n<td>헬스장<\/td>\n<\/tr>\n<tr>\n<td>结果<\/td>\n<td>jiéguǒ<\/td>\n<td>결국, 결과<\/td>\n<\/tr>\n<tr>\n<td>只好<\/td>\n<td>zhǐhǎo<\/td>\n<td>어쩔 수 없이<\/td>\n<\/tr>\n<tr>\n<td>改天<\/td>\n<td>gǎitiān<\/td>\n<td>다음에, 다른 날<\/td>\n<\/tr>\n<tr>\n<td>要是<\/td>\n<td>yàoshi<\/td>\n<td>만약 ~라면<\/td>\n<\/tr>\n<tr>\n<td>有空<\/td>\n<td>yǒu kòng<\/td>\n<td>시간이 있다<\/td>\n<\/tr>\n<tr>\n<td>咱们<\/td>\n<td>zánmen<\/td>\n<td>(듣는 사람 포함) 우리<\/td>\n<\/tr>\n<tr>\n<td>逛街<\/td>\n<td>guàngjiē<\/td>\n<td>거리 구경하다, 쇼핑하다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 04\">중국어 Day 04<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 06\">중국어 Day 06<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: Day 5 · 2026-11-13 (일상) 1. 我本来打算今天去健身房，结果下班太晚，只好改天了。 병음: Wǒ běnlái dǎsuàn jīntiān qù jiànshēnfáng, jiéguǒ xiàbān tài wǎn, zhǐhǎo gǎitiān le. 뜻: 원래 오늘 헬스장에 가려고 했는데, 퇴근이 너무 늦어서 어쩔 수 없이 다음에 가야겠어. 문법: 本来(běnlái) + 打算(dǎsuàn): \"원래 ~하려고 했다\". 계획이 바뀌었음을 미리 알려 줌. (我本来想去(wǒ běnlái xiǎng qù)) 结果(jiéguǒ): 문장 중간에서 \"그런데 결국, 결과적으로\". 예상과 다른 결과를 이어 줌. (结果下雨了(jiéguǒ xiàyǔ le)) 只好(zhǐhǎo) + 동사: \"어쩔 수 없이 ~하다\". 다른 선택지가 없을 때 씀. (只好打车(zhǐhǎo dǎchē)) 改天(gǎitiān): \"다음에, 다른 날에\". 약속을 미룰 때 자주 씀. (改天再聊(gǎitiān zài liáo)) 2. 你要是周末有空的话，咱们一起去逛逛街吧。 병음: Nǐ yàoshi zhōumò yǒu kòng dehuà, zánmen yìqǐ qù guàngguang jiē ba. 뜻: 주말에 시간 있으면 우리 같이 쇼핑하러 가자. 문법: 要是(yàoshi)……的话(dehuà): \"만약 ~라면\". 如果(rúguǒ)보다 회화에서 더 자주 씀. (要是下雨的话(yàoshi xiàyǔ dehuà)) 咱们(zánmen): 듣는 사람을 포함한 \"우리\". 我们(wǒmen)보다 친근한 말투. 동사 중첩 逛逛(guàngguang): \"좀 ~해 보다\". 가볍고 편한 느낌을 줌. 이합사는 앞 글자만 겹침. (散散步(sàn san bù), 聊聊天(liáo liao tiān)) 문장 끝 吧(ba): \"~하자\". 제안·권유를 나타냄. (走吧(zǒu ba)) 주요 단어 단어 병음 뜻 本来 běnlái 원래, 본래 打算 dǎsuàn ~할 계획이다 健身房 jiànshēnfáng 헬스장 结果 jiéguǒ 결국, 결과 只好 zhǐhǎo 어쩔 수 없이 改天 gǎitiān 다음에, 다른 날 要是 yàoshi 만약 ~라면 有空 yǒu kòng 시간이 있다 咱们 zánmen (듣는 사람 포함) 우리 逛街 guàngjiē 거리 구경하다, 쇼핑하다 관련 비즈니스 중국어 노트 이전: 중국어 Day 04 · 다음: 중국어 Day 06"}, {"title": "중국어 Day 06", "category": "chinese", "updated": "2026-11-14", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: Day 6 · 2026-11-14 (일상)<\/li>\n<\/ul>\n<h2>1. 我差点儿把钥匙忘在公司了，幸亏同事提醒了我。<\/h2>\n<ul>\n<li>병음: Wǒ chàdiǎnr bǎ yàoshi wàng zài gōngsī le, xìngkuī tóngshì tíxǐng le wǒ.<\/li>\n<li>뜻: 하마터면 열쇠를 회사에 두고 올 뻔했어. 다행히 동료가 알려 줬어.<\/li>\n<li>문법:<ul>\n<li>差点儿(chàdiǎnr) + 동사: \"하마터면 ~할 뻔했다\". 실제로는 일어나지 않은 일을 말함. (差点儿迟到(chàdiǎnr chídào), 差点儿摔倒(chàdiǎnr shuāidǎo))<\/li>\n<li>把(bǎ) + 목적어 + 동사 + 在(zài) + 장소: \"~을 ~에 (두다/놓다)\". 물건을 어디에 두었는지 말할 때 씀. (把包放在桌子上(bǎ bāo fàng zài zhuōzi shang))<\/li>\n<li>幸亏(xìngkuī): \"다행히, ~덕분에\". 나쁜 일을 피할 수 있었던 이유를 말할 때 씀. (幸亏你来了(xìngkuī nǐ lái le))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. 我一到周末就想睡懒觉，连早饭都不想吃。<\/h2>\n<ul>\n<li>병음: Wǒ yí dào zhōumò jiù xiǎng shuì lǎnjiào, lián zǎofàn dōu bù xiǎng chī.<\/li>\n<li>뜻: 나는 주말만 되면 늦잠 자고 싶어서, 아침밥조차 먹기 싫어.<\/li>\n<li>문법:<ul>\n<li>一(yī)……就(jiù)……: \"~하기만 하면 (곧) ~하다\". 조건과 결과가 바로 이어짐. (一下雨就堵车(yí xiàyǔ jiù dǔchē), 一喝酒就脸红(yì hē jiǔ jiù liǎnhóng))<\/li>\n<li>连(lián) + 명사 + 都(dōu)/也(yě) + 동사: \"~조차도, ~마저\". 극단적인 예를 들어 강조함. (连水都没喝(lián shuǐ dōu méi hē))<\/li>\n<li>睡懒觉(shuì lǎnjiào): \"늦잠 자다\". 睡觉(shuìjiào)처럼 이합사라서 사이에 수식어가 들어감. (睡了个懒觉(shuì le ge lǎnjiào))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>差点儿<\/td>\n<td>chàdiǎnr<\/td>\n<td>하마터면, 거의<\/td>\n<\/tr>\n<tr>\n<td>钥匙<\/td>\n<td>yàoshi<\/td>\n<td>열쇠<\/td>\n<\/tr>\n<tr>\n<td>忘<\/td>\n<td>wàng<\/td>\n<td>잊다, 깜빡하다<\/td>\n<\/tr>\n<tr>\n<td>幸亏<\/td>\n<td>xìngkuī<\/td>\n<td>다행히<\/td>\n<\/tr>\n<tr>\n<td>同事<\/td>\n<td>tóngshì<\/td>\n<td>동료<\/td>\n<\/tr>\n<tr>\n<td>提醒<\/td>\n<td>tíxǐng<\/td>\n<td>일깨워 주다, 알려 주다<\/td>\n<\/tr>\n<tr>\n<td>睡懒觉<\/td>\n<td>shuì lǎnjiào<\/td>\n<td>늦잠 자다<\/td>\n<\/tr>\n<tr>\n<td>连……都<\/td>\n<td>lián……dōu<\/td>\n<td>~조차도<\/td>\n<\/tr>\n<tr>\n<td>早饭<\/td>\n<td>zǎofàn<\/td>\n<td>아침밥<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 05\">중국어 Day 05<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 07\">중국어 Day 07<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: Day 6 · 2026-11-14 (일상) 1. 我差点儿把钥匙忘在公司了，幸亏同事提醒了我。 병음: Wǒ chàdiǎnr bǎ yàoshi wàng zài gōngsī le, xìngkuī tóngshì tíxǐng le wǒ. 뜻: 하마터면 열쇠를 회사에 두고 올 뻔했어. 다행히 동료가 알려 줬어. 문법: 差点儿(chàdiǎnr) + 동사: \"하마터면 ~할 뻔했다\". 실제로는 일어나지 않은 일을 말함. (差点儿迟到(chàdiǎnr chídào), 差点儿摔倒(chàdiǎnr shuāidǎo)) 把(bǎ) + 목적어 + 동사 + 在(zài) + 장소: \"~을 ~에 (두다/놓다)\". 물건을 어디에 두었는지 말할 때 씀. (把包放在桌子上(bǎ bāo fàng zài zhuōzi shang)) 幸亏(xìngkuī): \"다행히, ~덕분에\". 나쁜 일을 피할 수 있었던 이유를 말할 때 씀. (幸亏你来了(xìngkuī nǐ lái le)) 2. 我一到周末就想睡懒觉，连早饭都不想吃。 병음: Wǒ yí dào zhōumò jiù xiǎng shuì lǎnjiào, lián zǎofàn dōu bù xiǎng chī. 뜻: 나는 주말만 되면 늦잠 자고 싶어서, 아침밥조차 먹기 싫어. 문법: 一(yī)……就(jiù)……: \"~하기만 하면 (곧) ~하다\". 조건과 결과가 바로 이어짐. (一下雨就堵车(yí xiàyǔ jiù dǔchē), 一喝酒就脸红(yì hē jiǔ jiù liǎnhóng)) 连(lián) + 명사 + 都(dōu)/也(yě) + 동사: \"~조차도, ~마저\". 극단적인 예를 들어 강조함. (连水都没喝(lián shuǐ dōu méi hē)) 睡懒觉(shuì lǎnjiào): \"늦잠 자다\". 睡觉(shuìjiào)처럼 이합사라서 사이에 수식어가 들어감. (睡了个懒觉(shuì le ge lǎnjiào)) 주요 단어 단어 병음 뜻 差点儿 chàdiǎnr 하마터면, 거의 钥匙 yàoshi 열쇠 忘 wàng 잊다, 깜빡하다 幸亏 xìngkuī 다행히 同事 tóngshì 동료 提醒 tíxǐng 일깨워 주다, 알려 주다 睡懒觉 shuì lǎnjiào 늦잠 자다 连……都 lián……dōu ~조차도 早饭 zǎofàn 아침밥 관련 비즈니스 중국어 노트 이전: 중국어 Day 05 · 다음: 중국어 Day 07"}, {"title": "중국어 Day 07", "category": "chinese", "updated": "2026-11-15", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: Day 7 · 2026-11-15 (일상)<\/li>\n<\/ul>\n<h2>1. 你回来的路上顺便帮我买瓶牛奶，冰箱里一瓶都没有了。<\/h2>\n<ul>\n<li>병음: Nǐ huílai de lùshang shùnbiàn bāng wǒ mǎi píng niúnǎi, bīngxiāng li yì píng dōu méiyǒu le.<\/li>\n<li>뜻: 돌아오는 길에 겸사겸사 우유 한 병만 사다 줘. 냉장고에 한 병도 없어.<\/li>\n<li>문법:<ul>\n<li>……的路上(de lùshang): \"~하는 길에\". 이동 중에 무언가를 할 때 씀. (上班的路上(shàngbān de lùshang), 回家的路上(huí jiā de lùshang))<\/li>\n<li>顺便(shùnbiàn) + 동사: \"~하는 김에\". 원래 하던 일에 다른 일을 덧붙일 때 씀. (顺便去趟超市(shùnbiàn qù tàng chāoshì))<\/li>\n<li>帮(bāng) + 사람 + 동사: \"~에게 ~해 주다\". 부탁할 때 아주 자주 씀. (帮我看看(bāng wǒ kànkan), 帮我拿着(bāng wǒ ná zhe))<\/li>\n<li>一(yī) + 양사 + 都(dōu) + 没有(méiyǒu): \"하나도 없다\". 강한 부정을 나타냄. (一个人都没有(yí ge rén dōu méiyǒu), 一分钱都没有(yì fēn qián dōu méiyǒu))<\/li>\n<li>买瓶牛奶(mǎi píng niúnǎi): 회화에서는 동사 뒤 수사 一(yī)를 자주 생략함. (喝杯咖啡(hē bēi kāfēi))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. 这部电视剧我看了一半就看不下去了，你还是别浪费时间了。<\/h2>\n<ul>\n<li>병음: Zhè bù diànshìjù wǒ kàn le yíbàn jiù kàn bu xiàqù le, nǐ háishi bié làngfèi shíjiān le.<\/li>\n<li>뜻: 이 드라마 반쯤 보다가 더는 못 보겠더라. 너는 시간 낭비하지 않는 게 좋겠어.<\/li>\n<li>문법:<ul>\n<li>동사 + 不下去(bu xiàqù): 가능보어 부정형, \"(더 이상) 계속 ~할 수 없다\". 긍정은 看得下去(kàn de xiàqù). (听不下去(tīng bu xiàqù), 吃不下去(chī bu xiàqù))<\/li>\n<li>还是(háishi) + 别(bié) + 동사 + 了(le): \"~하지 않는 게 낫겠다\". 상대에게 조언할 때 씀. (你还是早点儿睡吧(nǐ háishi zǎo diǎnr shuì ba))<\/li>\n<li>了一半就(le yíbàn jiù): \"반만 ~하고 바로\". 就(jiù)가 예상보다 일찍 멈췄다는 느낌을 줌.<\/li>\n<li>部(bù): 영화·드라마를 세는 양사. (一部电影(yí bù diànyǐng))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>路上<\/td>\n<td>lùshang<\/td>\n<td>길에, 가는 도중<\/td>\n<\/tr>\n<tr>\n<td>顺便<\/td>\n<td>shùnbiàn<\/td>\n<td>~하는 김에<\/td>\n<\/tr>\n<tr>\n<td>帮<\/td>\n<td>bāng<\/td>\n<td>돕다, ~해 주다<\/td>\n<\/tr>\n<tr>\n<td>瓶<\/td>\n<td>píng<\/td>\n<td>병 (양사)<\/td>\n<\/tr>\n<tr>\n<td>牛奶<\/td>\n<td>niúnǎi<\/td>\n<td>우유<\/td>\n<\/tr>\n<tr>\n<td>冰箱<\/td>\n<td>bīngxiāng<\/td>\n<td>냉장고<\/td>\n<\/tr>\n<tr>\n<td>部<\/td>\n<td>bù<\/td>\n<td>(영화·드라마를 세는) 양사<\/td>\n<\/tr>\n<tr>\n<td>电视剧<\/td>\n<td>diànshìjù<\/td>\n<td>드라마<\/td>\n<\/tr>\n<tr>\n<td>一半<\/td>\n<td>yíbàn<\/td>\n<td>절반<\/td>\n<\/tr>\n<tr>\n<td>看不下去<\/td>\n<td>kàn bu xiàqù<\/td>\n<td>계속 볼 수 없다<\/td>\n<\/tr>\n<tr>\n<td>还是<\/td>\n<td>háishi<\/td>\n<td>~하는 편이 낫다<\/td>\n<\/tr>\n<tr>\n<td>浪费<\/td>\n<td>làngfèi<\/td>\n<td>낭비하다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 06\">중국어 Day 06<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 08\">중국어 Day 08<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: Day 7 · 2026-11-15 (일상) 1. 你回来的路上顺便帮我买瓶牛奶，冰箱里一瓶都没有了。 병음: Nǐ huílai de lùshang shùnbiàn bāng wǒ mǎi píng niúnǎi, bīngxiāng li yì píng dōu méiyǒu le. 뜻: 돌아오는 길에 겸사겸사 우유 한 병만 사다 줘. 냉장고에 한 병도 없어. 문법: ……的路上(de lùshang): \"~하는 길에\". 이동 중에 무언가를 할 때 씀. (上班的路上(shàngbān de lùshang), 回家的路上(huí jiā de lùshang)) 顺便(shùnbiàn) + 동사: \"~하는 김에\". 원래 하던 일에 다른 일을 덧붙일 때 씀. (顺便去趟超市(shùnbiàn qù tàng chāoshì)) 帮(bāng) + 사람 + 동사: \"~에게 ~해 주다\". 부탁할 때 아주 자주 씀. (帮我看看(bāng wǒ kànkan), 帮我拿着(bāng wǒ ná zhe)) 一(yī) + 양사 + 都(dōu) + 没有(méiyǒu): \"하나도 없다\". 강한 부정을 나타냄. (一个人都没有(yí ge rén dōu méiyǒu), 一分钱都没有(yì fēn qián dōu méiyǒu)) 买瓶牛奶(mǎi píng niúnǎi): 회화에서는 동사 뒤 수사 一(yī)를 자주 생략함. (喝杯咖啡(hē bēi kāfēi)) 2. 这部电视剧我看了一半就看不下去了，你还是别浪费时间了。 병음: Zhè bù diànshìjù wǒ kàn le yíbàn jiù kàn bu xiàqù le, nǐ háishi bié làngfèi shíjiān le. 뜻: 이 드라마 반쯤 보다가 더는 못 보겠더라. 너는 시간 낭비하지 않는 게 좋겠어. 문법: 동사 + 不下去(bu xiàqù): 가능보어 부정형, \"(더 이상) 계속 ~할 수 없다\". 긍정은 看得下去(kàn de xiàqù). (听不下去(tīng bu xiàqù), 吃不下去(chī bu xiàqù)) 还是(háishi) + 别(bié) + 동사 + 了(le): \"~하지 않는 게 낫겠다\". 상대에게 조언할 때 씀. (你还是早点儿睡吧(nǐ háishi zǎo diǎnr shuì ba)) 了一半就(le yíbàn jiù): \"반만 ~하고 바로\". 就(jiù)가 예상보다 일찍 멈췄다는 느낌을 줌. 部(bù): 영화·드라마를 세는 양사. (一部电影(yí bù diànyǐng)) 주요 단어 단어 병음 뜻 路上 lùshang 길에, 가는 도중 顺便 shùnbiàn ~하는 김에 帮 bāng 돕다, ~해 주다 瓶 píng 병 (양사) 牛奶 niúnǎi 우유 冰箱 bīngxiāng 냉장고 部 bù (영화·드라마를 세는) 양사 电视剧 diànshìjù 드라마 一半 yíbàn 절반 看不下去 kàn bu xiàqù 계속 볼 수 없다 还是 háishi ~하는 편이 낫다 浪费 làngfèi 낭비하다 관련 비즈니스 중국어 노트 이전: 중국어 Day 06 · 다음: 중국어 Day 08"}, {"title": "중국어 Day 08", "category": "chinese", "updated": "2026-11-16", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: Day 8 · 2026-11-16 (일상)<\/li>\n<\/ul>\n<h2>1. 外卖估计还得等二十分钟才能到，你饿了就先吃点儿水果。<\/h2>\n<ul>\n<li>병음: Wàimài gūjì hái děi děng èrshí fēnzhōng cái néng dào, nǐ è le jiù xiān chī diǎnr shuǐguǒ.<\/li>\n<li>뜻: 배달 음식은 20분은 더 기다려야 올 것 같아. 배고프면 먼저 과일 좀 먹어.<\/li>\n<li>문법:<ul>\n<li>估计(gūjì) + 문장: \"아마 ~일 것 같다\". 회화에서 추측할 때 아주 자주 씀. (估计他不来了(gūjì tā bù lái le))<\/li>\n<li>还得(hái děi) + 동사: \"아직 더 ~해야 한다\". 이때 得는 děi로 읽음. (还得等一会儿(hái děi děng yíhuìr))<\/li>\n<li>才(cái) + 동사: \"그제야, 겨우 ~하다\". 예상보다 늦거나 오래 걸림을 나타냄. 就(jiù)와 반대 느낌. (他十点才起床(tā shí diǎn cái qǐchuáng))<\/li>\n<li>A了(le)就(jiù)B: \"A하면 (바로) B해\". 조건이 생기면 그렇게 하라는 가벼운 권유. (累了就休息(lèi le jiù xiūxi))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. 我最近迷上了做饭，不管多累，下班回家都要自己做一顿。<\/h2>\n<ul>\n<li>병음: Wǒ zuìjìn míshàng le zuò fàn, bùguǎn duō lèi, xiàbān huí jiā dōu yào zìjǐ zuò yí dùn.<\/li>\n<li>뜻: 나 요즘 요리에 빠졌어. 아무리 피곤해도 퇴근하고 집에 오면 꼭 직접 한 끼 해 먹어.<\/li>\n<li>문법:<ul>\n<li>迷上(míshàng) + 대상: \"~에 푹 빠지다\". 방향보어 上(shàng)이 \"~하기 시작해 붙다\"의 뜻. (爱上(àishàng), 喜欢上(xǐhuan shàng))<\/li>\n<li>不管(bùguǎn) + 多(duō) + 형용사, ……都(dōu)……: \"아무리 ~해도 ~한다\". 조건에 상관없이 결과가 같음. (不管多忙，都要吃早饭(bùguǎn duō máng, dōu yào chī zǎofàn))<\/li>\n<li>要(yào) + 동사: 여기서는 \"꼭 ~하려고 한다\". 의지·습관을 나타냄.<\/li>\n<li>顿(dùn): 끼니를 세는 양사. (吃一顿饭(chī yí dùn fàn), 请你吃顿饭(qǐng nǐ chī dùn fàn))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>外卖<\/td>\n<td>wàimài<\/td>\n<td>배달 음식<\/td>\n<\/tr>\n<tr>\n<td>估计<\/td>\n<td>gūjì<\/td>\n<td>아마 ~일 것 같다, 추측하다<\/td>\n<\/tr>\n<tr>\n<td>得<\/td>\n<td>děi<\/td>\n<td>~해야 한다<\/td>\n<\/tr>\n<tr>\n<td>才<\/td>\n<td>cái<\/td>\n<td>그제야, 겨우<\/td>\n<\/tr>\n<tr>\n<td>饿<\/td>\n<td>è<\/td>\n<td>배고프다<\/td>\n<\/tr>\n<tr>\n<td>水果<\/td>\n<td>shuǐguǒ<\/td>\n<td>과일<\/td>\n<\/tr>\n<tr>\n<td>最近<\/td>\n<td>zuìjìn<\/td>\n<td>요즘, 최근<\/td>\n<\/tr>\n<tr>\n<td>迷上<\/td>\n<td>míshàng<\/td>\n<td>~에 빠지다<\/td>\n<\/tr>\n<tr>\n<td>做饭<\/td>\n<td>zuò fàn<\/td>\n<td>밥을 하다, 요리하다<\/td>\n<\/tr>\n<tr>\n<td>不管<\/td>\n<td>bùguǎn<\/td>\n<td>~에 관계없이<\/td>\n<\/tr>\n<tr>\n<td>累<\/td>\n<td>lèi<\/td>\n<td>피곤하다<\/td>\n<\/tr>\n<tr>\n<td>顿<\/td>\n<td>dùn<\/td>\n<td>끼니 (양사)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 07\">중국어 Day 07<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 09\">중국어 Day 09<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: Day 8 · 2026-11-16 (일상) 1. 外卖估计还得等二十分钟才能到，你饿了就先吃点儿水果。 병음: Wàimài gūjì hái děi děng èrshí fēnzhōng cái néng dào, nǐ è le jiù xiān chī diǎnr shuǐguǒ. 뜻: 배달 음식은 20분은 더 기다려야 올 것 같아. 배고프면 먼저 과일 좀 먹어. 문법: 估计(gūjì) + 문장: \"아마 ~일 것 같다\". 회화에서 추측할 때 아주 자주 씀. (估计他不来了(gūjì tā bù lái le)) 还得(hái děi) + 동사: \"아직 더 ~해야 한다\". 이때 得는 děi로 읽음. (还得等一会儿(hái děi děng yíhuìr)) 才(cái) + 동사: \"그제야, 겨우 ~하다\". 예상보다 늦거나 오래 걸림을 나타냄. 就(jiù)와 반대 느낌. (他十点才起床(tā shí diǎn cái qǐchuáng)) A了(le)就(jiù)B: \"A하면 (바로) B해\". 조건이 생기면 그렇게 하라는 가벼운 권유. (累了就休息(lèi le jiù xiūxi)) 2. 我最近迷上了做饭，不管多累，下班回家都要自己做一顿。 병음: Wǒ zuìjìn míshàng le zuò fàn, bùguǎn duō lèi, xiàbān huí jiā dōu yào zìjǐ zuò yí dùn. 뜻: 나 요즘 요리에 빠졌어. 아무리 피곤해도 퇴근하고 집에 오면 꼭 직접 한 끼 해 먹어. 문법: 迷上(míshàng) + 대상: \"~에 푹 빠지다\". 방향보어 上(shàng)이 \"~하기 시작해 붙다\"의 뜻. (爱上(àishàng), 喜欢上(xǐhuan shàng)) 不管(bùguǎn) + 多(duō) + 형용사, ……都(dōu)……: \"아무리 ~해도 ~한다\". 조건에 상관없이 결과가 같음. (不管多忙，都要吃早饭(bùguǎn duō máng, dōu yào chī zǎofàn)) 要(yào) + 동사: 여기서는 \"꼭 ~하려고 한다\". 의지·습관을 나타냄. 顿(dùn): 끼니를 세는 양사. (吃一顿饭(chī yí dùn fàn), 请你吃顿饭(qǐng nǐ chī dùn fàn)) 주요 단어 단어 병음 뜻 外卖 wàimài 배달 음식 估计 gūjì 아마 ~일 것 같다, 추측하다 得 děi ~해야 한다 才 cái 그제야, 겨우 饿 è 배고프다 水果 shuǐguǒ 과일 最近 zuìjìn 요즘, 최근 迷上 míshàng ~에 빠지다 做饭 zuò fàn 밥을 하다, 요리하다 不管 bùguǎn ~에 관계없이 累 lèi 피곤하다 顿 dùn 끼니 (양사) 관련 비즈니스 중국어 노트 이전: 중국어 Day 07 · 다음: 중국어 Day 09"}, {"title": "중국어 Day 09", "category": "chinese", "updated": "2026-11-17", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: Day 9 · 2026-11-17 (일상)<\/li>\n<\/ul>\n<h2>1. 我昨晚怎么也睡不着，干脆起来看了会儿书。<\/h2>\n<ul>\n<li>병음: Wǒ zuówǎn zěnme yě shuì bu zháo, gāncuì qǐlai kàn le huìr shū.<\/li>\n<li>뜻: 어젯밤에 아무리 해도 잠이 안 와서, 아예 일어나서 잠깐 책을 봤어.<\/li>\n<li>문법:<ul>\n<li>怎么(zěnme) + 也(yě) + 부정: \"아무리 해도 ~이 안 되다\". 노력해도 안 될 때 씀. (怎么也找不到(zěnme yě zhǎo bu dào), 怎么也想不起来(zěnme yě xiǎng bu qǐlái))<\/li>\n<li>睡不着(shuì bu zháo): 결과보어 着(zháo) \"(목적을) 이루다\"의 가능보어 부정형, \"잠들 수 없다\". 긍정은 睡得着(shuì de zháo). (买不着(mǎi bu zháo), 找不着(zhǎo bu zháo))<\/li>\n<li>干脆(gāncuì) + 동사: \"아예, 차라리 (시원하게) ~하다\". 고민하다가 결단을 내릴 때 씀. (干脆打车吧(gāncuì dǎchē ba), 干脆不去了(gāncuì bú qù le))<\/li>\n<li>동사 + 了(le) + (一)会儿(huìr) + 목적어: \"잠깐 ~했다\". 시량보어는 동사와 목적어 사이에 옴. (聊了会儿天(liáo le huìr tiān), 玩了会儿手机(wán le huìr shǒujī))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. 这件衣服我穿着有点儿大，能不能换小一号的？<\/h2>\n<ul>\n<li>병음: Zhè jiàn yīfu wǒ chuān zhe yǒudiǎnr dà, néng bu néng huàn xiǎo yí hào de?<\/li>\n<li>뜻: 이 옷 입어 보니 좀 커요. 한 치수 작은 걸로 바꿀 수 있을까요?<\/li>\n<li>문법:<ul>\n<li>동사 + 着(zhe) + 형용사: \"~해 보니 ~하다\". 직접 해 본 느낌을 말할 때 씀. (听着不错(tīng zhe búcuò), 看着挺好吃(kàn zhe tǐng hǎochī))<\/li>\n<li>有点儿(yǒudiǎnr) + 형용사: \"좀 ~하다\". 주로 불만·아쉬움 등 부정적인 느낌. 一点儿(yìdiǎnr)은 형용사 뒤에 옴. (有点儿贵(yǒudiǎnr guì) ↔ 便宜一点儿(piányi yìdiǎnr))<\/li>\n<li>能不能(néng bu néng) + 동사: 정반의문문, \"~할 수 있어요?\" 부탁을 부드럽게 함. (能不能便宜点儿(néng bu néng piányi diǎnr))<\/li>\n<li>형용사 + 一号(yí hào): \"한 치수 ~한\". 小一号(xiǎo yí hào) \"한 치수 작은\", 大一号(dà yí hào) \"한 치수 큰\". 的(de)로 끝나 \"~한 것\"을 나타냄.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>昨晚<\/td>\n<td>zuówǎn<\/td>\n<td>어젯밤<\/td>\n<\/tr>\n<tr>\n<td>睡不着<\/td>\n<td>shuì bu zháo<\/td>\n<td>잠이 오지 않다<\/td>\n<\/tr>\n<tr>\n<td>干脆<\/td>\n<td>gāncuì<\/td>\n<td>아예, 차라리<\/td>\n<\/tr>\n<tr>\n<td>起来<\/td>\n<td>qǐlai<\/td>\n<td>일어나다<\/td>\n<\/tr>\n<tr>\n<td>会儿<\/td>\n<td>huìr<\/td>\n<td>잠깐, 잠시<\/td>\n<\/tr>\n<tr>\n<td>件<\/td>\n<td>jiàn<\/td>\n<td>(옷을 세는) 양사<\/td>\n<\/tr>\n<tr>\n<td>有点儿<\/td>\n<td>yǒudiǎnr<\/td>\n<td>좀, 약간 (부정적 느낌)<\/td>\n<\/tr>\n<tr>\n<td>换<\/td>\n<td>huàn<\/td>\n<td>바꾸다, 교환하다<\/td>\n<\/tr>\n<tr>\n<td>号<\/td>\n<td>hào<\/td>\n<td>사이즈, 치수<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 08\">중국어 Day 08<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 10\">중국어 Day 10<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: Day 9 · 2026-11-17 (일상) 1. 我昨晚怎么也睡不着，干脆起来看了会儿书。 병음: Wǒ zuówǎn zěnme yě shuì bu zháo, gāncuì qǐlai kàn le huìr shū. 뜻: 어젯밤에 아무리 해도 잠이 안 와서, 아예 일어나서 잠깐 책을 봤어. 문법: 怎么(zěnme) + 也(yě) + 부정: \"아무리 해도 ~이 안 되다\". 노력해도 안 될 때 씀. (怎么也找不到(zěnme yě zhǎo bu dào), 怎么也想不起来(zěnme yě xiǎng bu qǐlái)) 睡不着(shuì bu zháo): 결과보어 着(zháo) \"(목적을) 이루다\"의 가능보어 부정형, \"잠들 수 없다\". 긍정은 睡得着(shuì de zháo). (买不着(mǎi bu zháo), 找不着(zhǎo bu zháo)) 干脆(gāncuì) + 동사: \"아예, 차라리 (시원하게) ~하다\". 고민하다가 결단을 내릴 때 씀. (干脆打车吧(gāncuì dǎchē ba), 干脆不去了(gāncuì bú qù le)) 동사 + 了(le) + (一)会儿(huìr) + 목적어: \"잠깐 ~했다\". 시량보어는 동사와 목적어 사이에 옴. (聊了会儿天(liáo le huìr tiān), 玩了会儿手机(wán le huìr shǒujī)) 2. 这件衣服我穿着有点儿大，能不能换小一号的？ 병음: Zhè jiàn yīfu wǒ chuān zhe yǒudiǎnr dà, néng bu néng huàn xiǎo yí hào de? 뜻: 이 옷 입어 보니 좀 커요. 한 치수 작은 걸로 바꿀 수 있을까요? 문법: 동사 + 着(zhe) + 형용사: \"~해 보니 ~하다\". 직접 해 본 느낌을 말할 때 씀. (听着不错(tīng zhe búcuò), 看着挺好吃(kàn zhe tǐng hǎochī)) 有点儿(yǒudiǎnr) + 형용사: \"좀 ~하다\". 주로 불만·아쉬움 등 부정적인 느낌. 一点儿(yìdiǎnr)은 형용사 뒤에 옴. (有点儿贵(yǒudiǎnr guì) ↔ 便宜一点儿(piányi yìdiǎnr)) 能不能(néng bu néng) + 동사: 정반의문문, \"~할 수 있어요?\" 부탁을 부드럽게 함. (能不能便宜点儿(néng bu néng piányi diǎnr)) 형용사 + 一号(yí hào): \"한 치수 ~한\". 小一号(xiǎo yí hào) \"한 치수 작은\", 大一号(dà yí hào) \"한 치수 큰\". 的(de)로 끝나 \"~한 것\"을 나타냄. 주요 단어 단어 병음 뜻 昨晚 zuówǎn 어젯밤 睡不着 shuì bu zháo 잠이 오지 않다 干脆 gāncuì 아예, 차라리 起来 qǐlai 일어나다 会儿 huìr 잠깐, 잠시 件 jiàn (옷을 세는) 양사 有点儿 yǒudiǎnr 좀, 약간 (부정적 느낌) 换 huàn 바꾸다, 교환하다 号 hào 사이즈, 치수 관련 비즈니스 중국어 노트 이전: 중국어 Day 08 · 다음: 중국어 Day 10"}, {"title": "중국어 Day 10", "category": "chinese", "updated": "2026-11-18", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: Day 10 · 2026-11-18 (일상)<\/li>\n<\/ul>\n<h2>1. 早知道今天这么堵，我就坐地铁来了。<\/h2>\n<ul>\n<li>병음: Zǎo zhīdào jīntiān zhème dǔ, wǒ jiù zuò dìtiě lái le.<\/li>\n<li>뜻: 오늘 이렇게 막힐 줄 알았으면 지하철 타고 왔을 텐데.<\/li>\n<li>문법:<ul>\n<li>早知道(zǎo zhīdào)……，就(jiù)……了(le): \"진작 ~인 줄 알았으면 ~했을 텐데\". 이미 지난 일을 후회할 때 씀. (早知道你也去，我就等你了(zǎo zhīdào nǐ yě qù, wǒ jiù děng nǐ le))<\/li>\n<li>这么(zhème) + 형용사: \"이렇게 ~하다\". 예상보다 정도가 심할 때 씀. (这么贵(zhème guì), 这么晚(zhème wǎn))<\/li>\n<li>堵(dǔ): \"(길이) 막히다\". 회화에서는 堵车(dǔchē)로도 자주 씀. (路上很堵(lùshang hěn dǔ))<\/li>\n<li>坐(zuò) + 교통수단 + 来/去(lái/qù): \"~을 타고 오다/가다\". 수단을 먼저, 이동 동사를 뒤에 씀. (坐公交去(zuò gōngjiāo qù), 坐飞机来(zuò fēijī lái))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. 你上次推荐的那家面馆我去过了，味道确实不错，难怪每次都没有空位。<\/h2>\n<ul>\n<li>병음: Nǐ shàng cì tuījiàn de nà jiā miànguǎn wǒ qù guo le, wèidào quèshí búcuò, nánguài měi cì dōu méiyǒu kòngwèi.<\/li>\n<li>뜻: 네가 지난번에 추천해 준 그 국숫집 가 봤어. 맛이 정말 괜찮더라. 어쩐지 갈 때마다 빈자리가 없더라니.<\/li>\n<li>문법:<ul>\n<li>수식어 + 的(de) + 那(nà) + 양사 + 명사: \"~한 그 ~\". 긴 수식어로 대상을 특정함. (你说的那本书(nǐ shuō de nà běn shū), 昨天见的那个人(zuótiān jiàn de nà ge rén))<\/li>\n<li>동사 + 过(guo): \"~해 본 적 있다\". 경험을 나타냄. 부정은 没(méi) + 동사 + 过(guo). (我吃过(wǒ chī guo), 没去过(méi qù guo))<\/li>\n<li>确实(quèshí): \"확실히, 정말로\". 상대 말이나 소문이 맞다고 인정할 때 씀. (确实挺好(quèshí tǐng hǎo))<\/li>\n<li>难怪(nánguài): \"어쩐지, 그러니까 ~했구나\". 이유를 알고 나서 납득할 때 씀. (难怪这么便宜(nánguài zhème piányi), 难怪他不高兴(nánguài tā bù gāoxìng))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>早知道<\/td>\n<td>zǎo zhīdào<\/td>\n<td>진작 알았더라면<\/td>\n<\/tr>\n<tr>\n<td>这么<\/td>\n<td>zhème<\/td>\n<td>이렇게<\/td>\n<\/tr>\n<tr>\n<td>堵<\/td>\n<td>dǔ<\/td>\n<td>(길이) 막히다<\/td>\n<\/tr>\n<tr>\n<td>坐<\/td>\n<td>zuò<\/td>\n<td>(교통수단을) 타다<\/td>\n<\/tr>\n<tr>\n<td>地铁<\/td>\n<td>dìtiě<\/td>\n<td>지하철<\/td>\n<\/tr>\n<tr>\n<td>推荐<\/td>\n<td>tuījiàn<\/td>\n<td>추천하다<\/td>\n<\/tr>\n<tr>\n<td>面馆<\/td>\n<td>miànguǎn<\/td>\n<td>국숫집<\/td>\n<\/tr>\n<tr>\n<td>味道<\/td>\n<td>wèidào<\/td>\n<td>맛<\/td>\n<\/tr>\n<tr>\n<td>确实<\/td>\n<td>quèshí<\/td>\n<td>확실히, 정말로<\/td>\n<\/tr>\n<tr>\n<td>难怪<\/td>\n<td>nánguài<\/td>\n<td>어쩐지<\/td>\n<\/tr>\n<tr>\n<td>空位<\/td>\n<td>kòngwèi<\/td>\n<td>빈자리<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 09\">중국어 Day 09<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 11\">중국어 Day 11<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: Day 10 · 2026-11-18 (일상) 1. 早知道今天这么堵，我就坐地铁来了。 병음: Zǎo zhīdào jīntiān zhème dǔ, wǒ jiù zuò dìtiě lái le. 뜻: 오늘 이렇게 막힐 줄 알았으면 지하철 타고 왔을 텐데. 문법: 早知道(zǎo zhīdào)……，就(jiù)……了(le): \"진작 ~인 줄 알았으면 ~했을 텐데\". 이미 지난 일을 후회할 때 씀. (早知道你也去，我就等你了(zǎo zhīdào nǐ yě qù, wǒ jiù děng nǐ le)) 这么(zhème) + 형용사: \"이렇게 ~하다\". 예상보다 정도가 심할 때 씀. (这么贵(zhème guì), 这么晚(zhème wǎn)) 堵(dǔ): \"(길이) 막히다\". 회화에서는 堵车(dǔchē)로도 자주 씀. (路上很堵(lùshang hěn dǔ)) 坐(zuò) + 교통수단 + 来/去(lái/qù): \"~을 타고 오다/가다\". 수단을 먼저, 이동 동사를 뒤에 씀. (坐公交去(zuò gōngjiāo qù), 坐飞机来(zuò fēijī lái)) 2. 你上次推荐的那家面馆我去过了，味道确实不错，难怪每次都没有空位。 병음: Nǐ shàng cì tuījiàn de nà jiā miànguǎn wǒ qù guo le, wèidào quèshí búcuò, nánguài měi cì dōu méiyǒu kòngwèi. 뜻: 네가 지난번에 추천해 준 그 국숫집 가 봤어. 맛이 정말 괜찮더라. 어쩐지 갈 때마다 빈자리가 없더라니. 문법: 수식어 + 的(de) + 那(nà) + 양사 + 명사: \"~한 그 ~\". 긴 수식어로 대상을 특정함. (你说的那本书(nǐ shuō de nà běn shū), 昨天见的那个人(zuótiān jiàn de nà ge rén)) 동사 + 过(guo): \"~해 본 적 있다\". 경험을 나타냄. 부정은 没(méi) + 동사 + 过(guo). (我吃过(wǒ chī guo), 没去过(méi qù guo)) 确实(quèshí): \"확실히, 정말로\". 상대 말이나 소문이 맞다고 인정할 때 씀. (确实挺好(quèshí tǐng hǎo)) 难怪(nánguài): \"어쩐지, 그러니까 ~했구나\". 이유를 알고 나서 납득할 때 씀. (难怪这么便宜(nánguài zhème piányi), 难怪他不高兴(nánguài tā bù gāoxìng)) 주요 단어 단어 병음 뜻 早知道 zǎo zhīdào 진작 알았더라면 这么 zhème 이렇게 堵 dǔ (길이) 막히다 坐 zuò (교통수단을) 타다 地铁 dìtiě 지하철 推荐 tuījiàn 추천하다 面馆 miànguǎn 국숫집 味道 wèidào 맛 确实 quèshí 확실히, 정말로 难怪 nánguài 어쩐지 空位 kòngwèi 빈자리 관련 비즈니스 중국어 노트 이전: 중국어 Day 09 · 다음: 중국어 Day 11"}, {"title": "중국어 Day 11", "category": "chinese", "updated": "2026-11-19", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: Day 11 · 2026-11-19 (일상)<\/li>\n<\/ul>\n<h2>1. 你先别急着挂电话，我还有件事没说完呢。<\/h2>\n<ul>\n<li>병음: Nǐ xiān bié jízhe guà diànhuà, wǒ hái yǒu jiàn shì méi shuō wán ne.<\/li>\n<li>뜻: 아직 전화 끊지 마. 나 아직 할 얘기 다 못 했어.<\/li>\n<li>문법:<ul>\n<li>先别(xiān bié) + 동사: \"일단 ~하지 마\". 상대의 행동을 잠깐 멈추게 할 때 씀. (先别走(xiān bié zǒu), 先别告诉他(xiān bié gàosu tā))<\/li>\n<li>急着(jízhe) + 동사: \"서둘러 ~하려 하다, 급하게 ~하다\". 别(bié)와 함께 \"서두르지 마\"로 자주 씀. (急着回家(jízhe huí jiā), 别急着做决定(bié jízhe zuò juédìng))<\/li>\n<li>동사 + 完(wán): 결과보어, \"다 ~하다, ~을 끝내다\". 부정은 没(méi) + 동사 + 完(wán). (吃完了(chī wán le), 还没看完(hái méi kàn wán))<\/li>\n<li>还(hái)……呢(ne): \"아직 ~한 상태야\". 상황이 계속되고 있음을 부드럽게 강조함. (他还在睡觉呢(tā hái zài shuìjiào ne), 我还没吃饭呢(wǒ hái méi chī fàn ne))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. 除了周一以外，这周我晚上都行，你看哪天方便？<\/h2>\n<ul>\n<li>병음: Chúle zhōuyī yǐwài, zhè zhōu wǒ wǎnshang dōu xíng, nǐ kàn nǎ tiān fāngbiàn?<\/li>\n<li>뜻: 월요일 빼고 이번 주 저녁은 다 괜찮아. 너는 언제가 편해?<\/li>\n<li>문법:<ul>\n<li>除了(chúle)……以外(yǐwài)，都(dōu)……: \"~을 빼고 모두 ~\". 뒤에 也(yě)/还(hái)가 오면 \"~외에도 또\"라는 뜻이 됨. (除了他以外，大家都来了(chúle tā yǐwài, dàjiā dōu lái le) / 除了咖啡，我也喜欢喝茶(chúle kāfēi, wǒ yě xǐhuan hē chá))<\/li>\n<li>行(xíng): \"괜찮다, 된다\". 약속·제안에 동의할 때 짧게 씀. (明天也行(míngtiān yě xíng), 这样行不行?(zhèyàng xíng bu xíng))<\/li>\n<li>你看(nǐ kàn) + 질문: \"네 생각엔 ~?\" 상대의 의견을 물을 때 씀. 여기서 看(kàn)은 \"보다\"가 아니라 \"판단하다\". (你看怎么样?(nǐ kàn zěnmeyàng))<\/li>\n<li>方便(fāngbiàn): \"(시간·형편이) 괜찮다, 편하다\". 약속 잡을 때 상대 사정을 배려하는 표현. (你什么时候方便?(nǐ shénme shíhou fāngbiàn))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>先<\/td>\n<td>xiān<\/td>\n<td>먼저, 일단<\/td>\n<\/tr>\n<tr>\n<td>急着<\/td>\n<td>jízhe<\/td>\n<td>서둘러 ~하려 하다<\/td>\n<\/tr>\n<tr>\n<td>挂电话<\/td>\n<td>guà diànhuà<\/td>\n<td>전화를 끊다<\/td>\n<\/tr>\n<tr>\n<td>说完<\/td>\n<td>shuō wán<\/td>\n<td>말을 다 하다<\/td>\n<\/tr>\n<tr>\n<td>除了……以外<\/td>\n<td>chúle……yǐwài<\/td>\n<td>~을 제외하고<\/td>\n<\/tr>\n<tr>\n<td>周一<\/td>\n<td>zhōuyī<\/td>\n<td>월요일<\/td>\n<\/tr>\n<tr>\n<td>晚上<\/td>\n<td>wǎnshang<\/td>\n<td>저녁, 밤<\/td>\n<\/tr>\n<tr>\n<td>行<\/td>\n<td>xíng<\/td>\n<td>괜찮다, 된다<\/td>\n<\/tr>\n<tr>\n<td>哪天<\/td>\n<td>nǎ tiān<\/td>\n<td>어느 날<\/td>\n<\/tr>\n<tr>\n<td>方便<\/td>\n<td>fāngbiàn<\/td>\n<td>(형편이) 괜찮다, 편하다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 10\">중국어 Day 10<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 12\">중국어 Day 12<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: Day 11 · 2026-11-19 (일상) 1. 你先别急着挂电话，我还有件事没说完呢。 병음: Nǐ xiān bié jízhe guà diànhuà, wǒ hái yǒu jiàn shì méi shuō wán ne. 뜻: 아직 전화 끊지 마. 나 아직 할 얘기 다 못 했어. 문법: 先别(xiān bié) + 동사: \"일단 ~하지 마\". 상대의 행동을 잠깐 멈추게 할 때 씀. (先别走(xiān bié zǒu), 先别告诉他(xiān bié gàosu tā)) 急着(jízhe) + 동사: \"서둘러 ~하려 하다, 급하게 ~하다\". 别(bié)와 함께 \"서두르지 마\"로 자주 씀. (急着回家(jízhe huí jiā), 别急着做决定(bié jízhe zuò juédìng)) 동사 + 完(wán): 결과보어, \"다 ~하다, ~을 끝내다\". 부정은 没(méi) + 동사 + 完(wán). (吃完了(chī wán le), 还没看完(hái méi kàn wán)) 还(hái)……呢(ne): \"아직 ~한 상태야\". 상황이 계속되고 있음을 부드럽게 강조함. (他还在睡觉呢(tā hái zài shuìjiào ne), 我还没吃饭呢(wǒ hái méi chī fàn ne)) 2. 除了周一以外，这周我晚上都行，你看哪天方便？ 병음: Chúle zhōuyī yǐwài, zhè zhōu wǒ wǎnshang dōu xíng, nǐ kàn nǎ tiān fāngbiàn? 뜻: 월요일 빼고 이번 주 저녁은 다 괜찮아. 너는 언제가 편해? 문법: 除了(chúle)……以外(yǐwài)，都(dōu)……: \"~을 빼고 모두 ~\". 뒤에 也(yě)/还(hái)가 오면 \"~외에도 또\"라는 뜻이 됨. (除了他以外，大家都来了(chúle tā yǐwài, dàjiā dōu lái le) / 除了咖啡，我也喜欢喝茶(chúle kāfēi, wǒ yě xǐhuan hē chá)) 行(xíng): \"괜찮다, 된다\". 약속·제안에 동의할 때 짧게 씀. (明天也行(míngtiān yě xíng), 这样行不行?(zhèyàng xíng bu xíng)) 你看(nǐ kàn) + 질문: \"네 생각엔 ~?\" 상대의 의견을 물을 때 씀. 여기서 看(kàn)은 \"보다\"가 아니라 \"판단하다\". (你看怎么样?(nǐ kàn zěnmeyàng)) 方便(fāngbiàn): \"(시간·형편이) 괜찮다, 편하다\". 약속 잡을 때 상대 사정을 배려하는 표현. (你什么时候方便?(nǐ shénme shíhou fāngbiàn)) 주요 단어 단어 병음 뜻 先 xiān 먼저, 일단 急着 jízhe 서둘러 ~하려 하다 挂电话 guà diànhuà 전화를 끊다 说完 shuō wán 말을 다 하다 除了……以外 chúle……yǐwài ~을 제외하고 周一 zhōuyī 월요일 晚上 wǎnshang 저녁, 밤 行 xíng 괜찮다, 된다 哪天 nǎ tiān 어느 날 方便 fāngbiàn (형편이) 괜찮다, 편하다 관련 비즈니스 중국어 노트 이전: 중국어 Day 10 · 다음: 중국어 Day 12"}, {"title": "중국어 Day 12", "category": "chinese", "updated": "2026-11-20", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: Day 12 · 2026-11-20 (일상)<\/li>\n<\/ul>\n<h2>1. 好久没收拾房间了，屋里乱得不行，这个周末非得好好打扫不可。<\/h2>\n<ul>\n<li>병음: Hǎojiǔ méi shōushi fángjiān le, wū li luàn de bùxíng, zhège zhōumò fēiděi hǎohǎo dǎsǎo bùkě.<\/li>\n<li>뜻: 오랫동안 방 정리를 안 했더니 집 안이 엉망이야. 이번 주말엔 꼭 제대로 청소해야겠어.<\/li>\n<li>문법:<ul>\n<li>好久没(hǎojiǔ méi) + 동사 + 了(le): \"오랫동안 ~ 안 했다\". 한동안 하지 않은 일을 말할 때 씀. (好久没见了(hǎojiǔ méi jiàn le), 好久没运动了(hǎojiǔ méi yùndòng le))<\/li>\n<li>형용사 + 得不行(de bùxíng): \"엄청 ~하다, ~해서 못 견디겠다\". 정도가 아주 심함을 나타내는 회화체 정도보어. (累得不行(lèi de bùxíng), 饿得不行(è de bùxíng))<\/li>\n<li>非得(fēiděi)……不可(bùkě): \"꼭 ~해야만 한다\". 강한 필요나 결심을 나타냄. 회화에서는 不可(bùkě)를 생략하기도 함. (今天非得做完不可(jīntiān fēiděi zuò wán bùkě))<\/li>\n<li>好好(hǎohǎo) + 동사: \"제대로, 푹 ~하다\". (好好休息(hǎohǎo xiūxi), 好好想想(hǎohǎo xiǎngxiang))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. 我正要出门，突然下起雨来了，看来今天只能在家待着了。<\/h2>\n<ul>\n<li>병음: Wǒ zhèng yào chūmén, tūrán xià qǐ yǔ lái le, kànlái jīntiān zhǐ néng zài jiā dāi zhe le.<\/li>\n<li>뜻: 막 나가려던 참에 갑자기 비가 오기 시작했어. 보아하니 오늘은 집에만 있어야겠네.<\/li>\n<li>문법:<ul>\n<li>正要(zhèng yào) + 동사: \"막 ~하려던 참이다\". 그때 다른 일이 끼어들었음을 말할 때 씀. (我正要给你打电话(wǒ zhèng yào gěi nǐ dǎ diànhuà))<\/li>\n<li>동사 + 起(qǐ) + 목적어 + 来(lái): \"~하기 시작하다\". 목적어는 起(qǐ)와 来(lái) 사이에 옴. (唱起歌来(chàng qǐ gē lái), 聊起天来(liáo qǐ tiān lái))<\/li>\n<li>看来(kànlái): \"보아하니 ~인 것 같다\". 눈앞의 상황을 근거로 판단할 때 씀. 估计(gūjì)보다 근거가 분명한 느낌. (看来他不会来了(kànlái tā bú huì lái le))<\/li>\n<li>只能(zhǐ néng) + 동사 + 了(le): \"~할 수밖에 없다\". (只能等了(zhǐ néng děng le))<\/li>\n<li>待着(dāi zhe): \"(한곳에) 머물러 있다\". 待(dāi)는 회화에서 \"있다, 머무르다\"의 뜻. (在家待着(zài jiā dāi zhe), 待了一会儿(dāi le yíhuìr))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>好久<\/td>\n<td>hǎojiǔ<\/td>\n<td>오랫동안<\/td>\n<\/tr>\n<tr>\n<td>收拾<\/td>\n<td>shōushi<\/td>\n<td>정리하다, 치우다<\/td>\n<\/tr>\n<tr>\n<td>乱<\/td>\n<td>luàn<\/td>\n<td>어지럽다, 엉망이다<\/td>\n<\/tr>\n<tr>\n<td>非得……不可<\/td>\n<td>fēiděi……bùkě<\/td>\n<td>꼭 ~해야만 한다<\/td>\n<\/tr>\n<tr>\n<td>好好<\/td>\n<td>hǎohǎo<\/td>\n<td>제대로, 잘<\/td>\n<\/tr>\n<tr>\n<td>打扫<\/td>\n<td>dǎsǎo<\/td>\n<td>청소하다<\/td>\n<\/tr>\n<tr>\n<td>正要<\/td>\n<td>zhèng yào<\/td>\n<td>막 ~하려던 참이다<\/td>\n<\/tr>\n<tr>\n<td>突然<\/td>\n<td>tūrán<\/td>\n<td>갑자기<\/td>\n<\/tr>\n<tr>\n<td>看来<\/td>\n<td>kànlái<\/td>\n<td>보아하니<\/td>\n<\/tr>\n<tr>\n<td>只能<\/td>\n<td>zhǐ néng<\/td>\n<td>~할 수밖에 없다<\/td>\n<\/tr>\n<tr>\n<td>待<\/td>\n<td>dāi<\/td>\n<td>머무르다, 있다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 11\">중국어 Day 11<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 13\">중국어 Day 13<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: Day 12 · 2026-11-20 (일상) 1. 好久没收拾房间了，屋里乱得不行，这个周末非得好好打扫不可。 병음: Hǎojiǔ méi shōushi fángjiān le, wū li luàn de bùxíng, zhège zhōumò fēiděi hǎohǎo dǎsǎo bùkě. 뜻: 오랫동안 방 정리를 안 했더니 집 안이 엉망이야. 이번 주말엔 꼭 제대로 청소해야겠어. 문법: 好久没(hǎojiǔ méi) + 동사 + 了(le): \"오랫동안 ~ 안 했다\". 한동안 하지 않은 일을 말할 때 씀. (好久没见了(hǎojiǔ méi jiàn le), 好久没运动了(hǎojiǔ méi yùndòng le)) 형용사 + 得不行(de bùxíng): \"엄청 ~하다, ~해서 못 견디겠다\". 정도가 아주 심함을 나타내는 회화체 정도보어. (累得不行(lèi de bùxíng), 饿得不行(è de bùxíng)) 非得(fēiděi)……不可(bùkě): \"꼭 ~해야만 한다\". 강한 필요나 결심을 나타냄. 회화에서는 不可(bùkě)를 생략하기도 함. (今天非得做完不可(jīntiān fēiděi zuò wán bùkě)) 好好(hǎohǎo) + 동사: \"제대로, 푹 ~하다\". (好好休息(hǎohǎo xiūxi), 好好想想(hǎohǎo xiǎngxiang)) 2. 我正要出门，突然下起雨来了，看来今天只能在家待着了。 병음: Wǒ zhèng yào chūmén, tūrán xià qǐ yǔ lái le, kànlái jīntiān zhǐ néng zài jiā dāi zhe le. 뜻: 막 나가려던 참에 갑자기 비가 오기 시작했어. 보아하니 오늘은 집에만 있어야겠네. 문법: 正要(zhèng yào) + 동사: \"막 ~하려던 참이다\". 그때 다른 일이 끼어들었음을 말할 때 씀. (我正要给你打电话(wǒ zhèng yào gěi nǐ dǎ diànhuà)) 동사 + 起(qǐ) + 목적어 + 来(lái): \"~하기 시작하다\". 목적어는 起(qǐ)와 来(lái) 사이에 옴. (唱起歌来(chàng qǐ gē lái), 聊起天来(liáo qǐ tiān lái)) 看来(kànlái): \"보아하니 ~인 것 같다\". 눈앞의 상황을 근거로 판단할 때 씀. 估计(gūjì)보다 근거가 분명한 느낌. (看来他不会来了(kànlái tā bú huì lái le)) 只能(zhǐ néng) + 동사 + 了(le): \"~할 수밖에 없다\". (只能等了(zhǐ néng děng le)) 待着(dāi zhe): \"(한곳에) 머물러 있다\". 待(dāi)는 회화에서 \"있다, 머무르다\"의 뜻. (在家待着(zài jiā dāi zhe), 待了一会儿(dāi le yíhuìr)) 주요 단어 단어 병음 뜻 好久 hǎojiǔ 오랫동안 收拾 shōushi 정리하다, 치우다 乱 luàn 어지럽다, 엉망이다 非得……不可 fēiděi……bùkě 꼭 ~해야만 한다 好好 hǎohǎo 제대로, 잘 打扫 dǎsǎo 청소하다 正要 zhèng yào 막 ~하려던 참이다 突然 tūrán 갑자기 看来 kànlái 보아하니 只能 zhǐ néng ~할 수밖에 없다 待 dāi 머무르다, 있다 관련 비즈니스 중국어 노트 이전: 중국어 Day 11 · 다음: 중국어 Day 13"}, {"title": "중국어 Day 13", "category": "chinese", "updated": "2026-11-21", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: Day 13 · 2026-11-21 (일상)<\/li>\n<\/ul>\n<h2>1. 我的快递被邻居拿错了，害得我找了半天。<\/h2>\n<ul>\n<li>병음: Wǒ de kuàidì bèi línjū ná cuò le, hài de wǒ zhǎo le bàntiān.<\/li>\n<li>뜻: 내 택배를 이웃이 잘못 가져가는 바람에 한참 찾았어.<\/li>\n<li>문법:<ul>\n<li>被(bèi) + 행위자 + 동사 + 기타 성분: 피동문, \"~에게 ~당하다\". 주로 원하지 않은 일에 씀. 동사 뒤에 了(le)나 결과보어가 붙음. (我的蛋糕被弟弟吃了(wǒ de dàngāo bèi dìdi chī le), 钱包被偷了(qiánbāo bèi tōu le))<\/li>\n<li>동사 + 错(cuò): 결과보어, \"잘못 ~하다\". (走错路(zǒu cuò lù), 打错电话(dǎ cuò diànhuà), 听错了(tīng cuò le))<\/li>\n<li>害得(hài de) + 사람 + 결과: \"~하는 바람에 (누가) ~하게 됐다\". 남 탓을 하며 나쁜 결과를 말할 때 씀. (你迟到了，害得我们等了半天(nǐ chídào le, hài de wǒmen děng le bàntiān))<\/li>\n<li>동사 + 了(le) + 半天(bàntiān): \"한참 동안 ~했다\". 실제 반나절이 아니라 \"오래\"라는 과장 표현. (说了半天(shuō le bàntiān), 想了半天(xiǎng le bàntiān))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. 既然你明天不用上班，那今晚就陪我看场电影呗。<\/h2>\n<ul>\n<li>병음: Jìrán nǐ míngtiān búyòng shàngbān, nà jīn wǎn jiù péi wǒ kàn chǎng diànyǐng bei.<\/li>\n<li>뜻: 너 내일 출근 안 해도 되니까, 오늘 밤엔 나랑 영화 한 편 보자.<\/li>\n<li>문법:<ul>\n<li>既然(jìrán)……，那(nà)/就(jiù)……: \"기왕 ~한 이상, ~하자\". 이미 사실인 것을 근거로 제안·결론을 낼 때 씀. (既然来了，就多玩儿几天吧(jìrán lái le, jiù duō wánr jǐ tiān ba))<\/li>\n<li>不用(búyòng) + 동사: \"~할 필요 없다, ~안 해도 된다\". 不要(búyào) \"~하지 마\"와 구별. (不用谢(búyòng xiè), 明天不用早起(míngtiān búyòng zǎo qǐ))<\/li>\n<li>陪(péi) + 사람 + 동사: \"~와 함께 ~해 주다\". 상대 곁에 있어 주는 느낌. (陪我去医院(péi wǒ qù yīyuàn), 陪孩子玩儿(péi háizi wánr))<\/li>\n<li>场(chǎng): 영화 상영·경기·공연 등 한 회를 세는 양사. 작품 자체를 셀 때는 部(bù). (看场电影(kàn chǎng diànyǐng), 一场比赛(yì chǎng bǐsài))<\/li>\n<li>문장 끝 呗(bei): \"~하면 되지, ~하자\". 吧(ba)보다 더 가볍고 편한 말투로, 당연하다는 느낌을 줌. (不会就问呗(bú huì jiù wèn bei))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>快递<\/td>\n<td>kuàidì<\/td>\n<td>택배<\/td>\n<\/tr>\n<tr>\n<td>被<\/td>\n<td>bèi<\/td>\n<td>~에게 ~당하다 (피동)<\/td>\n<\/tr>\n<tr>\n<td>邻居<\/td>\n<td>línjū<\/td>\n<td>이웃<\/td>\n<\/tr>\n<tr>\n<td>拿错<\/td>\n<td>ná cuò<\/td>\n<td>잘못 가져가다<\/td>\n<\/tr>\n<tr>\n<td>害得<\/td>\n<td>hài de<\/td>\n<td>~하는 바람에 (나쁜 결과)<\/td>\n<\/tr>\n<tr>\n<td>半天<\/td>\n<td>bàntiān<\/td>\n<td>한참, 오랫동안<\/td>\n<\/tr>\n<tr>\n<td>既然<\/td>\n<td>jìrán<\/td>\n<td>기왕 ~한 이상<\/td>\n<\/tr>\n<tr>\n<td>不用<\/td>\n<td>búyòng<\/td>\n<td>~할 필요 없다<\/td>\n<\/tr>\n<tr>\n<td>上班<\/td>\n<td>shàngbān<\/td>\n<td>출근하다<\/td>\n<\/tr>\n<tr>\n<td>今晚<\/td>\n<td>jīn wǎn<\/td>\n<td>오늘 밤<\/td>\n<\/tr>\n<tr>\n<td>陪<\/td>\n<td>péi<\/td>\n<td>함께 해 주다, 동반하다<\/td>\n<\/tr>\n<tr>\n<td>场<\/td>\n<td>chǎng<\/td>\n<td>(상영·경기의) 회, 번<\/td>\n<\/tr>\n<tr>\n<td>呗<\/td>\n<td>bei<\/td>\n<td>~하면 되지 (가벼운 권유)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 12\">중국어 Day 12<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 14\">중국어 Day 14<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: Day 13 · 2026-11-21 (일상) 1. 我的快递被邻居拿错了，害得我找了半天。 병음: Wǒ de kuàidì bèi línjū ná cuò le, hài de wǒ zhǎo le bàntiān. 뜻: 내 택배를 이웃이 잘못 가져가는 바람에 한참 찾았어. 문법: 被(bèi) + 행위자 + 동사 + 기타 성분: 피동문, \"~에게 ~당하다\". 주로 원하지 않은 일에 씀. 동사 뒤에 了(le)나 결과보어가 붙음. (我的蛋糕被弟弟吃了(wǒ de dàngāo bèi dìdi chī le), 钱包被偷了(qiánbāo bèi tōu le)) 동사 + 错(cuò): 결과보어, \"잘못 ~하다\". (走错路(zǒu cuò lù), 打错电话(dǎ cuò diànhuà), 听错了(tīng cuò le)) 害得(hài de) + 사람 + 결과: \"~하는 바람에 (누가) ~하게 됐다\". 남 탓을 하며 나쁜 결과를 말할 때 씀. (你迟到了，害得我们等了半天(nǐ chídào le, hài de wǒmen děng le bàntiān)) 동사 + 了(le) + 半天(bàntiān): \"한참 동안 ~했다\". 실제 반나절이 아니라 \"오래\"라는 과장 표현. (说了半天(shuō le bàntiān), 想了半天(xiǎng le bàntiān)) 2. 既然你明天不用上班，那今晚就陪我看场电影呗。 병음: Jìrán nǐ míngtiān búyòng shàngbān, nà jīn wǎn jiù péi wǒ kàn chǎng diànyǐng bei. 뜻: 너 내일 출근 안 해도 되니까, 오늘 밤엔 나랑 영화 한 편 보자. 문법: 既然(jìrán)……，那(nà)/就(jiù)……: \"기왕 ~한 이상, ~하자\". 이미 사실인 것을 근거로 제안·결론을 낼 때 씀. (既然来了，就多玩儿几天吧(jìrán lái le, jiù duō wánr jǐ tiān ba)) 不用(búyòng) + 동사: \"~할 필요 없다, ~안 해도 된다\". 不要(búyào) \"~하지 마\"와 구별. (不用谢(búyòng xiè), 明天不用早起(míngtiān búyòng zǎo qǐ)) 陪(péi) + 사람 + 동사: \"~와 함께 ~해 주다\". 상대 곁에 있어 주는 느낌. (陪我去医院(péi wǒ qù yīyuàn), 陪孩子玩儿(péi háizi wánr)) 场(chǎng): 영화 상영·경기·공연 등 한 회를 세는 양사. 작품 자체를 셀 때는 部(bù). (看场电影(kàn chǎng diànyǐng), 一场比赛(yì chǎng bǐsài)) 문장 끝 呗(bei): \"~하면 되지, ~하자\". 吧(ba)보다 더 가볍고 편한 말투로, 당연하다는 느낌을 줌. (不会就问呗(bú huì jiù wèn bei)) 주요 단어 단어 병음 뜻 快递 kuàidì 택배 被 bèi ~에게 ~당하다 (피동) 邻居 línjū 이웃 拿错 ná cuò 잘못 가져가다 害得 hài de ~하는 바람에 (나쁜 결과) 半天 bàntiān 한참, 오랫동안 既然 jìrán 기왕 ~한 이상 不用 búyòng ~할 필요 없다 上班 shàngbān 출근하다 今晚 jīn wǎn 오늘 밤 陪 péi 함께 해 주다, 동반하다 场 chǎng (상영·경기의) 회, 번 呗 bei ~하면 되지 (가벼운 권유) 관련 비즈니스 중국어 노트 이전: 중국어 Day 12 · 다음: 중국어 Day 14"}, {"title": "중국어 Day 14", "category": "chinese", "updated": "2026-11-22", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: Day 14 · 2026-11-22 (일상)<\/li>\n<\/ul>\n<h2>1. 我光顾着跟朋友聊天，一不小心坐过了两站。<\/h2>\n<ul>\n<li>병음: Wǒ guāng gùzhe gēn péngyou liáotiān, yí bù xiǎoxīn zuò guò le liǎng zhàn.<\/li>\n<li>뜻: 친구랑 수다 떠느라 정신이 팔려서, 깜빡하고 두 정거장이나 지나쳐 버렸어.<\/li>\n<li>문법:<ul>\n<li>光顾着(guāng gùzhe) + 동사: \"~하는 데만 정신이 팔려서\". 그 바람에 다른 걸 놓쳤다는 뉘앙스. (光顾着说话(guāng gùzhe shuōhuà), 光顾着玩儿，忘了吃饭(guāng gùzhe wánr, wàng le chīfàn))<\/li>\n<li>一不小心(yí bù xiǎoxīn): \"깜빡하는 사이에, 실수로\". 의도치 않게 생긴 일 앞에 씀. (一不小心摔倒了(yí bù xiǎoxīn shuāidǎo le), 一不小心说漏嘴了(yí bù xiǎoxīn shuō lòu zuǐ le))<\/li>\n<li>동사 + 过(guò): 방향보어, \"(지점을) 지나치다\". 경험의 过(guo)와 달리 4성으로 읽음. (坐过站(zuò guò zhàn), 睡过头了(shuì guò tóu le), 走过头了(zǒu guò tóu le))<\/li>\n<li>站(zhàn): 정거장 수를 세는 양사. (还有三站(hái yǒu sān zhàn), 下一站(xià yí zhàn))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. 天阴得厉害，带把伞吧，万一下雨了也不怕。<\/h2>\n<ul>\n<li>병음: Tiān yīn de lìhai, dài bǎ sǎn ba, wànyī xià yǔ le yě bú pà.<\/li>\n<li>뜻: 하늘이 엄청 흐리네. 우산 하나 챙겨 가, 혹시 비 와도 걱정 없게.<\/li>\n<li>문법:<ul>\n<li>형용사 + 得厉害(de lìhai): \"몹시 ~하다\". 정도가 심함을 나타내며, 주로 좋지 않은 상태에 씀. (疼得厉害(téng de lìhai), 堵得厉害(dǔ de lìhai))<\/li>\n<li>동사 + 양사 + 명사: 수사 一(yī)를 생략한 회화체. 带把伞(dài bǎ sǎn)의 把(bǎ)는 손잡이 있는 물건을 세는 양사로, 把자문의 把와 다름. (买瓶水(mǎi píng shuǐ), 一把椅子(yì bǎ yǐzi))<\/li>\n<li>万一(wànyī): \"만에 하나, 혹시라도\". 일어나지 않았으면 하는 일을 가정할 때 씀. (万一迟到了怎么办(wànyī chídào le zěnme bàn))<\/li>\n<li>……也不怕(yě bú pà): \"~해도 걱정 없다\". 미리 대비해 두었다는 느낌. (有了地图，迷路也不怕(yǒu le dìtú, mílù yě bú pà))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>光顾着<\/td>\n<td>guāng gùzhe<\/td>\n<td>~하느라 정신이 팔리다<\/td>\n<\/tr>\n<tr>\n<td>聊天<\/td>\n<td>liáotiān<\/td>\n<td>수다 떨다, 이야기하다<\/td>\n<\/tr>\n<tr>\n<td>一不小心<\/td>\n<td>yí bù xiǎoxīn<\/td>\n<td>실수로, 깜빡하는 사이에<\/td>\n<\/tr>\n<tr>\n<td>坐过站<\/td>\n<td>zuò guò zhàn<\/td>\n<td>(내릴) 정거장을 지나치다<\/td>\n<\/tr>\n<tr>\n<td>站<\/td>\n<td>zhàn<\/td>\n<td>정거장<\/td>\n<\/tr>\n<tr>\n<td>阴<\/td>\n<td>yīn<\/td>\n<td>흐리다<\/td>\n<\/tr>\n<tr>\n<td>厉害<\/td>\n<td>lìhai<\/td>\n<td>심하다, 대단하다<\/td>\n<\/tr>\n<tr>\n<td>带<\/td>\n<td>dài<\/td>\n<td>챙기다, 가지고 가다<\/td>\n<\/tr>\n<tr>\n<td>伞<\/td>\n<td>sǎn<\/td>\n<td>우산<\/td>\n<\/tr>\n<tr>\n<td>万一<\/td>\n<td>wànyī<\/td>\n<td>만에 하나, 혹시<\/td>\n<\/tr>\n<tr>\n<td>怕<\/td>\n<td>pà<\/td>\n<td>걱정하다, 두려워하다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 13\">중국어 Day 13<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 15\">중국어 Day 15<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: Day 14 · 2026-11-22 (일상) 1. 我光顾着跟朋友聊天，一不小心坐过了两站。 병음: Wǒ guāng gùzhe gēn péngyou liáotiān, yí bù xiǎoxīn zuò guò le liǎng zhàn. 뜻: 친구랑 수다 떠느라 정신이 팔려서, 깜빡하고 두 정거장이나 지나쳐 버렸어. 문법: 光顾着(guāng gùzhe) + 동사: \"~하는 데만 정신이 팔려서\". 그 바람에 다른 걸 놓쳤다는 뉘앙스. (光顾着说话(guāng gùzhe shuōhuà), 光顾着玩儿，忘了吃饭(guāng gùzhe wánr, wàng le chīfàn)) 一不小心(yí bù xiǎoxīn): \"깜빡하는 사이에, 실수로\". 의도치 않게 생긴 일 앞에 씀. (一不小心摔倒了(yí bù xiǎoxīn shuāidǎo le), 一不小心说漏嘴了(yí bù xiǎoxīn shuō lòu zuǐ le)) 동사 + 过(guò): 방향보어, \"(지점을) 지나치다\". 경험의 过(guo)와 달리 4성으로 읽음. (坐过站(zuò guò zhàn), 睡过头了(shuì guò tóu le), 走过头了(zǒu guò tóu le)) 站(zhàn): 정거장 수를 세는 양사. (还有三站(hái yǒu sān zhàn), 下一站(xià yí zhàn)) 2. 天阴得厉害，带把伞吧，万一下雨了也不怕。 병음: Tiān yīn de lìhai, dài bǎ sǎn ba, wànyī xià yǔ le yě bú pà. 뜻: 하늘이 엄청 흐리네. 우산 하나 챙겨 가, 혹시 비 와도 걱정 없게. 문법: 형용사 + 得厉害(de lìhai): \"몹시 ~하다\". 정도가 심함을 나타내며, 주로 좋지 않은 상태에 씀. (疼得厉害(téng de lìhai), 堵得厉害(dǔ de lìhai)) 동사 + 양사 + 명사: 수사 一(yī)를 생략한 회화체. 带把伞(dài bǎ sǎn)의 把(bǎ)는 손잡이 있는 물건을 세는 양사로, 把자문의 把와 다름. (买瓶水(mǎi píng shuǐ), 一把椅子(yì bǎ yǐzi)) 万一(wànyī): \"만에 하나, 혹시라도\". 일어나지 않았으면 하는 일을 가정할 때 씀. (万一迟到了怎么办(wànyī chídào le zěnme bàn)) ……也不怕(yě bú pà): \"~해도 걱정 없다\". 미리 대비해 두었다는 느낌. (有了地图，迷路也不怕(yǒu le dìtú, mílù yě bú pà)) 주요 단어 단어 병음 뜻 光顾着 guāng gùzhe ~하느라 정신이 팔리다 聊天 liáotiān 수다 떨다, 이야기하다 一不小心 yí bù xiǎoxīn 실수로, 깜빡하는 사이에 坐过站 zuò guò zhàn (내릴) 정거장을 지나치다 站 zhàn 정거장 阴 yīn 흐리다 厉害 lìhai 심하다, 대단하다 带 dài 챙기다, 가지고 가다 伞 sǎn 우산 万一 wànyī 만에 하나, 혹시 怕 pà 걱정하다, 두려워하다 관련 비즈니스 중국어 노트 이전: 중국어 Day 13 · 다음: 중국어 Day 15"}, {"title": "중국어 Day 15", "category": "chinese", "updated": "2026-11-23", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: Day 15 · 2026-11-23 (일상)<\/li>\n<\/ul>\n<h2>1. 这家咖啡店的拿铁比我想象的好喝多了，下次带你来尝尝。<\/h2>\n<ul>\n<li>병음: Zhè jiā kāfēidiàn de nátiě bǐ wǒ xiǎngxiàng de hǎohē duō le, xià cì dài nǐ lái chángchang.<\/li>\n<li>뜻: 이 카페 라테가 생각보다 훨씬 맛있더라. 다음에 너도 데려와서 맛보게 해 줄게.<\/li>\n<li>문법:<ul>\n<li>A + 比(bǐ) + B + 형용사 + 多了(duō le): \"A가 B보다 훨씬 ~하다\". 차이가 클 때 형용사 뒤에 多了(duō le)를 붙임. 比(bǐ) 비교문에는 很(hěn)·非常(fēicháng)을 쓰지 않음. (今天比昨天冷多了(jīntiān bǐ zuótiān lěng duō le), 这个比那个便宜多了(zhège bǐ nàge piányi duō le))<\/li>\n<li>比我想象的(bǐ wǒ xiǎngxiàng de): \"내가 생각한 것보다, 생각보다\". 比想象中(bǐ xiǎngxiàng zhōng)이라고도 함. (比我想象的难(bǐ wǒ xiǎngxiàng de nán))<\/li>\n<li>带(dài) + 사람 + 来/去(lái/qù) + 동사: \"~을 데리고 와서/가서 ~하다\". 물건뿐 아니라 사람을 데려갈 때도 带(dài)를 씀. (带孩子去公园玩儿(dài háizi qù gōngyuán wánr), 带你去看看(dài nǐ qù kànkan))<\/li>\n<li>尝尝(chángchang): 동사 중첩 복습, \"좀 맛보다\". 음식을 권할 때 아주 자주 씀. (你尝尝这个(nǐ chángchang zhège))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. 我一边洗碗一边听播客，不知不觉就到半夜了。<\/h2>\n<ul>\n<li>병음: Wǒ yìbiān xǐ wǎn yìbiān tīng bōkè, bù zhī bù jué jiù dào bànyè le.<\/li>\n<li>뜻: 설거지하면서 팟캐스트를 듣다 보니, 나도 모르게 벌써 한밤중이 됐네.<\/li>\n<li>문법:<ul>\n<li>一边(yìbiān) + A + 一边(yìbiān) + B: \"A하면서 B하다\". 두 동작을 동시에 할 때 씀. 회화에서는 边(biān)……边(biān)……로 줄이기도 함. (一边吃饭一边看手机(yìbiān chī fàn yìbiān kàn shǒujī), 边走边聊(biān zǒu biān liáo))<\/li>\n<li>不知不觉(bù zhī bù jué): \"나도 모르는 사이에, 어느새\". 시간이 빨리 지나갔거나 변화를 늦게 알아챘을 때 씀. (不知不觉一年过去了(bù zhī bù jué yì nián guòqu le))<\/li>\n<li>就(jiù) + 到(dào) + 시간 + 了(le): \"벌써 ~(시간)이 되다\". 就(jiù)가 \"생각보다 빨리\"라는 느낌을 더함. (才(cái)와 반대) (一会儿就到十点了(yíhuìr jiù dào shí diǎn le))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>咖啡店<\/td>\n<td>kāfēidiàn<\/td>\n<td>카페<\/td>\n<\/tr>\n<tr>\n<td>拿铁<\/td>\n<td>nátiě<\/td>\n<td>라테<\/td>\n<\/tr>\n<tr>\n<td>想象<\/td>\n<td>xiǎngxiàng<\/td>\n<td>상상하다, 생각하다<\/td>\n<\/tr>\n<tr>\n<td>好喝<\/td>\n<td>hǎohē<\/td>\n<td>(음료가) 맛있다<\/td>\n<\/tr>\n<tr>\n<td>下次<\/td>\n<td>xià cì<\/td>\n<td>다음번<\/td>\n<\/tr>\n<tr>\n<td>尝<\/td>\n<td>cháng<\/td>\n<td>맛보다<\/td>\n<\/tr>\n<tr>\n<td>一边……一边<\/td>\n<td>yìbiān……yìbiān<\/td>\n<td>~하면서 ~하다<\/td>\n<\/tr>\n<tr>\n<td>洗碗<\/td>\n<td>xǐ wǎn<\/td>\n<td>설거지하다<\/td>\n<\/tr>\n<tr>\n<td>播客<\/td>\n<td>bōkè<\/td>\n<td>팟캐스트<\/td>\n<\/tr>\n<tr>\n<td>不知不觉<\/td>\n<td>bù zhī bù jué<\/td>\n<td>나도 모르게, 어느새<\/td>\n<\/tr>\n<tr>\n<td>半夜<\/td>\n<td>bànyè<\/td>\n<td>한밤중<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 14\">중국어 Day 14<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 16\">중국어 Day 16<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: Day 15 · 2026-11-23 (일상) 1. 这家咖啡店的拿铁比我想象的好喝多了，下次带你来尝尝。 병음: Zhè jiā kāfēidiàn de nátiě bǐ wǒ xiǎngxiàng de hǎohē duō le, xià cì dài nǐ lái chángchang. 뜻: 이 카페 라테가 생각보다 훨씬 맛있더라. 다음에 너도 데려와서 맛보게 해 줄게. 문법: A + 比(bǐ) + B + 형용사 + 多了(duō le): \"A가 B보다 훨씬 ~하다\". 차이가 클 때 형용사 뒤에 多了(duō le)를 붙임. 比(bǐ) 비교문에는 很(hěn)·非常(fēicháng)을 쓰지 않음. (今天比昨天冷多了(jīntiān bǐ zuótiān lěng duō le), 这个比那个便宜多了(zhège bǐ nàge piányi duō le)) 比我想象的(bǐ wǒ xiǎngxiàng de): \"내가 생각한 것보다, 생각보다\". 比想象中(bǐ xiǎngxiàng zhōng)이라고도 함. (比我想象的难(bǐ wǒ xiǎngxiàng de nán)) 带(dài) + 사람 + 来/去(lái/qù) + 동사: \"~을 데리고 와서/가서 ~하다\". 물건뿐 아니라 사람을 데려갈 때도 带(dài)를 씀. (带孩子去公园玩儿(dài háizi qù gōngyuán wánr), 带你去看看(dài nǐ qù kànkan)) 尝尝(chángchang): 동사 중첩 복습, \"좀 맛보다\". 음식을 권할 때 아주 자주 씀. (你尝尝这个(nǐ chángchang zhège)) 2. 我一边洗碗一边听播客，不知不觉就到半夜了。 병음: Wǒ yìbiān xǐ wǎn yìbiān tīng bōkè, bù zhī bù jué jiù dào bànyè le. 뜻: 설거지하면서 팟캐스트를 듣다 보니, 나도 모르게 벌써 한밤중이 됐네. 문법: 一边(yìbiān) + A + 一边(yìbiān) + B: \"A하면서 B하다\". 두 동작을 동시에 할 때 씀. 회화에서는 边(biān)……边(biān)……로 줄이기도 함. (一边吃饭一边看手机(yìbiān chī fàn yìbiān kàn shǒujī), 边走边聊(biān zǒu biān liáo)) 不知不觉(bù zhī bù jué): \"나도 모르는 사이에, 어느새\". 시간이 빨리 지나갔거나 변화를 늦게 알아챘을 때 씀. (不知不觉一年过去了(bù zhī bù jué yì nián guòqu le)) 就(jiù) + 到(dào) + 시간 + 了(le): \"벌써 ~(시간)이 되다\". 就(jiù)가 \"생각보다 빨리\"라는 느낌을 더함. (才(cái)와 반대) (一会儿就到十点了(yíhuìr jiù dào shí diǎn le)) 주요 단어 단어 병음 뜻 咖啡店 kāfēidiàn 카페 拿铁 nátiě 라테 想象 xiǎngxiàng 상상하다, 생각하다 好喝 hǎohē (음료가) 맛있다 下次 xià cì 다음번 尝 cháng 맛보다 一边……一边 yìbiān……yìbiān ~하면서 ~하다 洗碗 xǐ wǎn 설거지하다 播客 bōkè 팟캐스트 不知不觉 bù zhī bù jué 나도 모르게, 어느새 半夜 bànyè 한밤중 관련 비즈니스 중국어 노트 이전: 중국어 Day 14 · 다음: 중국어 Day 16"}, {"title": "중국어 Day 16", "category": "chinese", "updated": "2026-11-24", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: Day 16 · 2026-11-24 (일상)<\/li>\n<\/ul>\n<h2>1. 这个周末我哪儿也不想去，就想在家躺着追剧。<\/h2>\n<ul>\n<li>병음: Zhège zhōumò wǒ nǎr yě bù xiǎng qù, jiù xiǎng zài jiā tǎngzhe zhuī jù.<\/li>\n<li>뜻: 이번 주말엔 아무 데도 가기 싫어. 그냥 집에 누워서 드라마나 몰아 보고 싶어.<\/li>\n<li>문법:<ul>\n<li>의문사 + 也/都(yě/dōu) + 부정: \"아무 ~도 …하지 않다\". 哪儿(nǎr)·谁(shéi)·什么(shénme) 같은 의문사가 '모든 것'을 가리킴. (谁都不认识(shéi dōu bú rènshi), 什么也没吃(shénme yě méi chī))<\/li>\n<li>就(jiù) + 想(xiǎng) + 동사: 여기서 就(jiù)는 \"그냥, 오직\". 다른 건 말고 이것만 하고 싶다는 느낌. (我就想睡觉(wǒ jiù xiǎng shuìjiào))<\/li>\n<li>동사1 + 着(zhe) + 동사2: \"~한 채로 ~하다\". 동사1이 동사2를 하는 방식·자세를 나타냄. (躺着看手机(tǎngzhe kàn shǒujī), 站着吃饭(zhànzhe chī fàn))<\/li>\n<li>追剧(zhuī jù): \"드라마를 챙겨 보다, 정주행하다\". 회화에서 아주 자주 쓰는 표현. (最近在追什么剧?(zuìjìn zài zhuī shénme jù?))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. 我还以为你早就到了呢，原来你还在路上啊。<\/h2>\n<ul>\n<li>병음: Wǒ hái yǐwéi nǐ zǎo jiù dào le ne, yuánlái nǐ hái zài lùshang a.<\/li>\n<li>뜻: 난 네가 진작 도착한 줄 알았는데, 알고 보니 아직 오는 중이었구나.<\/li>\n<li>문법:<ul>\n<li>还以为(hái yǐwéi)……呢(ne): \"(사실과 달리) ~인 줄 알았다\". 以为(yǐwéi)는 생각이 틀렸을 때 씀. 자기 의견을 말할 땐 认为(rènwéi)/觉得(juéde). (我还以为你不来了呢(wǒ hái yǐwéi nǐ bù lái le ne))<\/li>\n<li>原来(yuánlái): \"알고 보니\". 몰랐던 사실을 새로 알게 됐을 때 문장 앞에 씀. (原来是你啊(yuánlái shì nǐ a))<\/li>\n<li>早就(zǎo jiù)……了(le): \"진작, 이미 오래전에 ~했다\". (我早就知道了(wǒ zǎo jiù zhīdào le))<\/li>\n<li>还在(hái zài) + 장소/동작: \"아직 ~에 있다, 아직 ~하는 중이다\". (他还在睡觉(tā hái zài shuìjiào))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>哪儿<\/td>\n<td>nǎr<\/td>\n<td>어디<\/td>\n<\/tr>\n<tr>\n<td>躺<\/td>\n<td>tǎng<\/td>\n<td>눕다<\/td>\n<\/tr>\n<tr>\n<td>追剧<\/td>\n<td>zhuī jù<\/td>\n<td>드라마를 챙겨 보다<\/td>\n<\/tr>\n<tr>\n<td>以为<\/td>\n<td>yǐwéi<\/td>\n<td>~인 줄 알다(잘못 생각하다)<\/td>\n<\/tr>\n<tr>\n<td>早就<\/td>\n<td>zǎo jiù<\/td>\n<td>진작, 일찌감치<\/td>\n<\/tr>\n<tr>\n<td>原来<\/td>\n<td>yuánlái<\/td>\n<td>알고 보니<\/td>\n<\/tr>\n<tr>\n<td>到<\/td>\n<td>dào<\/td>\n<td>도착하다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 15\">중국어 Day 15<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 17\">중국어 Day 17<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: Day 16 · 2026-11-24 (일상) 1. 这个周末我哪儿也不想去，就想在家躺着追剧。 병음: Zhège zhōumò wǒ nǎr yě bù xiǎng qù, jiù xiǎng zài jiā tǎngzhe zhuī jù. 뜻: 이번 주말엔 아무 데도 가기 싫어. 그냥 집에 누워서 드라마나 몰아 보고 싶어. 문법: 의문사 + 也/都(yě/dōu) + 부정: \"아무 ~도 …하지 않다\". 哪儿(nǎr)·谁(shéi)·什么(shénme) 같은 의문사가 '모든 것'을 가리킴. (谁都不认识(shéi dōu bú rènshi), 什么也没吃(shénme yě méi chī)) 就(jiù) + 想(xiǎng) + 동사: 여기서 就(jiù)는 \"그냥, 오직\". 다른 건 말고 이것만 하고 싶다는 느낌. (我就想睡觉(wǒ jiù xiǎng shuìjiào)) 동사1 + 着(zhe) + 동사2: \"~한 채로 ~하다\". 동사1이 동사2를 하는 방식·자세를 나타냄. (躺着看手机(tǎngzhe kàn shǒujī), 站着吃饭(zhànzhe chī fàn)) 追剧(zhuī jù): \"드라마를 챙겨 보다, 정주행하다\". 회화에서 아주 자주 쓰는 표현. (最近在追什么剧?(zuìjìn zài zhuī shénme jù?)) 2. 我还以为你早就到了呢，原来你还在路上啊。 병음: Wǒ hái yǐwéi nǐ zǎo jiù dào le ne, yuánlái nǐ hái zài lùshang a. 뜻: 난 네가 진작 도착한 줄 알았는데, 알고 보니 아직 오는 중이었구나. 문법: 还以为(hái yǐwéi)……呢(ne): \"(사실과 달리) ~인 줄 알았다\". 以为(yǐwéi)는 생각이 틀렸을 때 씀. 자기 의견을 말할 땐 认为(rènwéi)/觉得(juéde). (我还以为你不来了呢(wǒ hái yǐwéi nǐ bù lái le ne)) 原来(yuánlái): \"알고 보니\". 몰랐던 사실을 새로 알게 됐을 때 문장 앞에 씀. (原来是你啊(yuánlái shì nǐ a)) 早就(zǎo jiù)……了(le): \"진작, 이미 오래전에 ~했다\". (我早就知道了(wǒ zǎo jiù zhīdào le)) 还在(hái zài) + 장소/동작: \"아직 ~에 있다, 아직 ~하는 중이다\". (他还在睡觉(tā hái zài shuìjiào)) 주요 단어 단어 병음 뜻 哪儿 nǎr 어디 躺 tǎng 눕다 追剧 zhuī jù 드라마를 챙겨 보다 以为 yǐwéi ~인 줄 알다(잘못 생각하다) 早就 zǎo jiù 진작, 일찌감치 原来 yuánlái 알고 보니 到 dào 도착하다 관련 비즈니스 중국어 노트 이전: 중국어 Day 15 · 다음: 중국어 Day 17"}, {"title": "중국어 Day 17", "category": "chinese", "updated": "2026-11-25", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: Day 17 · 2026-11-25 (일상)<\/li>\n<\/ul>\n<h2>1. 趁超市打折，我囤了好几包纸巾，省得过几天再跑一趟。<\/h2>\n<ul>\n<li>병음: Chèn chāoshì dǎzhé, wǒ túnle hǎo jǐ bāo zhǐjīn, shěngde guò jǐ tiān zài pǎo yí tàng.<\/li>\n<li>뜻: 마트 세일하는 김에 휴지를 몇 팩이나 쟁여 뒀어, 며칠 뒤에 또 갈 필요 없게.<\/li>\n<li>문법:<ul>\n<li>趁(chèn) + 상황: \"~한 틈을 타서, ~할 때 (기회를 놓치지 않고)\". 좋은 기회를 이용할 때 씀. (趁热吃(chèn rè chī), 趁年轻(chèn niánqīng))<\/li>\n<li>好几(hǎo jǐ) + 양사: \"여러, 꽤 많은\". 几(jǐ)보다 수가 많다는 느낌을 강조함. (好几天(hǎo jǐ tiān), 好几次(hǎo jǐ cì))<\/li>\n<li>省得(shěngde) + 원치 않는 일: \"~하지 않도록, ~할 필요 없게\". 미리 해 두는 이유를 뒤에 붙일 때 씀. 免得(miǎnde)와 비슷한 회화 표현. (早点儿走，省得堵车(zǎo diǎnr zǒu, shěngde dǔchē))<\/li>\n<li>跑一趟(pǎo yí tàng): \"한 번 다녀오다\". 趟(tàng)은 오가는 횟수를 세는 양사. (去一趟超市(qù yí tàng chāoshì))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. 我最近动不动就犯困，说不定是因为晚上睡得太晚了。<\/h2>\n<ul>\n<li>병음: Wǒ zuìjìn dòngbudòng jiù fànkùn, shuōbudìng shì yīnwèi wǎnshang shuì de tài wǎn le.<\/li>\n<li>뜻: 요즘 걸핏하면 졸린데, 어쩌면 밤에 너무 늦게 자서 그런 건지도 몰라.<\/li>\n<li>문법:<ul>\n<li>动不动就(dòngbudòng jiù) + 동사: \"걸핏하면 ~하다, 툭하면 ~하다\". 자주 일어나는 일(주로 좋지 않은 일)에 씀. (他动不动就生气(tā dòngbudòng jiù shēngqì))<\/li>\n<li>犯困(fànkùn): \"졸음이 오다, 졸리다\". 犯(fàn)은 \"(나쁜 상태가) 도지다\"의 느낌. (一到下午就犯困(yí dào xiàwǔ jiù fànkùn))<\/li>\n<li>说不定(shuōbudìng): \"어쩌면 ~일지도 모른다\". 估计(gūjì)보다 확신이 약한 추측. (说不定他忘了(shuōbudìng tā wàng le))<\/li>\n<li>是因为(shì yīnwèi) + 이유: \"~ 때문이다\". 결과를 먼저 말하고 이유를 뒤에서 설명할 때 씀. (我迟到是因为堵车(wǒ chídào shì yīnwèi dǔchē))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>趁<\/td>\n<td>chèn<\/td>\n<td>~한 틈을 타서<\/td>\n<\/tr>\n<tr>\n<td>超市<\/td>\n<td>chāoshì<\/td>\n<td>마트, 슈퍼<\/td>\n<\/tr>\n<tr>\n<td>打折<\/td>\n<td>dǎzhé<\/td>\n<td>할인하다, 세일하다<\/td>\n<\/tr>\n<tr>\n<td>囤<\/td>\n<td>tún<\/td>\n<td>사재기하다, 쟁여 두다<\/td>\n<\/tr>\n<tr>\n<td>纸巾<\/td>\n<td>zhǐjīn<\/td>\n<td>휴지, 티슈<\/td>\n<\/tr>\n<tr>\n<td>省得<\/td>\n<td>shěngde<\/td>\n<td>~하지 않도록<\/td>\n<\/tr>\n<tr>\n<td>趟<\/td>\n<td>tàng<\/td>\n<td>번 (오가는 횟수 양사)<\/td>\n<\/tr>\n<tr>\n<td>动不动<\/td>\n<td>dòngbudòng<\/td>\n<td>걸핏하면, 툭하면<\/td>\n<\/tr>\n<tr>\n<td>犯困<\/td>\n<td>fànkùn<\/td>\n<td>졸리다<\/td>\n<\/tr>\n<tr>\n<td>说不定<\/td>\n<td>shuōbudìng<\/td>\n<td>어쩌면 ~일지도 모른다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 16\">중국어 Day 16<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 18\">중국어 Day 18<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: Day 17 · 2026-11-25 (일상) 1. 趁超市打折，我囤了好几包纸巾，省得过几天再跑一趟。 병음: Chèn chāoshì dǎzhé, wǒ túnle hǎo jǐ bāo zhǐjīn, shěngde guò jǐ tiān zài pǎo yí tàng. 뜻: 마트 세일하는 김에 휴지를 몇 팩이나 쟁여 뒀어, 며칠 뒤에 또 갈 필요 없게. 문법: 趁(chèn) + 상황: \"~한 틈을 타서, ~할 때 (기회를 놓치지 않고)\". 좋은 기회를 이용할 때 씀. (趁热吃(chèn rè chī), 趁年轻(chèn niánqīng)) 好几(hǎo jǐ) + 양사: \"여러, 꽤 많은\". 几(jǐ)보다 수가 많다는 느낌을 강조함. (好几天(hǎo jǐ tiān), 好几次(hǎo jǐ cì)) 省得(shěngde) + 원치 않는 일: \"~하지 않도록, ~할 필요 없게\". 미리 해 두는 이유를 뒤에 붙일 때 씀. 免得(miǎnde)와 비슷한 회화 표현. (早点儿走，省得堵车(zǎo diǎnr zǒu, shěngde dǔchē)) 跑一趟(pǎo yí tàng): \"한 번 다녀오다\". 趟(tàng)은 오가는 횟수를 세는 양사. (去一趟超市(qù yí tàng chāoshì)) 2. 我最近动不动就犯困，说不定是因为晚上睡得太晚了。 병음: Wǒ zuìjìn dòngbudòng jiù fànkùn, shuōbudìng shì yīnwèi wǎnshang shuì de tài wǎn le. 뜻: 요즘 걸핏하면 졸린데, 어쩌면 밤에 너무 늦게 자서 그런 건지도 몰라. 문법: 动不动就(dòngbudòng jiù) + 동사: \"걸핏하면 ~하다, 툭하면 ~하다\". 자주 일어나는 일(주로 좋지 않은 일)에 씀. (他动不动就生气(tā dòngbudòng jiù shēngqì)) 犯困(fànkùn): \"졸음이 오다, 졸리다\". 犯(fàn)은 \"(나쁜 상태가) 도지다\"의 느낌. (一到下午就犯困(yí dào xiàwǔ jiù fànkùn)) 说不定(shuōbudìng): \"어쩌면 ~일지도 모른다\". 估计(gūjì)보다 확신이 약한 추측. (说不定他忘了(shuōbudìng tā wàng le)) 是因为(shì yīnwèi) + 이유: \"~ 때문이다\". 결과를 먼저 말하고 이유를 뒤에서 설명할 때 씀. (我迟到是因为堵车(wǒ chídào shì yīnwèi dǔchē)) 주요 단어 단어 병음 뜻 趁 chèn ~한 틈을 타서 超市 chāoshì 마트, 슈퍼 打折 dǎzhé 할인하다, 세일하다 囤 tún 사재기하다, 쟁여 두다 纸巾 zhǐjīn 휴지, 티슈 省得 shěngde ~하지 않도록 趟 tàng 번 (오가는 횟수 양사) 动不动 dòngbudòng 걸핏하면, 툭하면 犯困 fànkùn 졸리다 说不定 shuōbudìng 어쩌면 ~일지도 모른다 관련 비즈니스 중국어 노트 이전: 중국어 Day 16 · 다음: 중국어 Day 18"}, {"title": "중국어 Day 18", "category": "chinese", "updated": "2026-11-26", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: Day 18 · 2026-11-26 (일상)<\/li>\n<\/ul>\n<h2>1. 难得有个不加班的晚上，要不咱们出去吃火锅？<\/h2>\n<ul>\n<li>병음: Nándé yǒu ge bù jiābān de wǎnshang, yàobù zánmen chūqu chī huǒguō?<\/li>\n<li>뜻: 모처럼 야근 없는 저녁인데, 우리 나가서 훠궈 먹을까?<\/li>\n<li>문법:<ul>\n<li>难得(nándé): \"모처럼, 좀처럼 없는\". 자주 오지 않는 기회라 소중하다는 느낌. 문장 앞이나 명사 앞에 씀. (难得见一面(nándé jiàn yí miàn), 难得的好天气(nándé de hǎo tiānqì))<\/li>\n<li>有个(yǒu ge) + 명사: 有一个(yǒu yí ge)에서 一(yī)를 뺀 회화체. 말할 때 아주 자주 생략함. (我有个问题(wǒ yǒu ge wèntí))<\/li>\n<li>要不(yàobù) + 제안: \"아니면 ~할까?, ~하는 게 어때?\". 가볍게 제안할 때 문장 앞에 씀. 要不然(yàoburán)과 같은 뜻. (要不你先回去吧(yàobù nǐ xiān huíqu ba))<\/li>\n<li>出去(chūqu) + 동사: \"나가서 ~하다\". 이동 동사 뒤에 목적이 되는 동작을 바로 이어 쓰는 연동문. (出去走走(chūqu zǒuzou), 回家吃饭(huí jiā chī fàn))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>2. 这双运动鞋虽然已经很旧了，可我一直舍不得扔，毕竟是我妈送的。<\/h2>\n<ul>\n<li>병음: Zhè shuāng yùndòngxié suīrán yǐjīng hěn jiù le, kě wǒ yìzhí shěbude rēng, bìjìng shì wǒ mā sòng de.<\/li>\n<li>뜻: 이 운동화는 이미 많이 낡았지만 계속 버리기가 아까워. 어쨌든 엄마가 선물해 준 거니까.<\/li>\n<li>문법:<ul>\n<li>虽然(suīrán)……可(kě)……: \"비록 ~지만, …\". 회화에서는 但是(dànshì) 대신 可(kě)를 자주 씀. (虽然有点儿贵，可质量很好(suīrán yǒudiǎnr guì, kě zhìliàng hěn hǎo))<\/li>\n<li>舍不得(shěbude) + 동사: \"아까워서(아쉬워서) ~하지 못하다\". 반대는 舍得(shěde). (舍不得花钱(shěbude huā qián), 舍不得走(shěbude zǒu))<\/li>\n<li>毕竟(bìjìng): \"어쨌든, 아무래도 (~이니까)\". 앞에서 말한 감정·행동의 이유가 되는 사실을 강조함. (他毕竟还是个孩子(tā bìjìng hái shì ge háizi))<\/li>\n<li>是(shì)……的(de): 이미 일어난 일에서 누가·언제·어떻게 했는지를 강조. 여기서는 '엄마가' 준 것임을 강조. (这是我自己做的(zhè shì wǒ zìjǐ zuò de))<\/li>\n<li>双(shuāng): 신발·양말·젓가락처럼 짝을 이루는 것을 세는 양사. (一双袜子(yì shuāng wàzi))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>难得<\/td>\n<td>nándé<\/td>\n<td>모처럼, 좀처럼 없는<\/td>\n<\/tr>\n<tr>\n<td>加班<\/td>\n<td>jiābān<\/td>\n<td>야근하다<\/td>\n<\/tr>\n<tr>\n<td>要不<\/td>\n<td>yàobù<\/td>\n<td>아니면 (~할까)<\/td>\n<\/tr>\n<tr>\n<td>火锅<\/td>\n<td>huǒguō<\/td>\n<td>훠궈<\/td>\n<\/tr>\n<tr>\n<td>双<\/td>\n<td>shuāng<\/td>\n<td>켤레, 쌍 (양사)<\/td>\n<\/tr>\n<tr>\n<td>运动鞋<\/td>\n<td>yùndòngxié<\/td>\n<td>운동화<\/td>\n<\/tr>\n<tr>\n<td>旧<\/td>\n<td>jiù<\/td>\n<td>낡다, 오래되다<\/td>\n<\/tr>\n<tr>\n<td>舍不得<\/td>\n<td>shěbude<\/td>\n<td>아까워서 ~하지 못하다<\/td>\n<\/tr>\n<tr>\n<td>扔<\/td>\n<td>rēng<\/td>\n<td>버리다, 던지다<\/td>\n<\/tr>\n<tr>\n<td>毕竟<\/td>\n<td>bìjìng<\/td>\n<td>어쨌든, 아무래도<\/td>\n<\/tr>\n<tr>\n<td>送<\/td>\n<td>sòng<\/td>\n<td>선물하다, 주다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 17\">중국어 Day 17<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: Day 18 · 2026-11-26 (일상) 1. 难得有个不加班的晚上，要不咱们出去吃火锅？ 병음: Nándé yǒu ge bù jiābān de wǎnshang, yàobù zánmen chūqu chī huǒguō? 뜻: 모처럼 야근 없는 저녁인데, 우리 나가서 훠궈 먹을까? 문법: 难得(nándé): \"모처럼, 좀처럼 없는\". 자주 오지 않는 기회라 소중하다는 느낌. 문장 앞이나 명사 앞에 씀. (难得见一面(nándé jiàn yí miàn), 难得的好天气(nándé de hǎo tiānqì)) 有个(yǒu ge) + 명사: 有一个(yǒu yí ge)에서 一(yī)를 뺀 회화체. 말할 때 아주 자주 생략함. (我有个问题(wǒ yǒu ge wèntí)) 要不(yàobù) + 제안: \"아니면 ~할까?, ~하는 게 어때?\". 가볍게 제안할 때 문장 앞에 씀. 要不然(yàoburán)과 같은 뜻. (要不你先回去吧(yàobù nǐ xiān huíqu ba)) 出去(chūqu) + 동사: \"나가서 ~하다\". 이동 동사 뒤에 목적이 되는 동작을 바로 이어 쓰는 연동문. (出去走走(chūqu zǒuzou), 回家吃饭(huí jiā chī fàn)) 2. 这双运动鞋虽然已经很旧了，可我一直舍不得扔，毕竟是我妈送的。 병음: Zhè shuāng yùndòngxié suīrán yǐjīng hěn jiù le, kě wǒ yìzhí shěbude rēng, bìjìng shì wǒ mā sòng de. 뜻: 이 운동화는 이미 많이 낡았지만 계속 버리기가 아까워. 어쨌든 엄마가 선물해 준 거니까. 문법: 虽然(suīrán)……可(kě)……: \"비록 ~지만, …\". 회화에서는 但是(dànshì) 대신 可(kě)를 자주 씀. (虽然有点儿贵，可质量很好(suīrán yǒudiǎnr guì, kě zhìliàng hěn hǎo)) 舍不得(shěbude) + 동사: \"아까워서(아쉬워서) ~하지 못하다\". 반대는 舍得(shěde). (舍不得花钱(shěbude huā qián), 舍不得走(shěbude zǒu)) 毕竟(bìjìng): \"어쨌든, 아무래도 (~이니까)\". 앞에서 말한 감정·행동의 이유가 되는 사실을 강조함. (他毕竟还是个孩子(tā bìjìng hái shì ge háizi)) 是(shì)……的(de): 이미 일어난 일에서 누가·언제·어떻게 했는지를 강조. 여기서는 '엄마가' 준 것임을 강조. (这是我自己做的(zhè shì wǒ zìjǐ zuò de)) 双(shuāng): 신발·양말·젓가락처럼 짝을 이루는 것을 세는 양사. (一双袜子(yì shuāng wàzi)) 주요 단어 단어 병음 뜻 难得 nándé 모처럼, 좀처럼 없는 加班 jiābān 야근하다 要不 yàobù 아니면 (~할까) 火锅 huǒguō 훠궈 双 shuāng 켤레, 쌍 (양사) 运动鞋 yùndòngxié 운동화 旧 jiù 낡다, 오래되다 舍不得 shěbude 아까워서 ~하지 못하다 扔 rēng 버리다, 던지다 毕竟 bìjìng 어쨌든, 아무래도 送 sòng 선물하다, 주다 관련 비즈니스 중국어 노트 이전: 중국어 Day 17"}, {"title": "중국어 단어장", "category": "chinese", "updated": "2026-11-26", "order": 2, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<p>날짜별 페이지의 단어를 한곳에 모았습니다. 같은 단어는 처음 나온 곳만 적습니다.<\/p>\n<h2>단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<th>처음 나온 곳<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>下周<\/td>\n<td>xiàzhōu<\/td>\ \n<tr>\n<td>到<\/td>\n<td>dào<\/td>\n<td>도착하다<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 16\">중국어 Day 16<\/a><\/td>\n<\/tr>\n<tr>\n<td>趁<\/td>\n<td>chèn<\/td>\n<td>~한 틈을 타서<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 17\">중국어 Day 17<\/a><\/td>\n<\/tr>\n<tr>\n<td>超市<\/td>\n<td>chāoshì<\/td>\n<td>마트, 슈퍼<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 17\">중국어 Day 17<\/a><\/td>\n<\/tr>\n<tr>\n<td>打折<\/td>\n<td>dǎzhé<\/td>\n<td>할인하다, 세일하다<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 17\">중국어 Day 17<\/a><\/td>\n<\/tr>\n<tr>\n<td>囤<\/td>\n<td>tún<\/td>\n<td>사재기하다, 쟁여 두다<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 17\">중국어 Day 17<\/a><\/td>\n<\/tr>\n<tr>\n<td>纸巾<\/td>\n<td>zhǐjīn<\/td>\n<td>휴지, 티슈<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 17\">중국어 Day 17<\/a><\/td>\n<\/tr>\n<tr>\n<td>省得<\/td>\n<td>shěngde<\/td>\n<td>~하지 않도록<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 17\">중국어 Day 17<\/a><\/td>\n<\/tr>\n<tr>\n<td>趟<\/td>\n<td>tàng<\/td>\n<td>번 (오가는 횟수 양사)<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 17\">중국어 Day 17<\/a><\/td>\n<\/tr>\n<tr>\n<td>动不动<\/td>\n<td>dòngbudòng<\/td>\n<td>걸핏하면, 툭하면<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 17\">중국어 Day 17<\/a><\/td>\n<\/tr>\n<tr>\n<td>犯困<\/td>\n<td>fànkùn<\/td>\n<td>졸리다<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 17\">중국어 Day 17<\/a><\/td>\n<\/tr>\n<tr>\n<td>说不定<\/td>\n<td>shuōbudìng<\/td>\n<td>어쩌면 ~일지도 모른다<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 17\">중국어 Day 17<\/a><\/td>\n<\/tr>\n<tr>\n<td>难得<\/td>\n<td>nándé<\/td>\n<td>모처럼, 좀처럼 없는<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 18\">중국어 Day 18<\/a><\/td>\n<\/tr>\n<tr>\n<td>加班<\/td>\n<td>jiābān<\/td>\n<td>야근하다<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 18\">중국어 Day 18<\/a><\/td>\n<\/tr>\n<tr>\n<td>要不<\/td>\n<td>yàobù<\/td>\n<td>아니면 (~할까)<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 18\">중국어 Day 18<\/a><\/td>\n<\/tr>\n<tr>\n<td>火锅<\/td>\n<td>huǒguō<\/td>\n<td>훠궈<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 18\">중국어 Day 18<\/a><\/td>\n<\/tr>\n<tr>\n<td>双<\/td>\n<td>shuāng<\/td>\n<td>켤레, 쌍 (양사)<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 18\">중국어 Day 18<\/a><\/td>\n<\/tr>\n<tr>\n<td>运动鞋<\/td>\n<td>yùndòngxié<\/td>\n<td>운동화<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 18\">중국어 Day 18<\/a><\/td>\n<\/tr>\n<tr>\n<td>旧<\/td>\n<td>jiù<\/td>\n<td>낡다, 오래되다<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 18\">중국어 Day 18<\/a><\/td>\n<\/tr>\n<tr>\n<td>舍不得<\/td>\n<td>shěbude<\/td>\n<td>아까워서 ~하지 못하다<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 18\">중국어 Day 18<\/a><\/td>\n<\/tr>\n<tr>\n<td>扔<\/td>\n<td>rēng<\/td>\n<td>버리다, 던지다<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 18\">중국어 Day 18<\/a><\/td>\n<\/tr>\n<tr>\n<td>毕竟<\/td>\n<td>bìjìng<\/td>\n<td>어쨌든, 아무래도<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 18\">중국어 Day 18<\/a><\/td>\n<\/tr>\n<tr>\n<td>送<\/td>\n<td>sòng<\/td>\n<td>선물하다, 주다<\/td>\n<td><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 18\">중국어 Day 18<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 날짜별 페이지의 단어를 한곳에 모았습니다. 같은 단어는 처음 나온 곳만 적습니다. 단어 단어 병음 뜻 처음 나온 곳 下周 xiàzhōu 다음 주 중국어 Day 01 安排 ānpái (일정을) 잡다, 준비하다 중국어 Day 01 视频会议 shìpín huìyì 화상회의 중국어 Day 01 内部 nèibù 내부 중국어 Day 01 确认 quèrèn 확인하다 중국어 Day 01 回复 huífù 회신하다, 답변하다 중국어 Day 01 请问 qǐngwèn 실례지만 (질문 시작) 중국어 Day 02 交易 jiāoyì 거래 중국어 Day 02 结算款 jiésuàn kuǎn 정산금 중국어 Day 02 到账 dàozhàng 입금되다 중국어 Day 02 附件 fùjiàn 첨부 파일 중국어 Day 02 修改 xiūgǎi 수정하다 중국어 Day 02 合同 hétong 계약서 중국어 Day 02 麻烦 máfan 번거롭게 하다, 부탁하다 중국어 Day 02 周末 zhōumò 주말 중국어 Day 03 过 guò (시간을) 보내다 중국어 Day 03 休息 xiūxi 쉬다 중국어 Day 03 一整天 yì zhěng tiān 하루 종일 중국어 Day 03 天气 tiānqì 날씨 중국어 Day 03 越来越 yuè lái yuè 점점,
