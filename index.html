碗 xǐ wǎn 설거지하다 중국어 Day 15 播客 bōkè 팟캐스트 중국어 Day 15 不知不觉 bù zhī bù jué 나도 모르게, 어느새 중국어 Day 15 半夜 bànyè 한밤중 중국어 Day 15 哪儿 nǎr 어디 중국어 Day 16 躺 tǎng 눕다 중국어 Day 16 追剧 zhuī jù 드라마를 챙겨 보다 중국어 Day 16 以为 yǐwéi ~인 줄 알다(잘못 생각하다) 중국어 Day 16 早就 zǎo jiù 진작, 일찌감치 중국어 Day 16 原来 yuánlái 알고 보니 중국어 Day 16 到 dào 도착하다 중국어 Day 16 趁 chèn ~한 틈을 타서 중국어 Day 17 超市 chāoshì 마트, 슈퍼 중국어 Day 17 打折 dǎzhé 할인하다, 세일하다 중국어 Day 17 囤 tún 사재기하다, 쟁여 두다 중국어 Day 17 纸巾 zhǐjīn 휴지, 티슈 중국어 Day 17 省得 shěngde ~하지 않도록 중국어 Day 17 趟 tàng 번 (오가는 횟수 양사) 중국어 Day 17 动不动 dòngbudòng 걸핏하면, 툭하면 중국어 Day 17 犯困 fànkùn 졸리다 중국어 Day 17 说不定 shuōbudìng 어쩌면 ~일지도 모른다 중국어 Day 17 难得 nándé 모처럼, 좀처럼 없는 중국어 Day 18 加班 jiābān 야근하다 중국어 Day 18 要不 yàobù 아니면 (~할까) 중국어 Day 18 火锅 huǒguō 훠궈 중국어 Day 18 双 shuāng 켤레, 쌍 (양사) 중국어 Day 18 运动鞋 yùndòngxié 운동화 중국어 Day 18 旧 jiù 낡다, 오래되다 중국어 Day 18 舍不得 shěbude 아까워서 ~하지 못하다 중국어 Day 18 扔 rēng 버리다, 던지다 중국어 Day 18 毕竟 bìjìng 어쨌든, 아무래도 중국어 Day 18 送 sòng 선물하다, 주다 중국어 Day 18 관련 비즈니스 중국어 노트"}, {"title": "중국어 문법 모음", "category": "chinese", "updated": "2026-11-26", "order": 2, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<p>날짜별 페이지의 문법 설명을 순서대로 모았습니다.<\/p>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 01\">중국어 Day 01<\/a><\/h2>\n<ul>\n<li>安排(ānpái) + 일정/활동: \"~을 잡다, 준비하다\". (安排时间(ānpái shíjiān), 安排见面(ānpái jiànmiàn))<\/li>\n<li>一次(yí cì): 동작의 횟수를 나타내는 양사, \"한 번\".<\/li>\n<li>주제 먼저 말하기: 这个问题(zhège wèntí)를 문장 맨 앞에 두는 회화체 구조.<\/li>\n<li>동사 + 一下(yíxià): \"좀 ~해 보다\", 말투를 부드럽게 함. (看一下(kàn yíxià), 查一下(chá yíxià))<\/li>\n<li>给(gěi) + 사람 + 回复(huífù): \"~에게 회신하다\", 给您(gěi nín)은 공손한 표현.<\/li>\n<\/ul>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 02\">중국어 Day 02<\/a><\/h2>\n<ul>\n<li>请问(qǐngwèn) + 질문: \"실례지만, 여쭤보겠습니다\". 질문을 정중하게 시작하는 표현.<\/li>\n<li>笔(bǐ): 거래·금액·자금을 세는 양사. (一笔钱(yì bǐ qián), 这笔订单(zhè bǐ dìngdān))<\/li>\n<li>到账(dàozhàng): \"(돈이) 계좌에 들어오다, 입금되다\". 能(néng)과 함께 \"입금될 수 있다\"로 씀.<\/li>\n<li>동사 + 后的(hòu de) + 명사: \"~한 후의 ~\". (修改后的版本(xiūgǎi hòu de bǎnběn), 签字后的合同(qiānzì hòu de hétong))<\/li>\n<li>麻烦您(máfan nín) + 동사: \"번거로우시겠지만 ~해 주세요\". 请(qǐng)보다 부드러운 부탁 표현.<\/li>\n<li>看一下(kàn yíxià): Day 1의 동사 + 一下(yíxià) 복습, \"좀 봐 주세요\".<\/li>\n<\/ul>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 03\">중국어 Day 03<\/a><\/h2>\n<ul>\n<li>동사 + 得(de) + 怎么样(zěnmeyàng): \"~한 게 어때요?\" 정도보어로 상태·결과를 물음. (睡得怎么样(shuì de zěnmeyàng), 吃得怎么样(chī de zěnmeyàng))<\/li>\n<li>过(guò): 여기서는 \"(시간을) 보내다\". (过周末(guò zhōumò), 过生日(guò shēngrì))<\/li>\n<li>一整天(yì zhěng tiān): \"하루 종일\". 시간을 나타내는 말이 동사 + 了(le) 뒤에 와서 지속 시간을 나타냄.<\/li>\n<li>越来越(yuè lái yuè) + 형용사: \"점점 ~해지다\". 문장 끝 了(le)와 함께 변화를 나타냄. (越来越忙(yuè lái yuè máng))<\/li>\n<li>……的时候(de shíhou): \"~할 때\". (吃饭的时候(chīfàn de shíhou))<\/li>\n<li>多(duō) + 동사 + 点儿(diǎnr): \"좀 더 ~하다\". 권유할 때 자주 씀. (多吃点儿(duō chī diǎnr), 多喝点儿水(duō hē diǎnr shuǐ))<\/li>\n<\/ul>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 심화 문장\">중국어 심화 문장<\/a><\/h2>\n<ul>\n<li>鉴于(jiànyú) + 상황: \"~을 감안하여\", 因为(yīnwèi)보다 격식 있는 표현.<\/li>\n<li>就(jiù) + 대상: \"~에 관하여\". (就此事进行讨论(jiù cǐ shì jìnxíng tǎolùn))<\/li>\n<li>予以(yǔyǐ) + 2음절 동사: \"~을 해 주다\"의 서면어. (予以确认(yǔyǐ quèrèn), 予以支持(yǔyǐ zhīchí))<\/li>\n<li>如(rú) + 조건: 如果(rúguǒ)의 서면어.<\/li>\n<li>贵司(guìsī) / 我方(wǒfāng): \"귀사\" / \"당사\".<\/li>\n<li>上述(shàngshù): \"상술한, 위에서 언급한\". (上述条款(shàngshù tiáokuǎn))<\/li>\n<li>敬请(jìngqǐng) + 동사: \"~해 주시기 바랍니다\", 请(qǐng)보다 공손한 표현.<\/li>\n<\/ul>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 04\">중국어 Day 04<\/a><\/h2>\n<ul>\n<li>刚(gāng) + 동사: \"막 ~했다\". 방금 일어난 일을 나타냄. (刚起床(gāng qǐchuáng), 刚下班(gāng xiàbān))<\/li>\n<li>快(kuài) + 동사/형용사 + 了(le): \"곧 ~하게 되다\". 임박한 상황을 나타냄. (快到了(kuài dào le), 快下雨了(kuài xiàyǔ le))<\/li>\n<li>等(děng) + A + 再(zài) + B: \"A하고 나서 B하다\". 순서를 정해 미룰 때 씀. (等你回来再说(děng nǐ huílai zài shuō))<\/li>\n<li>동사 + 好(hǎo): 결과보어, \"(제대로) 다 ~하다\". 充好电(chōng hǎo diàn), 准备好(zhǔnbèi hǎo)<\/li>\n<li>A是A，就是……: \"A하긴 A한데, 다만 ~\". 일단 인정하고 아쉬운 점을 덧붙이는 회화 표현. (便宜是便宜，就是有点儿远(piányi shì piányi, jiùshì yǒudiǎnr yuǎn))<\/li>\n<li>就是(jiùshì): 여기서는 \"다만, 단지\". 앞 내용에 대한 아쉬움·단점을 말할 때 씀.<\/li>\n<li>家(jiā): 가게·회사·식당을 세는 양사. (一家咖啡店(yì jiā kāfēidiàn))<\/li>\n<li>太(tài) + 형용사 + 了(le): \"너무 ~하다\". 정도가 지나침을 나타냄.<\/li>\n<\/ul>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 05\">중국어 Day 05<\/a><\/h2>\n<ul>\n<li>本来(běnlái) + 打算(dǎsuàn): \"원래 ~하려고 했다\". 계획이 바뀌었음을 미리 알려 줌. (我本来想去(wǒ běnlái xiǎng qù))<\/li>\n<li>结果(jiéguǒ): 문장 중간에서 \"그런데 결국, 결과적으로\". 예상과 다른 결과를 이어 줌. (结果下雨了(jiéguǒ xiàyǔ le))<\/li>\n<li>只好(zhǐhǎo) + 동사: \"어쩔 수 없이 ~하다\". 다른 선택지가 없을 때 씀. (只好打车(zhǐhǎo dǎchē))<\/li>\n<li>改天(gǎitiān): \"다음에, 다른 날에\". 약속을 미룰 때 자주 씀. (改天再聊(gǎitiān zài liáo))<\/li>\n<li>要是(yàoshi)……的话(dehuà): \"만약 ~라면\". 如果(rúguǒ)보다 회화에서 더 자주 씀. (要是下雨的话(yàoshi xiàyǔ dehuà))<\/li>\n<li>咱们(zánmen): 듣는 사람을 포함한 \"우리\". 我们(wǒmen)보다 친근한 말투.<\/li>\n<li>동사 중첩 逛逛(guàngguang): \"좀 ~해 보다\". 가볍고 편한 느낌을 줌. 이합사는 앞 글자만 겹침. (散散步(sàn san bù), 聊聊天(liáo liao tiān))<\/li>\n<li>문장 끝 吧(ba): \"~하자\". 제안·권유를 나타냄. (走吧(zǒu ba))<\/li>\n<\/ul>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 06\">중국어 Day 06<\/a><\/h2>\n<ul>\n<li>差点儿(chàdiǎnr) + 동사: \"하마터면 ~할 뻔했다\". 실제로는 일어나지 않은 일을 말함. (差点儿迟到(chàdiǎnr chídào), 差点儿摔倒(chàdiǎnr shuāidǎo))<\/li>\n<li>把(bǎ) + 목적어 + 동사 + 在(zài) + 장소: \"~을 ~에 (두다/놓다)\". 물건을 어디에 두었는지 말할 때 씀. (把包放在桌子上(bǎ bāo fàng zài zhuōzi shang))<\/li>\n<li>幸亏(xìngkuī): \"다행히, ~덕분에\". 나쁜 일을 피할 수 있었던 이유를 말할 때 씀. (幸亏你来了(xìngkuī nǐ lái le))<\/li>\n<li>一(yī)……就(jiù)……: \"~하기만 하면 (곧) ~하다\". 조건과 결과가 바로 이어짐. (一下雨就堵车(yí xiàyǔ jiù dǔchē), 一喝酒就脸红(yì hē jiǔ jiù liǎnhóng))<\/li>\n<li>连(lián) + 명사 + 都(dōu)/也(yě) + 동사: \"~조차도, ~마저\". 극단적인 예를 들어 강조함. (连水都没喝(lián shuǐ dōu méi hē))<\/li>\n<li>睡懒觉(shuì lǎnjiào): \"늦잠 자다\". 睡觉(shuìjiào)처럼 이합사라서 사이에 수식어가 들어감. (睡了个懒觉(shuì le ge lǎnjiào))<\/li>\n<\/ul>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 07\">중국어 Day 07<\/a><\/h2>\n<ul>\n<li>……的路上(de lùshang): \"~하는 길에\". 이동 중에 무언가를 할 때 씀. (上班的路上(shàngbān de lùshang), 回家的路上(huí jiā de lùshang))<\/li>\n<li>顺便(shùnbiàn) + 동사: \"~하는 김에\". 원래 하던 일에 다른 일을 덧붙일 때 씀. (顺便去趟超市(shùnbiàn qù tàng chāoshì))<\/li>\n<li>帮(bāng) + 사람 + 동사: \"~에게 ~해 주다\". 부탁할 때 아주 자주 씀. (帮我看看(bāng wǒ kànkan), 帮我拿着(bāng wǒ ná zhe))<\/li>\n<li>一(yī) + 양사 + 都(dōu) + 没有(méiyǒu): \"하나도 없다\". 강한 부정을 나타냄. (一个人都没有(yí ge rén dōu méiyǒu), 一分钱都没有(yì fēn qián dōu méiyǒu))<\/li>\n<li>买瓶牛奶(mǎi píng niúnǎi): 회화에서는 동사 뒤 수사 一(yī)를 자주 생략함. (喝杯咖啡(hē bēi kāfēi))<\/li>\n<li>동사 + 不下去(bu xiàqù): 가능보어 부정형, \"(더 이상) 계속 ~할 수 없다\". 긍정은 看得下去(kàn de xiàqù). (听不下去(tīng bu xiàqù), 吃不下去(chī bu xiàqù))<\/li>\n<li>还是(háishi) + 别(bié) + 동사 + 了(le): \"~하지 않는 게 낫겠다\". 상대에게 조언할 때 씀. (你还是早点儿睡吧(nǐ háishi zǎo diǎnr shuì ba))<\/li>\n<li>了一半就(le yíbàn jiù): \"반만 ~하고 바로\". 就(jiù)가 예상보다 일찍 멈췄다는 느낌을 줌.<\/li>\n<li>部(bù): 영화·드라마를 세는 양사. (一部电影(yí bù diànyǐng))<\/li>\n<\/ul>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 08\">중국어 Day 08<\/a><\/h2>\n<ul>\n<li>估计(gūjì) + 문장: \"아마 ~일 것 같다\". 회화에서 추측할 때 아주 자주 씀. (估计他不来了(gūjì tā bù lái le))<\/li>\n<li>还得(hái děi) + 동사: \"아직 더 ~해야 한다\". 이때 得는 děi로 읽음. (还得等一会儿(hái děi děng yíhuìr))<\/li>\n<li>才(cái) + 동사: \"그제야, 겨우 ~하다\". 예상보다 늦거나 오래 걸림을 나타냄. 就(jiù)와 반대 느낌. (他十点才起床(tā shí diǎn cái qǐchuáng))<\/li>\n<li>A了(le)就(jiù)B: \"A하면 (바로) B해\". 조건이 생기면 그렇게 하라는 가벼운 권유. (累了就休息(lèi le jiù xiūxi))<\/li>\n<li>迷上(míshàng) + 대상: \"~에 푹 빠지다\". 방향보어 上(shàng)이 \"~하기 시작해 붙다\"의 뜻. (爱上(àishàng), 喜欢上(xǐhuan shàng))<\/li>\n<li>不管(bùguǎn) + 多(duō) + 형용사, ……都(dōu)……: \"아무리 ~해도 ~한다\". 조건에 상관없이 결과가 같음. (不管多忙，都要吃早饭(bùguǎn duō máng, dōu yào chī zǎofàn))<\/li>\n<li>要(yào) + 동사: 여기서는 \"꼭 ~하려고 한다\". 의지·습관을 나타냄.<\/li>\n<li>顿(dùn): 끼니를 세는 양사. (吃一顿饭(chī yí dùn fàn), 请你吃顿饭(qǐng nǐ chī dùn fàn))<\/li>\n<\/ul>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 09\">중국어 Day 09<\/a><\/h2>\n<ul>\n<li>怎么(zěnme) + 也(yě) + 부정: \"아무리 해도 ~이 안 되다\". 노력해도 안 될 때 씀. (怎么也找不到(zěnme yě zhǎo bu dào), 怎么也想不起来(zěnme yě xiǎng bu qǐlái))<\/li>\n<li>睡不着(shuì bu zháo): 결과보어 着(zháo) \"(목적을) 이루다\"의 가능보어 부정형, \"잠들 수 없다\". 긍정은 睡得着(shuì de zháo). (买不着(mǎi bu zháo), 找不着(zhǎo bu zháo))<\/li>\n<li>干脆(gāncuì) + 동사: \"아예, 차라리 (시원하게) ~하다\". 고민하다가 결단을 내릴 때 씀. (干脆打车吧(gāncuì dǎchē ba), 干脆不去了(gāncuì bú qù le))<\/li>\n<li>동사 + 了(le) + (一)会儿(huìr) + 목적어: \"잠깐 ~했다\". 시량보어는 동사와 목적어 사이에 옴. (聊了会儿天(liáo le huìr tiān), 玩了会儿手机(wán le huìr shǒujī))<\/li>\n<li>동사 + 着(zhe) + 형용사: \"~해 보니 ~하다\". 직접 해 본 느낌을 말할 때 씀. (听着不错(tīng zhe búcuò), 看着挺好吃(kàn zhe tǐng hǎochī))<\/li>\n<li>有点儿(yǒudiǎnr) + 형용사: \"좀 ~하다\". 주로 불만·아쉬움 등 부정적인 느낌. 一点儿(yìdiǎnr)은 형용사 뒤에 옴. (有点儿贵(yǒudiǎnr guì) ↔ 便宜一点儿(piányi yìdiǎnr))<\/li>\n<li>能不能(néng bu néng) + 동사: 정반의문문, \"~할 수 있어요?\" 부탁을 부드럽게 함. (能不能便宜点儿(néng bu néng piányi diǎnr))<\/li>\n<li>형용사 + 一号(yí hào): \"한 치수 ~한\". 小一号(xiǎo yí hào) \"한 치수 작은\", 大一号(dà yí hào) \"한 치수 큰\". 的(de)로 끝나 \"~한 것\"을 나타냄.<\/li>\n<\/ul>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 10\">중국어 Day 10<\/a><\/h2>\n<ul>\n<li>早知道(zǎo zhīdào)……，就(jiù)……了(le): \"진작 ~인 줄 알았으면 ~했을 텐데\". 이미 지난 일을 후회할 때 씀. (早知道你也去，我就等你了(zǎo zhīdào nǐ yě qù, wǒ jiù děng nǐ le))<\/li>\n<li>这么(zhème) + 형용사: \"이렇게 ~하다\". 예상보다 정도가 심할 때 씀. (这么贵(zhème guì), 这么晚(zhème wǎn))<\/li>\n<li>堵(dǔ): \"(길이) 막히다\". 회화에서는 堵车(dǔchē)로도 자주 씀. (路上很堵(lùshang hěn dǔ))<\/li>\n<li>坐(zuò) + 교통수단 + 来/去(lái/qù): \"~을 타고 오다/가다\". 수단을 먼저, 이동 동사를 뒤에 씀. (坐公交去(zuò gōngjiāo qù), 坐飞机来(zuò fēijī lái))<\/li>\n<li>수식어 + 的(de) + 那(nà) + 양사 + 명사: \"~한 그 ~\". 긴 수식어로 대상을 특정함. (你说的那本书(nǐ shuō de nà běn shū), 昨天见的那个人(zuótiān jiàn de nà ge rén))<\/li>\n<li>동사 + 过(guo): \"~해 본 적 있다\". 경험을 나타냄. 부정은 没(méi) + 동사 + 过(guo). (我吃过(wǒ chī guo), 没去过(méi qù guo))<\/li>\n<li>确实(quèshí): \"확실히, 정말로\". 상대 말이나 소문이 맞다고 인정할 때 씀. (确实挺好(quèshí tǐng hǎo))<\/li>\n<li>难怪(nánguài): \"어쩐지, 그러니까 ~했구나\". 이유를 알고 나서 납득할 때 씀. (难怪这么便宜(nánguài zhème piányi), 难怪他不高兴(nánguài tā bù gāoxìng))<\/li>\n<\/ul>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 11\">중국어 Day 11<\/a><\/h2>\n<ul>\n<li>先别(xiān bié) + 동사: \"일단 ~하지 마\". 상대의 행동을 잠깐 멈추게 할 때 씀. (先别走(xiān bié zǒu), 先别告诉他(xiān bié gàosu tā))<\/li>\n<li>急着(jízhe) + 동사: \"서둘러 ~하려 하다, 급하게 ~하다\". 别(bié)와 함께 \"서두르지 마\"로 자주 씀. (急着回家(jízhe huí jiā), 别急着做决定(bié jízhe zuò juédìng))<\/li>\n<li>동사 + 完(wán): 결과보어, \"다 ~하다, ~을 끝내다\". 부정은 没(méi) + 동사 + 完(wán). (吃完了(chī wán le), 还没看完(hái méi kàn wán))<\/li>\n<li>还(hái)……呢(ne): \"아직 ~한 상태야\". 상황이 계속되고 있음을 부드럽게 강조함. (他还在睡觉呢(tā hái zài shuìjiào ne), 我还没吃饭呢(wǒ hái méi chī fàn ne))<\/li>\n<li>除了(chúle)……以外(yǐwài)，都(dōu)……: \"~을 빼고 모두 ~\". 뒤에 也(yě)/还(hái)가 오면 \"~외에도 또\"라는 뜻이 됨. (除了他以外，大家都来了(chúle tā yǐwài, dàjiā dōu lái le) / 除了咖啡，我也喜欢喝茶(chúle kāfēi, wǒ yě xǐhuan hē chá))<\/li>\n<li>行(xíng): \"괜찮다, 된다\". 약속·제안에 동의할 때 짧게 씀. (明天也行(míngtiān yě xíng), 这样行不行?(zhèyàng xíng bu xíng))<\/li>\n<li>你看(nǐ kàn) + 질문: \"네 생각엔 ~?\" 상대의 의견을 물을 때 씀. 여기서 看(kàn)은 \"보다\"가 아니라 \"판단하다\". (你看怎么样?(nǐ kàn zěnmeyàng))<\/li>\n<li>方便(fāngbiàn): \"(시간·형편이) 괜찮다, 편하다\". 약속 잡을 때 상대 사정을 배려하는 표현. (你什么时候方便?(nǐ shénme shíhou fāngbiàn))<\/li>\n<\/ul>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 12\">중국어 Day 12<\/a><\/h2>\n<ul>\n<li>好久没(hǎojiǔ méi) + 동사 + 了(le): \"오랫동안 ~ 안 했다\". 한동안 하지 않은 일을 말할 때 씀. (好久没见了(hǎojiǔ méi jiàn le), 好久没运动了(hǎojiǔ méi yùndòng le))<\/li>\n<li>형용사 + 得不行(de bùxíng): \"엄청 ~하다, ~해서 못 견디겠다\". 정도가 아주 심함을 나타내는 회화체 정도보어. (累得不行(lèi de bùxíng), 饿得不行(è de bùxíng))<\/li>\n<li>非得(fēiděi)……不可(bùkě): \"꼭 ~해야만 한다\". 강한 필요나 결심을 나타냄. 회화에서는 不可(bùkě)를 생략하기도 함. (今天非得做完不可(jīntiān fēiděi zuò wán bùkě))<\/li>\n<li>好好(hǎohǎo) + 동사: \"제대로, 푹 ~하다\". (好好休息(hǎohǎo xiūxi), 好好想想(hǎohǎo xiǎngxiang))<\/li>\n<li>正要(zhèng yào) + 동사: \"막 ~하려던 참이다\". 그때 다른 일이 끼어들었음을 말할 때 씀. (我正要给你打电话(wǒ zhèng yào gěi nǐ dǎ diànhuà))<\/li>\n<li>동사 + 起(qǐ) + 목적어 + 来(lái): \"~하기 시작하다\". 목적어는 起(qǐ)와 来(lái) 사이에 옴. (唱起歌来(chàng qǐ gē lái), 聊起天来(liáo qǐ tiān lái))<\/li>\n<li>看来(kànlái): \"보아하니 ~인 것 같다\". 눈앞의 상황을 근거로 판단할 때 씀. 估计(gūjì)보다 근거가 분명한 느낌. (看来他不会来了(kànlái tā bú huì lái le))<\/li>\n<li>只能(zhǐ néng) + 동사 + 了(le): \"~할 수밖에 없다\". (只能等了(zhǐ néng děng le))<\/li>\n<li>待着(dāi zhe): \"(한곳에) 머물러 있다\". 待(dāi)는 회화에서 \"있다, 머무르다\"의 뜻. (在家待着(zài jiā dāi zhe), 待了一会儿(dāi le yíhuìr))<\/li>\n<\/ul>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 13\">중국어 Day 13<\/a><\/h2>\n<ul>\n<li>被(bèi) + 행위자 + 동사 + 기타 성분: 피동문, \"~에게 ~당하다\". 주로 원하지 않은 일에 씀. 동사 뒤에 了(le)나 결과보어가 붙음. (我的蛋糕被弟弟吃了(wǒ de dàngāo bèi dìdi chī le), 钱包被偷了(qiánbāo bèi tōu le))<\/li>\n<li>동사 + 错(cuò): 결과보어, \"잘못 ~하다\". (走错路(zǒu cuò lù), 打错电话(dǎ cuò diànhuà), 听错了(tīng cuò le))<\/li>\n<li>害得(hài de) + 사람 + 결과: \"~하는 바람에 (누가) ~하게 됐다\". 남 탓을 하며 나쁜 결과를 말할 때 씀. (你迟到了，害得我们等了半天(nǐ chídào le, hài de wǒmen děng le bàntiān))<\/li>\n<li>동사 + 了(le) + 半天(bàntiān): \"한참 동안 ~했다\". 실제 반나절이 아니라 \"오래\"라는 과장 표현. (说了半天(shuō le bàntiān), 想了半天(xiǎng le bàntiān))<\/li>\n<li>既然(jìrán)……，那(nà)/就(jiù)……: \"기왕 ~한 이상, ~하자\". 이미 사실인 것을 근거로 제안·결론을 낼 때 씀. (既然来了，就多玩儿几天吧(jìrán lái le, jiù duō wánr jǐ tiān ba))<\/li>\n<li>不用(búyòng) + 동사: \"~할 필요 없다, ~안 해도 된다\". 不要(búyào) \"~하지 마\"와 구별. (不用谢(búyòng xiè), 明天不用早起(míngtiān búyòng zǎo qǐ))<\/li>\n<li>陪(péi) + 사람 + 동사: \"~와 함께 ~해 주다\". 상대 곁에 있어 주는 느낌. (陪我去医院(péi wǒ qù yīyuàn), 陪孩子玩儿(péi háizi wánr))<\/li>\n<li>场(chǎng): 영화 상영·경기·공연 등 한 회를 세는 양사. 작품 자체를 셀 때는 部(bù). (看场电影(kàn chǎng diànyǐng), 一场比赛(yì chǎng bǐsài))<\/li>\n<li>문장 끝 呗(bei): \"~하면 되지, ~하자\". 吧(ba)보다 더 가볍고 편한 말투로, 당연하다는 느낌을 줌. (不会就问呗(bú huì jiù wèn bei))<\/li>\n<\/ul>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 14\">중국어 Day 14<\/a><\/h2>\n<ul>\n<li>光顾着(guāng gùzhe) + 동사: \"~하는 데만 정신이 팔려서\". 그 바람에 다른 걸 놓쳤다는 뉘앙스. (光顾着说话(guāng gùzhe shuōhuà), 光顾着玩儿，忘了吃饭(guāng gùzhe wánr, wàng le chīfàn))<\/li>\n<li>一不小心(yí bù xiǎoxīn): \"깜빡하는 사이에, 실수로\". 의도치 않게 생긴 일 앞에 씀. (一不小心摔倒了(yí bù xiǎoxīn shuāidǎo le), 一不小心说漏嘴了(yí bù xiǎoxīn shuō lòu zuǐ le))<\/li>\n<li>동사 + 过(guò): 방향보어, \"(지점을) 지나치다\". 경험의 过(guo)와 달리 4성으로 읽음. (坐过站(zuò guò zhàn), 睡过头了(shuì guò tóu le), 走过头了(zǒu guò tóu le))<\/li>\n<li>站(zhàn): 정거장 수를 세는 양사. (还有三站(hái yǒu sān zhàn), 下一站(xià yí zhàn))<\/li>\n<li>형용사 + 得厉害(de lìhai): \"몹시 ~하다\". 정도가 심함을 나타내며, 주로 좋지 않은 상태에 씀. (疼得厉害(téng de lìhai), 堵得厉害(dǔ de lìhai))<\/li>\n<li>동사 + 양사 + 명사: 수사 一(yī)를 생략한 회화체. 带把伞(dài bǎ sǎn)의 把(bǎ)는 손잡이 있는 물건을 세는 양사로, 把자문의 把와 다름. (买瓶水(mǎi píng shuǐ), 一把椅子(yì bǎ yǐzi))<\/li>\n<li>万一(wànyī): \"만에 하나, 혹시라도\". 일어나지 않았으면 하는 일을 가정할 때 씀. (万一迟到了怎么办(wànyī chídào le zěnme bàn))<\/li>\n<li>……也不怕(yě bú pà): \"~해도 걱정 없다\". 미리 대비해 두었다는 느낌. (有了地图，迷路也不怕(yǒu le dìtú, mílù yě bú pà))<\/li>\n<\/ul>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 15\">중국어 Day 15<\/a><\/h2>\n<ul>\n<li>A + 比(bǐ) + B + 형용사 + 多了(duō le): \"A가 B보다 훨씬 ~하다\". 차이가 클 때 형용사 뒤에 多了(duō le)를 붙임. 比(bǐ) 비교문에는 很(hěn)·非常(fēicháng)을 쓰지 않음. (今天比昨天冷多了(jīntiān bǐ zuótiān lěng duō le), 这个比那个便宜多了(zhège bǐ nàge piányi duō le))<\/li>\n<li>比我想象的(bǐ wǒ xiǎngxiàng de): \"내가 생각한 것보다, 생각보다\". 比想象中(bǐ xiǎngxiàng zhōng)이라고도 함. (比我想象的难(bǐ wǒ xiǎngxiàng de nán))<\/li>\n<li>带(dài) + 사람 + 来/去(lái/qù) + 동사: \"~을 데리고 와서/가서 ~하다\". 물건뿐 아니라 사람을 데려갈 때도 带(dài)를 씀. (带孩子去公园玩儿(dài háizi qù gōngyuán wánr), 带你去看看(dài nǐ qù kànkan))<\/li>\n<li>尝尝(chángchang): 동사 중첩 복습, \"좀 맛보다\". 음식을 권할 때 아주 자주 씀. (你尝尝这个(nǐ chángchang zhège))<\/li>\n<li>一边(yìbiān) + A + 一边(yìbiān) + B: \"A하면서 B하다\". 두 동작을 동시에 할 때 씀. 회화에서는 边(biān)……边(biān)……로 줄이기도 함. (一边吃饭一边看手机(yìbiān chī fàn yìbiān kàn shǒujī), 边走边聊(biān zǒu biān liáo))<\/li>\n<li>不知不觉(bù zhī bù jué): \"나도 모르는 사이에, 어느새\". 시간이 빨리 지나갔거나 변화를 늦게 알아챘을 때 씀. (不知不觉一年过去了(bù zhī bù jué yì nián guòqu le))<\/li>\n<li>就(jiù) + 到(dào) + 시간 + 了(le): \"벌써 ~(시간)이 되다\". 就(jiù)가 \"생각보다 빨리\"라는 느낌을 더함. (才(cái)와 반대) (一会儿就到十点了(yíhuìr jiù dào shí diǎn le))<\/li>\n<\/ul>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 16\">중국어 Day 16<\/a><\/h2>\n<ul>\n<li>의문사 + 也/都(yě/dōu) + 부정: \"아무 ~도 …하지 않다\". 哪儿(nǎr)·谁(shéi)·什么(shénme) 같은 의문사가 '모든 것'을 가리킴. (谁都不认识(shéi dōu bú rènshi), 什么也没吃(shénme yě méi chī))<\/li>\n<li>就(jiù) + 想(xiǎng) + 동사: 여기서 就(jiù)는 \"그냥, 오직\". 다른 건 말고 이것만 하고 싶다는 느낌. (我就想睡觉(wǒ jiù xiǎng shuìjiào))<\/li>\n<li>동사1 + 着(zhe) + 동사2: \"~한 채로 ~하다\". 동사1이 동사2를 하는 방식·자세를 나타냄. (躺着看手机(tǎngzhe kàn shǒujī), 站着吃饭(zhànzhe chī fàn))<\/li>\n<li>追剧(zhuī jù): \"드라마를 챙겨 보다, 정주행하다\". 회화에서 아주 자주 쓰는 표현. (最近在追什么剧?(zuìjìn zài zhuī shénme jù?))<\/li>\n<li>还以为(hái yǐwéi)……呢(ne): \"(사실과 달리) ~인 줄 알았다\". 以为(yǐwéi)는 생각이 틀렸을 때 씀. 자기 의견을 말할 땐 认为(rènwéi)/觉得(juéde). (我还以为你不来了呢(wǒ hái yǐwéi nǐ bù lái le ne))<\/li>\n<li>原来(yuánlái): \"알고 보니\". 몰랐던 사실을 새로 알게 됐을 때 문장 앞에 씀. (原来是你啊(yuánlái shì nǐ a))<\/li>\n<li>早就(zǎo jiù)……了(le): \"진작, 이미 오래전에 ~했다\". (我早就知道了(wǒ zǎo jiù zhīdào le))<\/li>\n<li>还在(hái zài) + 장소/동작: \"아직 ~에 있다, 아직 ~하는 중이다\". (他还在睡觉(tā hái zài shuìjiào))<\/li>\n<\/ul>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 17\">중국어 Day 17<\/a><\/h2>\n<ul>\n<li>趁(chèn) + 상황: \"~한 틈을 타서, ~할 때 (기회를 놓치지 않고)\". 좋은 기회를 이용할 때 씀. (趁热吃(chèn rè chī), 趁年轻(chèn niánqīng))<\/li>\n<li>好几(hǎo jǐ) + 양사: \"여러, 꽤 많은\". 几(jǐ)보다 수가 많다는 느낌을 강조함. (好几天(hǎo jǐ tiān), 好几次(hǎo jǐ cì))<\/li>\n<li>省得(shěngde) + 원치 않는 일: \"~하지 않도록, ~할 필요 없게\". 미리 해 두는 이유를 뒤에 붙일 때 씀. 免得(miǎnde)와 비슷한 회화 표현. (早点儿走，省得堵车(zǎo diǎnr zǒu, shěngde dǔchē))<\/li>\n<li>跑一趟(pǎo yí tàng): \"한 번 다녀오다\". 趟(tàng)은 오가는 횟수를 세는 양사. (去一趟超市(qù yí tàng chāoshì))<\/li>\n<li>动不动就(dòngbudòng jiù) + 동사: \"걸핏하면 ~하다, 툭하면 ~하다\". 자주 일어나는 일(주로 좋지 않은 일)에 씀. (他动不动就生气(tā dòngbudòng jiù shēngqì))<\/li>\n<li>犯困(fànkùn): \"졸음이 오다, 졸리다\". 犯(fàn)은 \"(나쁜 상태가) 도지다\"의 느낌. (一到下午就犯困(yí dào xiàwǔ jiù fànkùn))<\/li>\n<li>说不定(shuōbudìng): \"어쩌면 ~일지도 모른다\". 估计(gūjì)보다 확신이 약한 추측. (说不定他忘了(shuōbudìng tā wàng le))<\/li>\n<li>是因为(shì yīnwèi) + 이유: \"~ 때문이다\". 결과를 먼저 말하고 이유를 뒤에서 설명할 때 씀. (我迟到是因为堵车(wǒ chídào shì yīnwèi dǔchē))<\/li>\n<\/ul>\n<h2><a class=\"wl\" href=\"#\" data-page=\"중국어 Day 18\">중국어 Day 18<\/a><\/h2>\n<ul>\n<li>难得(nándé): \"모처럼, 좀처럼 없는\". 자주 오지 않는 기회라 소중하다는 느낌. 문장 앞이나 명사 앞에 씀. (难得见一面(nándé jiàn yí miàn), 难得的好天气(nándé de hǎo tiānqì))<\/li>\n<li>有个(yǒu ge) + 명사: 有一个(yǒu yí ge)에서 一(yī)를 뺀 회화체. 말할 때 아주 자주 생략함. (我有个问题(wǒ yǒu ge wèntí))<\/li>\n<li>要不(yàobù) + 제안: \"아니면 ~할까?, ~하는 게 어때?\". 가볍게 제안할 때 문장 앞에 씀. 要不然(yàoburán)과 같은 뜻. (要不你先回去吧(yàobù nǐ xiān huíqu ba))<\/li>\n<li>出去(chūqu) + 동사: \"나가서 ~하다\". 이동 동사 뒤에 목적이 되는 동작을 바로 이어 쓰는 연동문. (出去走走(chūqu zǒuzou), 回家吃饭(huí jiā chī fàn))<\/li>\n<li>虽然(suīrán)……可(kě)……: \"비록 ~지만, …\". 회화에서는 但是(dànshì) 대신 可(kě)를 자주 씀. (虽然有点儿贵，可质量很好(suīrán yǒudiǎnr guì, kě zhìliàng hěn hǎo))<\/li>\n<li>舍不得(shěbude) + 동사: \"아까워서(아쉬워서) ~하지 못하다\". 반대는 舍得(shěde). (舍不得花钱(shěbude huā qián), 舍不得走(shěbude zǒu))<\/li>\n<li>毕竟(bìjìng): \"어쨌든, 아무래도 (~이니까)\". 앞에서 말한 감정·행동의 이유가 되는 사실을 강조함. (他毕竟还是个孩子(tā bìjìng hái shì ge háizi))<\/li>\n<li>是(shì)……的(de): 이미 일어난 일에서 누가·언제·어떻게 했는지를 강조. 여기서는 '엄마가' 준 것임을 강조. (这是我自己做的(zhè shì wǒ zìjǐ zuò de))<\/li>\n<li>双(shuāng): 신발·양말·젓가락처럼 짝을 이루는 것을 세는 양사. (一双袜子(yì shuāng wàzi))<\/li>\n<\/ul>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 날짜별 페이지의 문법 설명을 순서대로 모았습니다. 중국어 Day 01 安排(ānpái) + 일정/활동: \"~을 잡다, 준비하다\". (安排时间(ānpái shíjiān), 安排见面(ānpái jiànmiàn)) 一次(yí cì): 동작의 횟수를 나타내는 양사, \"한 번\". 주제 먼저 말하기: 这个问题(zhège wèntí)를 문장 맨 앞에 두는 회화체 구조. 동사 + 一下(yíxià): \"좀 ~해 보다\", 말투를 부드럽게 함. (看一下(kàn yíxià), 查一下(chá yíxià)) 给(gěi) + 사람 + 回复(huífù): \"~에게 회신하다\", 给您(gěi nín)은 공손한 표현. 중국어 Day 02 请问(qǐngwèn) + 질문: \"실례지만, 여쭤보겠습니다\". 질문을 정중하게 시작하는 표현. 笔(bǐ): 거래·금액·자금을 세는 양사. (一笔钱(yì bǐ qián), 这笔订单(zhè bǐ dìngdān)) 到账(dàozhàng): \"(돈이) 계좌에 들어오다, 입금되다\". 能(néng)과 함께 \"입금될 수 있다\"로 씀. 동사 + 后的(hòu de) + 명사: \"~한 후의 ~\". (修改后的版本(xiūgǎi hòu de bǎnběn), 签字后的合同(qiānzì hòu de hétong)) 麻烦您(máfan nín) + 동사: \"번거로우시겠지만 ~해 주세요\". 请(qǐng)보다 부드러운 부탁 표현. 看一下(kàn yíxià): Day 1의 동사 + 一下(yíxià) 복습, \"좀 봐 주세요\". 중국어 Day 03 동사 + 得(de) + 怎么样(zěnmeyàng): \"~한 게 어때요?\" 정도보어로 상태·결과를 물음. (睡得怎么样(shuì de zěnmeyàng), 吃得怎么样(chī de zěnmeyàng)) 过(guò): 여기서는 \"(시간을) 보내다\". (过周末(guò zhōumò), 过生日(guò shēngrì)) 一整天(yì zhěng tiān): \"하루 종일\". 시간을 나타내는 말이 동사 + 了(le) 뒤에 와서 지속 시간을 나타냄. 越来越(yuè lái yuè) + 형용사: \"점점 ~해지다\". 문장 끝 了(le)와 함께 변화를 나타냄. (越来越忙(yuè lái yuè máng)) ……的时候(de shíhou): \"~할 때\". (吃饭的时候(chīfàn de shíhou)) 多(duō) + 동사 + 点儿(diǎnr): \"좀 더 ~하다\". 권유할 때 자주 씀. (多吃点儿(duō chī diǎnr), 多喝点儿水(duō hē diǎnr shuǐ)) 중국어 심화 문장 鉴于(jiànyú) + 상황: \"~을 감안하여\", 因为(yīnwèi)보다 격식 있는 표현. 就(jiù) + 대상: \"~에 관하여\". (就此事进行讨论(jiù cǐ shì jìnxíng tǎolùn)) 予以(yǔyǐ) + 2음절 동사: \"~을 해 주다\"의 서면어. (予以确认(yǔyǐ quèrèn), 予以支持(yǔyǐ zhīchí)) 如(rú) + 조건: 如果(rúguǒ)의 서면어. 贵司(guìsī) / 我方(wǒfāng): \"귀사\" / \"당사\". 上述(shàngshù): \"상술한, 위에서 언급한\". (上述条款(shàngshù tiáokuǎn)) 敬请(jìngqǐng) + 동사: \"~해 주시기 바랍니다\", 请(qǐng)보다 공손한 표현. 중국어 Day 04 刚(gāng) + 동사: \"막 ~했다\". 방금 일어난 일을 나타냄. (刚起床(gāng qǐchuáng), 刚下班(gāng xiàbān)) 快(kuài) + 동사/형용사 + 了(le): \"곧 ~하게 되다\". 임박한 상황을 나타냄. (快到了(kuài dào le), 快下雨了(kuài xiàyǔ le)) 等(děng) + A + 再(zài) + B: \"A하고 나서 B하다\". 순서를 정해 미룰 때 씀. (等你回来再说(děng nǐ huílai zài shuō)) 동사 + 好(hǎo): 결과보어, \"(제대로) 다 ~하다\". 充好电(chōng hǎo diàn), 准备好(zhǔnbèi hǎo) A是A，就是……: \"A하긴 A한데, 다만 ~\". 일단 인정하고 아쉬운 점을 덧붙이는 회화 표현. (便宜是便宜，就是有点儿远(piányi shì piányi, jiùshì yǒudiǎnr yuǎn)) 就是(jiùshì): 여기서는 \"다만, 단지\". 앞 내용에 대한 아쉬움·단점을 말할 때 씀. 家(jiā): 가게·회사·식당을 세는 양사. (一家咖啡店(yì jiā kāfēidiàn)) 太(tài) + 형용사 + 了(le): \"너무 ~하다\". 정도가 지나침을 나타냄. 중국어 Day 05 本来(běnlái) + 打算(dǎsuàn): \"원래 ~하려고 했다\". 계획이 바뀌었음을 미리 알려 줌. (我本来想去(wǒ běnlái xiǎng qù)) 结果(jiéguǒ): 문장 중간에서 \"그런데 결국, 결과적으로\". 예상과 다른 결과를 이어 줌. (结果下雨了(jiéguǒ xiàyǔ le)) 只好(zhǐhǎo) + 동사: \"어쩔 수 없이 ~하다\". 다른 선택지가 없을 때 씀. (只好打车(zhǐhǎo dǎchē)) 改天(gǎitiān): \"다음에, 다른 날에\". 약속을 미룰 때 자주 씀. (改天再聊(gǎitiān zài liáo)) 要是(yàoshi)……的话(dehuà): \"만약 ~라면\". 如果(rúguǒ)보다 회화에서 더 자주 씀. (要是下雨的话(yàoshi xiàyǔ dehuà)) 咱们(zánmen): 듣는 사람을 포함한 \"우리\". 我们(wǒmen)보다 친근한 말투. 동사 중첩 逛逛(guàngguang): \"좀 ~해 보다\". 가볍고 편한 느낌을 줌. 이합사는 앞 글자만 겹침. (散散步(sàn san bù), 聊聊天(liáo liao tiān)) 문장 끝 吧(ba): \"~하자\". 제안·권유를 나타냄. (走吧(zǒu ba)) 중국어 Day 06 差点儿(chàdiǎnr) + 동사: \"하마터면 ~할 뻔했다\". 실제로는 일어나지 않은 일을 말함. (差点儿迟到(chàdiǎnr chídào), 差点儿摔倒(chàdiǎnr shuāidǎo)) 把(bǎ) + 목적어 + 동사 + 在(zài) + 장소: \"~을 ~에 (두다/놓다)\". 물건을 어디에 두었는지 말할 때 씀. (把包放在桌子上(bǎ bāo fàng zài zhuōzi shang)) 幸亏(xìngkuī): \"다행히, ~덕분에\". 나쁜 일을 피할 수 있었던 이유를 말할 때 씀. (幸亏你来了(xìngkuī nǐ lái le)) 一(yī)……就(jiù)……: \"~하기만 하면 (곧) ~하다\". 조건과 결과가 바로 이어짐. (一下雨就堵车(yí xiàyǔ jiù dǔchē), 一喝酒就脸红(yì hē jiǔ jiù liǎnhóng)) 连(lián) + 명사 + 都(dōu)/也(yě) + 동사: \"~조차도, ~마저\". 극단적인 예를 들어 강조함. (连水都没喝(lián shuǐ dōu méi hē)) 睡懒觉(shuì lǎnjiào): \"늦잠 자다\". 睡觉(shuìjiào)처럼 이합사라서 사이에 수식어가 들어감. (睡了个懒觉(shuì le ge lǎnjiào)) 중국어 Day 07 ……的路上(de lùshang): \"~하는 길에\". 이동 중에 무언가를 할 때 씀. (上班的路上(shàngbān de lùshang), 回家的路上(huí jiā de lùshang)) 顺便(shùnbiàn) + 동사: \"~하는 김에\". 원래 하던 일에 다른 일을 덧붙일 때 씀. (顺便去趟超市(shùnbiàn qù tàng chāoshì)) 帮(bāng) + 사람 + 동사: \"~에게 ~해 주다\". 부탁할 때 아주 자주 씀. (帮我看看(bāng wǒ kànkan), 帮我拿着(bāng wǒ ná zhe)) 一(yī) + 양사 + 都(dōu) + 没有(méiyǒu): \"하나도 없다\". 강한 부정을 나타냄. (一个人都没有(yí ge rén dōu méiyǒu), 一分钱都没有(yì fēn qián dōu méiyǒu)) 买瓶牛奶(mǎi píng niúnǎi): 회화에서는 동사 뒤 수사 一(yī)를 자주 생략함. (喝杯咖啡(hē bēi kāfēi)) 동사 + 不下去(bu xiàqù): 가능보어 부정형, \"(더 이상) 계속 ~할 수 없다\". 긍정은 看得下去(kàn de xiàqù). (听不下去(tīng bu xiàqù), 吃不下去(chī bu xiàqù)) 还是(háishi) + 别(bié) + 동사 + 了(le): \"~하지 않는 게 낫겠다\". 상대에게 조언할 때 씀. (你还是早点儿睡吧(nǐ háishi zǎo diǎnr shuì ba)) 了一半就(le yíbàn jiù): \"반만 ~하고 바로\". 就(jiù)가 예상보다 일찍 멈췄다는 느낌을 줌. 部(bù): 영화·드라마를 세는 양사. (一部电影(yí bù diànyǐng)) 중국어 Day 08 估计(gūjì) + 문장: \"아마 ~일 것 같다\". 회화에서 추측할 때 아주 자주 씀. (估计他不来了(gūjì tā bù lái le)) 还得(hái děi) + 동사: \"아직 더 ~해야 한다\". 이때 得는 děi로 읽음. (还得等一会儿(hái děi děng yíhuìr)) 才(cái) + 동사: \"그제야, 겨우 ~하다\". 예상보다 늦거나 오래 걸림을 나타냄. 就(jiù)와 반대 느낌. (他十点才起床(tā shí diǎn cái qǐchuáng)) A了(le)就(jiù)B: \"A하면 (바로) B해\". 조건이 생기면 그렇게 하라는 가벼운 권유. (累了就休息(lèi le jiù xiūxi)) 迷上(míshàng) + 대상: \"~에 푹 빠지다\". 방향보어 上(shàng)이 \"~하기 시작해 붙다\"의 뜻. (爱上(àishàng), 喜欢上(xǐhuan shàng)) 不管(bùguǎn) + 多(duō) + 형용사, ……都(dōu)……: \"아무리 ~해도 ~한다\". 조건에 상관없이 결과가 같음. (不管多忙，都要吃早饭(bùguǎn duō máng, dōu yào chī zǎofàn)) 要(yào) + 동사: 여기서는 \"꼭 ~하려고 한다\". 의지·습관을 나타냄. 顿(dùn): 끼니를 세는 양사. (吃一顿饭(chī yí dùn fàn), 请你吃顿饭(qǐng nǐ chī dùn fàn)) 중국어 Day 09 怎么(zěnme) + 也(yě) + 부정: \"아무리 해도 ~이 안 되다\". 노력해도 안 될 때 씀. (怎么也找不到(zěnme yě zhǎo bu dào), 怎么也想不起来(zěnme yě xiǎng bu qǐlái)) 睡不着(shuì bu zháo): 결과보어 着(zháo) \"(목적을) 이루다\"의 가능보어 부정형, \"잠들 수 없다\". 긍정은 睡得着(shuì de zháo). (买不着(mǎi bu zháo), 找不着(zhǎo bu zháo)) 干脆(gāncuì) + 동사: \"아예, 차라리 (시원하게) ~하다\". 고민하다가 결단을 내릴 때 씀. (干脆打车吧(gāncuì dǎchē ba), 干脆不去了(gāncuì bú qù le)) 동사 + 了(le) + (一)会儿(huìr) + 목적어: \"잠깐 ~했다\". 시량보어는 동사와 목적어 사이에 옴. (聊了会儿天(liáo le huìr tiān), 玩了会儿手机(wán le huìr shǒujī)) 동사 + 着(zhe) + 형용사: \"~해 보니 ~하다\". 직접 해 본 느낌을 말할 때 씀. (听着不错(tīng zhe búcuò), 看着挺好吃(kàn zhe tǐng hǎochī)) 有点儿(yǒudiǎnr) + 형용사: \"좀 ~하다\". 주로 불만·아쉬움 등 부정적인 느낌. 一点儿(yìdiǎnr)은 형용사 뒤에 옴. (有点儿贵(yǒudiǎnr guì) ↔ 便宜一点儿(piányi yìdiǎnr)) 能不能(néng bu néng) + 동사: 정반의문문, \"~할 수 있어요?\" 부탁을 부드럽게 함. (能不能便宜点儿(néng bu néng piányi diǎnr)) 형용사 + 一号(yí hào): \"한 치수 ~한\". 小一号(xiǎo yí hào) \"한 치수 작은\", 大一号(dà yí hào) \"한 치수 큰\". 的(de)로 끝나 \"~한 것\"을 나타냄. 중국어 Day 10 早知道(zǎo zhīdào)……，就(jiù)……了(le): \"진작 ~인 줄 알았으면 ~했을 텐데\". 이미 지난 일을 후회할 때 씀. (早知道你也去，我就等你了(zǎo zhīdào nǐ yě qù, wǒ jiù děng nǐ le)) 这么(zhème) + 형용사: \"이렇게 ~하다\". 예상보다 정도가 심할 때 씀. (这么贵(zhème guì), 这么晚(zhème wǎn)) 堵(dǔ): \"(길이) 막히다\". 회화에서는 堵车(dǔchē)로도 자주 씀. (路上很堵(lùshang hěn dǔ)) 坐(zuò) + 교통수단 + 来/去(lái/qù): \"~을 타고 오다/가다\". 수단을 먼저, 이동 동사를 뒤에 씀. (坐公交去(zuò gōngjiāo qù), 坐飞机来(zuò fēijī lái)) 수식어 + 的(de) + 那(nà) + 양사 + 명사: \"~한 그 ~\". 긴 수식어로 대상을 특정함. (你说的那本书(nǐ shuō de nà běn shū), 昨天见的那个人(zuótiān jiàn de nà ge rén)) 동사 + 过(guo): \"~해 본 적 있다\". 경험을 나타냄. 부정은 没(méi) + 동사 + 过(guo). (我吃过(wǒ chī guo), 没去过(méi qù guo)) 确实(quèshí): \"확실히, 정말로\". 상대 말이나 소문이 맞다고 인정할 때 씀. (确实挺好(quèshí tǐng hǎo)) 难怪(nánguài): \"어쩐지, 그러니까 ~했구나\". 이유를 알고 나서 납득할 때 씀. (难怪这么便宜(nánguài zhème piányi), 难怪他不高兴(nánguài tā bù gāoxìng)) 중국어 Day 11 先别(xiān bié) + 동사: \"일단 ~하지 마\". 상대의 행동을 잠깐 멈추게 할 때 씀. (先别走(xiān bié zǒu), 先别告诉他(xiān bié gàosu tā)) 急着(jízhe) + 동사: \"서둘러 ~하려 하다, 급하게 ~하다\". 别(bié)와 함께 \"서두르지 마\"로 자주 씀. (急着回家(jízhe huí jiā), 别急着做决定(bié jízhe zuò juédìng)) 동사 + 完(wán): 결과보어, \"다 ~하다, ~을 끝내다\". 부정은 没(méi) + 동사 + 完(wán). (吃完了(chī wán le), 还没看完(hái méi kàn wán)) 还(hái)……呢(ne): \"아직 ~한 상태야\". 상황이 계속되고 있음을 부드럽게 강조함. (他还在睡觉呢(tā hái zài shuìjiào ne), 我还没吃饭呢(wǒ hái méi chī fàn ne)) 除了(chúle)……以外(yǐwài)，都(dōu)……: \"~을 빼고 모두 ~\". 뒤에 也(yě)/还(hái)가 오면 \"~외에도 또\"라는 뜻이 됨. (除了他以外，大家都来了(chúle tā yǐwài, dàjiā dōu lái le) / 除了咖啡，我也喜欢喝茶(chúle kāfēi, wǒ yě xǐhuan hē chá)) 行(xíng): \"괜찮다, 된다\". 약속·제안에 동의할 때 짧게 씀. (明天也行(míngtiān yě xíng), 这样行不行?(zhèyàng xíng bu xíng)) 你看(nǐ kàn) + 질문: \"네 생각엔 ~?\" 상대의 의견을 물을 때 씀. 여기서 看(kàn)은 \"보다\"가 아니라 \"판단하다\". (你看怎么样?(nǐ kàn zěnmeyàng)) 方便(fāngbiàn): \"(시간·형편이) 괜찮다, 편하다\". 약속 잡을 때 상대 사정을 배려하는 표현. (你什么时候方便?(nǐ shénme shíhou fāngbiàn)) 중국어 Day 12 好久没(hǎojiǔ méi) + 동사 + 了(le): \"오랫동안 ~ 안 했다\". 한동안 하지 않은 일을 말할 때 씀. (好久没见了(hǎojiǔ méi jiàn le), 好久没运动了(hǎojiǔ méi yùndòng le)) 형용사 + 得不行(de bùxíng): \"엄청 ~하다, ~해서 못 견디겠다\". 정도가 아주 심함을 나타내는 회화체 정도보어. (累得不行(lèi de bùxíng), 饿得不行(è de bùxíng)) 非得(fēiděi)……不可(bùkě): \"꼭 ~해야만 한다\". 강한 필요나 결심을 나타냄. 회화에서는 不可(bùkě)를 생략하기도 함. (今天非得做完不可(jīntiān fēiděi zuò wán bùkě)) 好好(hǎohǎo) + 동사: \"제대로, 푹 ~하다\". (好好休息(hǎohǎo xiūxi), 好好想想(hǎohǎo xiǎngxiang)) 正要(zhèng yào) + 동사: \"막 ~하려던 참이다\". 그때 다른 일이 끼어들었음을 말할 때 씀. (我正要给你打电话(wǒ zhèng yào gěi nǐ dǎ diànhuà)) 동사 + 起(qǐ) + 목적어 + 来(lái): \"~하기 시작하다\". 목적어는 起(qǐ)와 来(lái) 사이에 옴. (唱起歌来(chàng qǐ gē lái), 聊起天来(liáo qǐ tiān lái)) 看来(kànlái): \"보아하니 ~인 것 같다\". 눈앞의 상황을 근거로 판단할 때 씀. 估计(gūjì)보다 근거가 분명한 느낌. (看来他不会来了(kànlái tā bú huì lái le)) 只能(zhǐ néng) + 동사 + 了(le): \"~할 수밖에 없다\". (只能等了(zhǐ néng děng le)) 待着(dāi zhe): \"(한곳에) 머물러 있다\". 待(dāi)는 회화에서 \"있다, 머무르다\"의 뜻. (在家待着(zài jiā dāi zhe), 待了一会儿(dāi le yíhuìr)) 중국어 Day 13 被(bèi) + 행위자 + 동사 + 기타 성분: 피동문, \"~에게 ~당하다\". 주로 원하지 않은 일에 씀. 동사 뒤에 了(le)나 결과보어가 붙음. (我的蛋糕被弟弟吃了(wǒ de dàngāo bèi dìdi chī le), 钱包被偷了(qiánbāo bèi tōu le)) 동사 + 错(cuò): 결과보어, \"잘못 ~하다\". (走错路(zǒu cuò lù), 打错电话(dǎ cuò diànhuà), 听错了(tīng cuò le)) 害得(hài de) + 사람 + 결과: \"~하는 바람에 (누가) ~하게 됐다\". 남 탓을 하며 나쁜 결과를 말할 때 씀. (你迟到了，害得我们等了半天(nǐ chídào le, hài de wǒmen děng le bàntiān)) 동사 + 了(le) + 半天(bàntiān): \"한참 동안 ~했다\". 실제 반나절이 아니라 \"오래\"라는 과장 표현. (说了半天(shuō le bàntiān), 想了半天(xiǎng le bàntiān)) 既然(jìrán)……，那(nà)/就(jiù)……: \"기왕 ~한 이상, ~하자\". 이미 사실인 것을 근거로 제안·결론을 낼 때 씀. (既然来了，就多玩儿几天吧(jìrán lái le, jiù duō wánr jǐ tiān ba)) 不用(búyòng) + 동사: \"~할 필요 없다, ~안 해도 된다\". 不要(búyào) \"~하지 마\"와 구별. (不用谢(búyòng xiè), 明天不用早起(míngtiān búyòng zǎo qǐ)) 陪(péi) + 사람 + 동사: \"~와 함께 ~해 주다\". 상대 곁에 있어 주는 느낌. (陪我去医院(péi wǒ qù yīyuàn), 陪孩子玩儿(péi háizi wánr)) 场(chǎng): 영화 상영·경기·공연 등 한 회를 세는 양사. 작품 자체를 셀 때는 部(bù). (看场电影(kàn chǎng diànyǐng), 一场比赛(yì chǎng bǐsài)) 문장 끝 呗(bei): \"~하면 되지, ~하자\". 吧(ba)보다 더 가볍고 편한 말투로, 당연하다는 느낌을 줌. (不会就问呗(bú huì jiù wèn bei)) 중국어 Day 14 光顾着(guāng gùzhe) + 동사: \"~하는 데만 정신이 팔려서\". 그 바람에 다른 걸 놓쳤다는 뉘앙스. (光顾着说话(guāng gùzhe shuōhuà), 光顾着玩儿，忘了吃饭(guāng gùzhe wánr, wàng le chīfàn)) 一不小心(yí bù xiǎoxīn): \"깜빡하는 사이에, 실수로\". 의도치 않게 생긴 일 앞에 씀. (一不小心摔倒了(yí bù xiǎoxīn shuāidǎo le), 一不小心说漏嘴了(yí bù xiǎoxīn shuō lòu zuǐ le)) 동사 + 过(guò): 방향보어, \"(지점을) 지나치다\". 경험의 过(guo)와 달리 4성으로 읽음. (坐过站(zuò guò zhàn), 睡过头了(shuì guò tóu le), 走过头了(zǒu guò tóu le)) 站(zhàn): 정거장 수를 세는 양사. (还有三站(hái yǒu sān zhàn), 下一站(xià yí zhàn)) 형용사 + 得厉害(de lìhai): \"몹시 ~하다\". 정도가 심함을 나타내며, 주로 좋지 않은 상태에 씀. (疼得厉害(téng de lìhai), 堵得厉害(dǔ de lìhai)) 동사 + 양사 + 명사: 수사 一(yī)를 생략한 회화체. 带把伞(dài bǎ sǎn)의 把(bǎ)는 손잡이 있는 물건을 세는 양사로, 把자문의 把와 다름. (买瓶水(mǎi píng shuǐ), 一把椅子(yì bǎ yǐzi)) 万一(wànyī): \"만에 하나, 혹시라도\". 일어나지 않았으면 하는 일을 가정할 때 씀. (万一迟到了怎么办(wànyī chídào le zěnme bàn)) ……也不怕(yě bú pà): \"~해도 걱정 없다\". 미리 대비해 두었다는 느낌. (有了地图，迷路也不怕(yǒu le dìtú, mílù yě bú pà)) 중국어 Day 15 A + 比(bǐ) + B + 형용사 + 多了(duō le): \"A가 B보다 훨씬 ~하다\". 차이가 클 때 형용사 뒤에 多了(duō le)를 붙임. 比(bǐ) 비교문에는 很(hěn)·非常(fēicháng)을 쓰지 않음. (今天比昨天冷多了(jīntiān bǐ zuótiān lěng duō le), 这个比那个便宜多了(zhège bǐ nàge piányi duō le)) 比我想象的(bǐ wǒ xiǎngxiàng de): \"내가 생각한 것보다, 생각보다\". 比想象中(bǐ xiǎngxiàng zhōng)이라고도 함. (比我想象的难(bǐ wǒ xiǎngxiàng de nán)) 带(dài) + 사람 + 来/去(lái/qù) + 동사: \"~을 데리고 와서/가서 ~하다\". 물건뿐 아니라 사람을 데려갈 때도 带(dài)를 씀. (带孩子去公园玩儿(dài háizi qù gōngyuán wánr), 带你去看看(dài nǐ qù kànkan)) 尝尝(chángchang): 동사 중첩 복습, \"좀 맛보다\". 음식을 권할 때 아주 자주 씀. (你尝尝这个(nǐ chángchang zhège)) 一边(yìbiān) + A + 一边(yìbiān) + B: \"A하면서 B하다\". 두 동작을 동시에 할 때 씀. 회화에서는 边(biān)……边(biān)……로 줄이기도 함. (一边吃饭一边看手机(yìbiān chī fàn yìbiān kàn shǒujī), 边走边聊(biān zǒu biān liáo)) 不知不觉(bù zhī bù jué): \"나도 모르는 사이에, 어느새\". 시간이 빨리 지나갔거나 변화를 늦게 알아챘을 때 씀. (不知不觉一年过去了(bù zhī bù jué yì nián guòqu le)) 就(jiù) + 到(dào) + 시간 + 了(le): \"벌써 ~(시간)이 되다\". 就(jiù)가 \"생각보다 빨리\"라는 느낌을 더함. (才(cái)와 반대) (一会儿就到十点了(yíhuìr jiù dào shí diǎn le)) 중국어 Day 16 의문사 + 也/都(yě/dōu) + 부정: \"아무 ~도 …하지 않다\". 哪儿(nǎr)·谁(shéi)·什么(shénme) 같은 의문사가 '모든 것'을 가리킴. (谁都不认识(shéi dōu bú rènshi), 什么也没吃(shénme yě méi chī)) 就(jiù) + 想(xiǎng) + 동사: 여기서 就(jiù)는 \"그냥, 오직\". 다른 건 말고 이것만 하고 싶다는 느낌. (我就想睡觉(wǒ jiù xiǎng shuìjiào)) 동사1 + 着(zhe) + 동사2: \"~한 채로 ~하다\". 동사1이 동사2를 하는 방식·자세를 나타냄. (躺着看手机(tǎngzhe kàn shǒujī), 站着吃饭(zhànzhe chī fàn)) 追剧(zhuī jù): \"드라마를 챙겨 보다, 정주행하다\". 회화에서 아주 자주 쓰는 표현. (最近在追什么剧?(zuìjìn zài zhuī shénme jù?)) 还以为(hái yǐwéi)……呢(ne): \"(사실과 달리) ~인 줄 알았다\". 以为(yǐwéi)는 생각이 틀렸을 때 씀. 자기 의견을 말할 땐 认为(rènwéi)/觉得(juéde). (我还以为你不来了呢(wǒ hái yǐwéi nǐ bù lái le ne)) 原来(yuánlái): \"알고 보니\". 몰랐던 사실을 새로 알게 됐을 때 문장 앞에 씀. (原来是你啊(yuánlái shì nǐ a)) 早就(zǎo jiù)……了(le): \"진작, 이미 오래전에 ~했다\". (我早就知道了(wǒ zǎo jiù zhīdào le)) 还在(hái zài) + 장소/동작: \"아직 ~에 있다, 아직 ~하는 중이다\". (他还在睡觉(tā hái zài shuìjiào)) 중국어 Day 17 趁(chèn) + 상황: \"~한 틈을 타서, ~할 때 (기회를 놓치지 않고)\". 좋은 기회를 이용할 때 씀. (趁热吃(chèn rè chī), 趁年轻(chèn niánqīng)) 好几(hǎo jǐ) + 양사: \"여러, 꽤 많은\". 几(jǐ)보다 수가 많다는 느낌을 강조함. (好几天(hǎo jǐ tiān), 好几次(hǎo jǐ cì)) 省得(shěngde) + 원치 않는 일: \"~하지 않도록, ~할 필요 없게\". 미리 해 두는 이유를 뒤에 붙일 때 씀. 免得(miǎnde)와 비슷한 회화 표현. (早点儿走，省得堵车(zǎo diǎnr zǒu, shěngde dǔchē)) 跑一趟(pǎo yí tàng): \"한 번 다녀오다\". 趟(tàng)은 오가는 횟수를 세는 양사. (去一趟超市(qù yí tàng chāoshì)) 动不动就(dòngbudòng jiù) + 동사: \"걸핏하면 ~하다, 툭하면 ~하다\". 자주 일어나는 일(주로 좋지 않은 일)에 씀. (他动不动就生气(tā dòngbudòng jiù shēngqì)) 犯困(fànkùn): \"졸음이 오다, 졸리다\". 犯(fàn)은 \"(나쁜 상태가) 도지다\"의 느낌. (一到下午就犯困(yí dào xiàwǔ jiù fànkùn)) 说不定(shuōbudìng): \"어쩌면 ~일지도 모른다\". 估计(gūjì)보다 확신이 약한 추측. (说不定他忘了(shuōbudìng tā wàng le)) 是因为(shì yīnwèi) + 이유: \"~ 때문이다\". 결과를 먼저 말하고 이유를 뒤에서 설명할 때 씀. (我迟到是因为堵车(wǒ chídào shì yīnwèi dǔchē)) 중국어 Day 18 难得(nándé): \"모처럼, 좀처럼 없는\". 자주 오지 않는 기회라 소중하다는 느낌. 문장 앞이나 명사 앞에 씀. (难得见一面(nándé jiàn yí miàn), 难得的好天气(nándé de hǎo tiānqì)) 有个(yǒu ge) + 명사: 有一个(yǒu yí ge)에서 一(yī)를 뺀 회화체. 말할 때 아주 자주 생략함. (我有个问题(wǒ yǒu ge wèntí)) 要不(yàobù) + 제안: \"아니면 ~할까?, ~하는 게 어때?\". 가볍게 제안할 때 문장 앞에 씀. 要不然(yàoburán)과 같은 뜻. (要不你先回去吧(yàobù nǐ xiān huíqu ba)) 出去(chūqu) + 동사: \"나가서 ~하다\". 이동 동사 뒤에 목적이 되는 동작을 바로 이어 쓰는 연동문. (出去走走(chūqu zǒuzou), 回家吃饭(huí jiā chī fàn)) 虽然(suīrán)……可(kě)……: \"비록 ~지만, …\". 회화에서는 但是(dànshì) 대신 可(kě)를 자주 씀. (虽然有点儿贵，可质量很好(suīrán yǒudiǎnr guì, kě zhìliàng hěn hǎo)) 舍不得(shěbude) + 동사: \"아까워서(아쉬워서) ~하지 못하다\". 반대는 舍得(shěde). (舍不得花钱(shěbude huā qián), 舍不得走(shěbude zǒu)) 毕竟(bìjìng): \"어쨌든, 아무래도 (~이니까)\". 앞에서 말한 감정·행동의 이유가 되는 사실을 강조함. (他毕竟还是个孩子(tā bìjìng hái shì ge háizi)) 是(shì)……的(de): 이미 일어난 일에서 누가·언제·어떻게 했는지를 강조. 여기서는 '엄마가' 준 것임을 강조. (这是我自己做的(zhè shì wǒ zìjǐ zuò de)) 双(shuāng): 신발·양말·젓가락처럼 짝을 이루는 것을 세는 양사. (一双袜子(yì shuāng wàzi)) 관련 비즈니스 중국어 노트"}, {"title": "중국어 심화 문장", "category": "chinese", "updated": "", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: 심화 문장 (공문체)<\/li>\n<\/ul>\n<h2>鉴于双方长期合作的良好关系，我方愿意就手续费标准予以适当调整。<\/h2>\n<ul>\n<li>병음: Jiànyú shuāngfāng chángqī hézuò de liánghǎo guānxì, wǒfāng yuànyì jiù shǒuxùfèi biāozhǔn yǔyǐ shìdàng tiáozhěng.<\/li>\n<li>뜻: 양사 간 장기적인 협력 관계를 고려하여, 당사는 수수료 기준을 적절히 조정할 의향이 있습니다.<\/li>\n<li>문법:<ul>\n<li>鉴于(jiànyú) + 상황: \"~을 감안하여\", 因为(yīnwèi)보다 격식 있는 표현.<\/li>\n<li>就(jiù) + 대상: \"~에 관하여\". (就此事进行讨论(jiù cǐ shì jìnxíng tǎolùn))<\/li>\n<li>予以(yǔyǐ) + 2음절 동사: \"~을 해 주다\"의 서면어. (予以确认(yǔyǐ quèrèn), 予以支持(yǔyǐ zhīchí))<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>如贵司对上述内容有任何疑问，敬请随时与我们联系。<\/h2>\n<ul>\n<li>병음: Rú guìsī duì shàngshù nèiróng yǒu rènhé yíwèn, jìngqǐng suíshí yǔ wǒmen liánxì.<\/li>\n<li>뜻: 귀사에서 상기 내용에 대해 궁금한 점이 있으시면, 언제든지 연락 주시기 바랍니다.<\/li>\n<li>문법:<ul>\n<li>如(rú) + 조건: 如果(rúguǒ)의 서면어.<\/li>\n<li>贵司(guìsī) / 我方(wǒfāng): \"귀사\" / \"당사\".<\/li>\n<li>上述(shàngshù): \"상술한, 위에서 언급한\". (上述条款(shàngshù tiáokuǎn))<\/li>\n<li>敬请(jìngqǐng) + 동사: \"~해 주시기 바랍니다\", 请(qǐng)보다 공손한 표현.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>주요 단어<\/h2>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>병음<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>鉴于<\/td>\n<td>jiànyú<\/td>\n<td>~을 감안하여<\/td>\n<\/tr>\n<tr>\n<td>双方<\/td>\n<td>shuāngfāng<\/td>\n<td>양측, 쌍방<\/td>\n<\/tr>\n<tr>\n<td>合作<\/td>\n<td>hézuò<\/td>\n<td>협력, 합작<\/td>\n<\/tr>\n<tr>\n<td>手续费<\/td>\n<td>shǒuxùfèi<\/td>\n<td>수수료<\/td>\n<\/tr>\n<tr>\n<td>予以<\/td>\n<td>yǔyǐ<\/td>\n<td>~을 해 주다 (서면어)<\/td>\n<\/tr>\n<tr>\n<td>适当<\/td>\n<td>shìdàng<\/td>\n<td>적절하다<\/td>\n<\/tr>\n<tr>\n<td>调整<\/td>\n<td>tiáozhěng<\/td>\n<td>조정하다<\/td>\n<\/tr>\n<tr>\n<td>贵司<\/td>\n<td>guìsī<\/td>\n<td>귀사<\/td>\n<\/tr>\n<tr>\n<td>上述<\/td>\n<td>shàngshù<\/td>\n<td>상술한, 상기의<\/td>\n<\/tr>\n<tr>\n<td>疑问<\/td>\n<td>yíwèn<\/td>\n<td>의문, 궁금한 점<\/td>\n<\/tr>\n<tr>\n<td>敬请<\/td>\n<td>jìngqǐng<\/td>\n<td>~해 주시기 바랍니다<\/td>\n<\/tr>\n<tr>\n<td>联系<\/td>\n<td>liánxì<\/td>\n<td>연락하다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"비즈니스 중국어 노트\">비즈니스 중국어 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 03\">중국어 Day 03<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"중국어 Day 04\">중국어 Day 04<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: 심화 문장 (공문체) 鉴于双方长期合作的良好关系，我方愿意就手续费标准予以适当调整。 병음: Jiànyú shuāngfāng chángqī hézuò de liánghǎo guānxì, wǒfāng yuànyì jiù shǒuxùfèi biāozhǔn yǔyǐ shìdàng tiáozhěng. 뜻: 양사 간 장기적인 협력 관계를 고려하여, 당사는 수수료 기준을 적절히 조정할 의향이 있습니다. 문법: 鉴于(jiànyú) + 상황: \"~을 감안하여\", 因为(yīnwèi)보다 격식 있는 표현. 就(jiù) + 대상: \"~에 관하여\". (就此事进行讨论(jiù cǐ shì jìnxíng tǎolùn)) 予以(yǔyǐ) + 2음절 동사: \"~을 해 주다\"의 서면어. (予以确认(yǔyǐ quèrèn), 予以支持(yǔyǐ zhīchí)) 如贵司对上述内容有任何疑问，敬请随时与我们联系。 병음: Rú guìsī duì shàngshù nèiróng yǒu rènhé yíwèn, jìngqǐng suíshí yǔ wǒmen liánxì. 뜻: 귀사에서 상기 내용에 대해 궁금한 점이 있으시면, 언제든지 연락 주시기 바랍니다. 문법: 如(rú) + 조건: 如果(rúguǒ)의 서면어. 贵司(guìsī) / 我方(wǒfāng): \"귀사\" / \"당사\". 上述(shàngshù): \"상술한, 위에서 언급한\". (上述条款(shàngshù tiáokuǎn)) 敬请(jìngqǐng) + 동사: \"~해 주시기 바랍니다\", 请(qǐng)보다 공손한 표현. 주요 단어 단어 병음 뜻 鉴于 jiànyú ~을 감안하여 双方 shuāngfāng 양측, 쌍방 合作 hézuò 협력, 합작 手续费 shǒuxùfèi 수수료 予以 yǔyǐ ~을 해 주다 (서면어) 适当 shìdàng 적절하다 调整 tiáozhěng 조정하다 贵司 guìsī 귀사 上述 shàngshù 상술한, 상기의 疑问 yíwèn 의문, 궁금한 점 敬请 jìngqǐng ~해 주시기 바랍니다 联系 liánxì 연락하다 관련 비즈니스 중국어 노트 이전: 중국어 Day 03 · 다음: 중국어 Day 04"}, {"title": "업무 영어 공부 노트", "category": "english", "updated": "", "order": 0, "html": "<p>새 항목은 각 표 맨 위(최신순)에 추가합니다. 예문은 항목별 한 개씩만 넣습니다.<\/p>\n<ul>\n<li>단어·표현: 주제별 표 한 개. 뜻, 뉘앙스·쓰임, 업무 예문 1개와 해석, 비슷하거나 헷갈리는 표현<\/li>\n<li>\n<p>문법: 표 한 개에 한 행씩. 규칙, 틀린 예와 맞는 예(예문 1개), 해석, 주의점<\/p>\n<\/li>\n<li>\n<p>원본 문서: <a href=\"https://claude.ai/artifact/APZGuviyiunBCnh7vah8ps\">업무 영어 공부 노트<\/a> (버전 1)<\/p>\n<\/li>\n<\/ul>\n<h2>단어·표현<\/h2>\n<p>아직 등록된 표현이 없습니다.<\/p>\n<h2>문법<\/h2>\n<p>아직 등록된 문법이 없습니다.<\/p>", "text": "새 항목은 각 표 맨 위(최신순)에 추가합니다. 예문은 항목별 한 개씩만 넣습니다. 단어·표현: 주제별 표 한 개. 뜻, 뉘앙스·쓰임, 업무 예문 1개와 해석, 비슷하거나 헷갈리는 표현 문법: 표 한 개에 한 행씩. 규칙, 틀린 예와 맞는 예(예문 1개), 해석, 주의점 원본 문서: 업무 영어 공부 노트 (버전 1) 단어·표현 아직 등록된 표현이 없습니다. 문법 아직 등록된 문법이 없습니다."}, {"title": "영어 EC 공부 노트", "category": "english", "updated": "", "order": 0, "html": "<p>주제별로 묶어 정리합니다. ★는 직접 올린 단어·문법이고, 나머지는 함께 알아두면 좋은 관련 단어·문법입니다.<\/p>\n<ul>\n<li>단어: 주제별 표. 단어, 뜻, 메모(헷갈리는 점·업무에서 쓰는 뜻)<\/li>\n<li>\n<p>문법: 비슷한 문법끼리 묶어 형태와 예문 1개씩<\/p>\n<\/li>\n<li>\n<p>원본 문서: <a href=\"https://claude.ai/artifact/Lrqr1YUK8naGPTRAEN8n4q\">영어 EC 공부 노트<\/a> (버전 36)<\/p>\n<\/li>\n<\/ul>\n<h2>단어<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 단어 01 표정 (얼굴)\">영어 EC 단어 01 표정 (얼굴)<\/a><ul>\n<li>frown ★, scowl, furrowed brow / furrowed eyebrows ★, knit one's brows, grimace, purse one's lips ★, pout, smirk, beam, raise an eyebrow ★, wink ★, blink, squint, glare ★, stare, glance, glimpse<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 단어 02 몸짓·자세\">영어 EC 단어 02 몸짓·자세<\/a><ul>\n<li>shrug ★, tilt one's head ★, nod, shake one's head, bow ★, flex ★, bend ★, bend over, extend ★, stretch, crouch ★, squat, kneel, lean, slouch, cross one's arms<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 단어 03 이동 (뛰기·달리기·걷기)\">영어 EC 단어 03 이동 (뛰기·달리기·걷기)<\/a><ul>\n<li>jump ★, leap ★, hop ★, skip ★, vault ★, bounce, run ★, jog ★, dash ★, sprint ★, rush, stroll, wander, march, tiptoe, limp<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 단어 04 공간 묘사\">영어 EC 단어 04 공간 묘사<\/a><ul>\n<li>spacious ★, roomy, cramped, cozy ★, airy ★, stuffy, cluttered ★, messy, tidy, loft space ★, attic, basement, studio<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 단어 05 제품 묘사\">영어 EC 단어 05 제품 묘사<\/a><ul>\n<li>dimension ★, portable ★, handheld, compact, bulky, lightweight, sleek ★, slick, stylish, durable, user-friendly<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 단어 06 주방 도구\">영어 EC 단어 06 주방 도구<\/a><ul>\n<li>butcher's knife ★, cleaver, chef's knife, paring knife ★, bread knife, peeler, cutting board, ladle, spatula, whisk, tongs, colander, grater, can opener, drawer ★, cupboard<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 단어 07 수학·도형\">영어 EC 단어 07 수학·도형<\/a><ul>\n<li>circumference ★, diameter, radius, perimeter, area, volume, equation ★, formula, fraction, decimal, percentage, average, ratio<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 단어 08 기술·개발\">영어 EC 단어 08 기술·개발<\/a><ul>\n<li>prototype ★, mock-up, pilot, beta version, launch, motherboard ★, circuit board, hardware, firmware, breakthrough ★, innovation, upgrade<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 단어 09 약·의료\">영어 EC 단어 09 약·의료<\/a><ul>\n<li>over the counter (OTC) ★, prescription drug / prescribed medicine ★, prescription, pharmacy, painkiller, tablet / capsule, ointment, dosage, side effect, nasal spray ★, runny nose, stuffy / blocked nose, sore throat<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 단어 10 믿음·인류 (추상 명사)\">영어 EC 단어 10 믿음·인류 (추상 명사)<\/a><ul>\n<li>belief ★, faith, conviction, doubt, mankind ★, humankind / humanity, curse ★, blessing, swear<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 단어 11 명확·모호\">영어 EC 단어 11 명확·모호<\/a><ul>\n<li>obscure ★, vague, ambiguous, unclear, explicit, implicit<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 단어 12 접미사\">영어 EC 단어 12 접미사<\/a><ul>\n<li>-ridden ★, -filled, -free, -proof, -friendly, -oriented<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 단어 13 강조·연결 표현\">영어 EC 단어 13 강조·연결 표현<\/a><ul>\n<li>above all ★, most importantly, first of all, in addition / moreover, after all, in short<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>문법<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 문법 01 가정법·후회·아쉬움\">영어 EC 문법 01 가정법·후회·아쉬움<\/a><ul>\n<li>가정법 과거, 가정법 과거완료 ★, 혼합 가정법 ★, should have p.p., with hindsight ★, if only ★, I wish, it's a real shame ★<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 문법 02 대조·양보\">영어 EC 문법 02 대조·양보<\/a><ul>\n<li>even though ★, although, even if, whereas ★, while ★, despite ★, in spite of ★, however / nevertheless<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 문법 03 둘을 짝짓는 표현 - both / either / neither\">영어 EC 문법 03 둘을 짝짓는 표현 - both / either / neither<\/a><ul>\n<li>both A and B, either A or B ★, neither A nor B ★, not only A but (also) B, either / neither + 단수 명사 ★, 긍정 맞장구: too / so, 부정 맞장구: either / neither ★<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 문법 04 분사 형용사 (-ed / -ing)\">영어 EC 문법 04 분사 형용사 (-ed / -ing)<\/a><ul>\n<li>과거분사 형용사 ★, 현재분사 형용사, 감정 -ed vs -ing<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 문법 05 동사 + A with B\">영어 EC 문법 05 동사 + A with B<\/a><ul>\n<li>combine A with B ★, replace A with B, provide A with B, compare A with / to B, share A with B<\/li>\n<\/ul>\n<\/li>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 문법 참고 - 가정법 한눈에 보기\">영어 EC 문법 참고 - 가정법 한눈에 보기<\/a><ul>\n<li>가정법 과거, 가정법 과거완료, 혼합 가정법<\/li>\n<\/ul>\n<\/li>\n<\/ul>", "text": "주제별로 묶어 정리합니다. ★는 직접 올린 단어·문법이고, 나머지는 함께 알아두 <td>not even blink = 눈 하나 깜짝 안 하다<\/td>\n<\/tr>\n<tr>\n<td>squint<\/td>\n<td>눈을 가늘게 뜨다<\/td>\n<td>눈부실 때, 자세히 볼 때<\/td>\n<\/tr>\n<tr>\n<td>glare ★<\/td>\n<td>노려보다<\/td>\n<td>glare at + 대상. 분노<\/td>\n<\/tr>\n<tr>\n<td>stare<\/td>\n<td>빤히 보다<\/td>\n<td>감정 중립<\/td>\n<\/tr>\n<tr>\n<td>glance<\/td>\n<td>흘끗 보다<\/td>\n<td>의도적으로 짧게<\/td>\n<\/tr>\n<tr>\n<td>glimpse<\/td>\n<td>얼핏 보다<\/td>\n<td>우연히 잠깐<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 공부 노트\">영어 EC 공부 노트<\/a><\/li>\n<li>다음: <a class=\"wl\" href=\"#\" data-page=\"영어 EC 단어 02 몸짓·자세\">영어 EC 단어 02 몸짓·자세<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: 1. 표정 (얼굴) 단어 뜻 메모 frown ★ 얼굴을 찌푸리다, 인상 쓰다 frown on/upon = 못마땅하게 여기다 scowl 사납게 찌푸리다 frown보다 화가 강함 furrowed brow / furrowed eyebrows ★ 찌푸린 미간 고민·혼란. 단수 a furrowed eyebrow는 어색함 knit one's brows 눈살을 찌푸리다 문어체 grimace (고통·불쾌로) 얼굴을 일그러뜨리다 purse one's lips ★ 입술을 오므리다 못마땅·고민. 명사 purse = 지갑 pout 입을 삐죽 내밀다 삐침·투정 smirk 히죽 웃다(비웃듯) 부정적 beam 활짝 웃다 긍정적 raise an eyebrow ★ 눈썹을 치켜올리다(놀람·의심) raise(목적어 O) vs rise(목적어 X) wink ★ 한쪽 눈을 찡긋하다 의도적인 동작 blink 눈을 깜박이다 not even blink = 눈 하나 깜짝 안 하다 squint 눈을 가늘게 뜨다 눈부실 때, 자세히 볼 때 glare ★ 노려보다 glare at + 대상. 분노 stare 빤히 보다 감정 중립 glance 흘끗 보다 의도적으로 짧게 glimpse 얼핏 보다 우연히 잠깐 관련 영어 EC 공부 노트 다음: 영어 EC 단어 02 몸짓·자세"}, {"title": "영어 EC 단어 02 몸짓·자세", "category": "english", "updated": "", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: 2. 몸짓·자세<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>단어<\/th>\n<th>뜻<\/th>\n<th>메모<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>shrug ★<\/td>\n<td>어깨를 으쓱하다<\/td>\n<td>shrug off = 대수롭지 않게 넘기다<\/td>\n<\/tr>\n<tr>\n<td>tilt one's head ★<\/td>\n<td>고개를 갸웃하다<\/td>\n<td>명사구 a tilted head. tilted to head X<\/td>\n<\/tr>\n<tr>\n<td>nod<\/td>\n<td>고개를 끄덕이다<\/td>\n<td>nod off = 꾸벅꾸벅 졸다<\/td>\n<\/tr>\n<tr>\n<td>shake one's head<\/td>\n<td>고개를 가로젓다<\/td>\n<td>shake ost importantly<\/td>\n<td>무엇보다 중요한 것은<\/td>\n<td>above all보다 더 흔함<\/td>\n<\/tr>\n<tr>\n<td>first of all<\/td>\n<td>우선<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>in addition / moreover<\/td>\n<td>게다가<\/td>\n<td>moreover가 더 격식<\/td>\n<\/tr>\n<tr>\n<td>after all<\/td>\n<td>결국, 어차피<\/td>\n<td>above all과 뜻이 다름<\/td>\n<\/tr>\n<tr>\n<td>in short<\/td>\n<td>요컨대<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 공부 노트\">영어 EC 공부 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"영어 EC 단어 12 접미사\">영어 EC 단어 12 접미사<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"영어 EC 문법 01 가정법·후회·아쉬움\">영어 EC 문법 01 가정법·후회·아쉬움<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: 13. 강조·연결 표현 단어 뜻 메모 above all ★ 무엇보다 가장 중요한 것을 강조 most importantly 무엇보다 중요한 것은 above all보다 더 흔함 first of all 우선 in addition / moreover 게다가 moreover가 더 격식 after all 결국, 어차피 above all과 뜻이 다름 in short 요컨대 관련 영어 EC 공부 노트 이전: 영어 EC 단어 12 접미사 · 다음: 영어 EC 문법 01 가정법·후회·아쉬움"}, {"title": "영어 EC 문법 01 가정법·후회·아쉬움", "category": "english", "updated": "", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: 1. 가정법·후회·아쉬움<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>문법<\/th>\n<th>형태·규칙<\/th>\n<th>예문<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>가정법 과거<\/td>\n<td>If + 과거형, would + 동사원형 (지금 사실의 반대)<\/td>\n<td>If I had more time, I would review the contract again. (시간이 더 있다면 계약서를 다시 검토할 텐데.)<\/td>\n<\/tr>\n<tr>\n<td>가정법 과거완료 ★<\/td>\n<td>If + 주어 + had p.p., would have p.p. (과거 사실의 반대). if절에 would X, 주어 빠뜨리지 않기<\/td>\n<td>If we had known about the fee, we would have told you. (그 수수료를 알았더라면 말씀드렸을 겁니다.)<\/td>\n<\/tr>\n<tr>\n<td>혼합 가정법 ★<\/td>\n<td>If + had p.p., would + 동사원형 (그때 안 한 일 → 지금 결과)<\/td>\n<td>If I had gone to graduate school, my salary would be much higher now. (대학원에 갔더라면 지금 월급이 훨씬 높을 텐데.)<\/td>\n<\/tr>\n<tr>\n<td>should have p.p.<\/td>\n<td>~했어야 했는데 (후회). should of X<\/td>\n<td>We should have checked the tax issue earlier. (세금 문제를 더 일찍 확인했어야 했다.)<\/td>\n<\/tr>\n<tr>\n<td>with hindsight ★<\/td>\n<td>지나고 보니 + 주로 should have p.p. in hindsight가 더 흔함<\/td>\n<td>With hindsight, we should have signed the contract earlier. (지나고 보니 계약을 더 일찍 했어야 했다.)<\/td>\n<\/tr>\n<tr>\n<td>if only ★<\/td>\n<td>If only + 과거형(지금 아쉬움) / had p.p.(과거 후회). 현재형 X<\/td>\n<td>If only we had known about the regulation sooner. (규제를 더 빨리 알았더라면 좋았을 텐데.)<\/td>\n<\/tr>\n<tr>\n<td>I wish<\/td>\n<td>if only와 구조가 같고 감정은 덜 강함. be동사는 were<\/td>\n<td>I wish I were in Tokyo for the meeting. (회의 때문에 도쿄에 있으면 좋을 텐데.)<\/td>\n<\/tr>\n<tr>\n<td>it's a real shame ★<\/td>\n<td>It's a shame (that) + 절 / to + 동사. shame은 “수치”가 아니라 “아쉬움”<\/td>\n<td>It's a real shame you can't join the meeting. (회의에 못 오신다니 정말 아쉽네요.)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 공부 노트\">영어 EC 공부 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"영어 EC 단어 13 강조·연결 표현\">영어 EC 단어 13 강조·연결 표현<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"영어 EC 문법 02 대조·양보\">영어 EC 문법 02 대조·양보<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: 1. 가정법·후회·아쉬움 문법 형태·규칙 예문 가정법 과거 If + 과거형, would + 동사원형 (지금 사실의 반대) If I had more time, I would review the contract again. (시간이 더 있다면 계약서를 다시 검토할 텐데.) 가정법 과거완료 ★ If + 주어 + had p.p., would have p.p. (과거 사실의 반대). if절에 would X, 주어 빠뜨리지 않기 If we had known about the fee, we would have told you. (그 수수료를 알았더라면 말씀드렸을 겁니다.) 혼합 가정법 ★ If + had p.p., would + 동사원형 (그때 안 한 일 → 지금 결과) If I had gone to graduate school, my salary would be much higher now. (대학원에 갔더라면 지금 월급이 훨씬 높을 텐데.) should have p.p. ~했어야 했는데 (후회). should of X We should have checked the tax issue earlier. (세금 문제를 더 일찍 확인했어야 했다.) with hindsight ★ 지나고 보니 + 주로 should have p.p. in hindsight가 더 흔함 With hindsight, we should have signed the contract earlier. (지나고 보니 계약을 더 일찍 했어야 했다.) if only ★ If only + 과거형(지금 아쉬움) / had p.p.(과거 후회). 현재형 X If only we had known about the regulation sooner. (규제를 더 빨리 알았더라면 좋았을 텐데.) I wish if only와 구조가 같고 감정은 덜 강함. be동사는 were I wish I were in Tokyo for the meeting. (회의 때문에 도쿄에 있으면 좋을 텐데.) it's a real shame ★ It's a shame (that) + 절 / to + 동사. shame은 “수치”가 아니라 “아쉬움” It's a real shame you can't join the meeting. (회의에 못 오신다니 정말 아쉽네요.) 관련 영어 EC 공부 노트 이전: 영어 EC 단어 13 강조·연결 표현 · 다음: 영어 EC 문법 02 대조·양보"}, {"title": "영어 EC 문법 02 대조·양보", "category": "english", "updated": "", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: 2. 대조·양보<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>문법<\/th>\n<th>형태·규칙<\/th>\n<th>예문<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>even though ★<\/td>\n<td>+ 절. 실제 사실을 인정하며 “비록 ~이지만”<\/td>\n<td>Even though the contract was signed, the merchant hasn't started processing yet. (계약은 체결됐지만 가맹점은 아직 거래를 시작하지 않았다.)<\/td>\n<\/tr>\n<tr>\n<td>although<\/td>\n<td>+ 절. even though와 거의 같고 조금 더 격식<\/td>\n<td>Although the meeting ran late, everyone stayed until the end. (회의가 늦게 끝났지만 모두 끝까지 남았다.)<\/td>\n<\/tr>\n<tr>\n<td>even if<\/td>\n<td>+ 절. 가정, “설령 ~라 하더라도”<\/td>\n<td>Even if the fee goes up, we will keep the partnership. (수수료가 오르더라도 제휴는 유지할 겁니다.)<\/td>\n<\/tr>\n<tr>\n<td>whereas ★<\/td>\n<td>+ 절. 두 대상을 비교(격식). 계약서 전문의 WHEREAS는 “~인 바”라는 다른 뜻<\/td>\n<td>Card A charges a 2% fee, whereas Card B charges 3%. (A카드는 수수료가 2%인 반면 B카드는 3%다.)<\/td>\n<\/tr>\n<tr>\n<td>while ★<\/td>\n<td>+ 절. ~인 반면 / ~이긴 하지만 / ~하는 동안<\/td>\n<td>While I understand your concern, we cannot change the fee structure. (우려는 이해하지만 수수료 구조는 변경할 수 없습니다.)<\/td>\n<\/tr>\n<tr>\n<td>despite ★<\/td>\n<td>+ 명사 / -ing. despite of X. 절을 쓰려면 despite the fact that + 절<\/td>\n<td>Despite the delay, the project was completed on time. (지연에도 불구하고 프로젝트는 제때 끝났다.)<\/td>\n<\/tr>\n<tr>\n<td>in spite of ★<\/td>\n<td>despite와 같음. of까지 꼭 씀<\/td>\n<td>In spite of the high fee, many merchants use the service. (수수료가 높은데도 많은 가맹점이 이 서비스를 쓴다.)<\/td>\n<\/tr>\n<tr>\n<td>however / nevertheless<\/td>\n<td>문장 앞에 쓰고 뒤에 쉼표. 두 문장을 잇지는 못함<\/td>\n<td>The fee is high. However, the service is reliable. (수수료는 높다. 하지만 서비스는 믿을 만하다.)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 공부 노트\">영어 EC 공부 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"영어 EC 문법 01 가정법·후회·아쉬움\">영어 EC 문법 01 가정법·후회·아쉬움<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"영어 EC 문법 03 둘을 짝짓는 표현 - both / either / neither\">영어 EC 문법 03 둘을 짝짓는 표현 - both / either / neither<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: 2. 대조·양보 문법 형태·규칙 예문 even though ★ + 절. 실제 사실을 인정하며 “비록 ~이지만” Even though the contract was signed, the merchant hasn't started processing yet. (계약은 체결됐지만 가맹점은 아직 거래를 시작하지 않았다.) although + 절. even though와 거의 같고 조금 더 격식 Although the meeting ran late, everyone stayed until the end. (회의가 늦게 끝났지만 모두 끝까지 남았다.) even if + 절. 가정, “설령 ~라 하더라도” Even if the fee goes up, we will keep the partnership. (수수료가 오르더라도 제휴는 유지할 겁니다.) whereas ★ + 절. 두 대상을 비교(격식). 계약서 전문의 WHEREAS는 “~인 바”라는 다른 뜻 Card A charges a 2% fee, whereas Card B charges 3%. (A카드는 수수료가 2%인 반면 B카드는 3%다.) while ★ + 절. ~인 반면 / ~이긴 하지만 / ~하는 동안 While I understand your concern, we cannot change the fee structure. (우려는 이해하지만 수수료 구조는 변경할 수 없습니다.) despite ★ + 명사 / -ing. despite of X. 절을 쓰려면 despite the fact that + 절 Despite the delay, the project was completed on time. (지연에도 불구하고 프로젝트는 제때 끝났다.) in spite of ★ despite와 같음. of까지 꼭 씀 In spite of the high fee, many merchants use the service. (수수료가 높은데도 많은 가맹점이 이 서비스를 쓴다.) however / nevertheless 문장 앞에 쓰고 뒤에 쉼표. 두 문장을 잇지는 못함 The fee is high. However, the service is reliable. (수수료는 높다. 하지만 서비스는 믿을 만하다.) 관련 영어 EC 공부 노트 이전: 영어 EC 문법 01 가정법·후회·아쉬움 · 다음: 영어 EC 문법 03 둘을 짝짓는 표현 - both / either / neither"}, {"title": "영어 EC 문법 03 둘을 짝짓는 표현 - both / either / neither", "category": "english", "updated": "", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: 3. 둘을 짝짓는 표현: both / either / neither<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>문법<\/th>\n<th>형태·규칙<\/th>\n<th>예문<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>both A and B<\/td>\n<td>A와 B 둘 다. 복수 동사<\/td>\n<td>Both the merchant and the PSP have agreed. (가맹점과 PSP 모두 동의했다.)<\/td>\n<\/tr>\n<tr>\n<td>either A or B ★<\/td>\n<td>둘 중 하나. 동사는 가까운 B에 맞춤<\/td>\n<td>Either you or your manager needs to sign the form. (귀하나 매니저님 중 한 분이 서명해야 합니다.)<\/td>\n<\/tr>\n<tr>\n<td>neither A nor B ★<\/td>\n<td>둘 다 아님. 동사는 B에. neither ~ or X, not을 또 쓰지 않음<\/td>\n<td>Neither the merchant nor the PSPs have replied. (가맹점도 PSP들도 답이 없다.)<\/td>\n<\/tr>\n<tr>\n<td>not only A but (also) B<\/td>\n<td>A뿐 아니라 B도. 동사는 B에<\/td>\n<td>Not only the fee but also the settlement cycle has changed. (수수료뿐 아니라 정산 주기도 바뀌었다.)<\/td>\n<\/tr>\n<tr>\n<td>either / neither + 단수 명사 ★<\/td>\n<td>단수 명사 + 단수 동사. 셋 이상이면 any / none<\/td>\n<td>Neither option works for us. (두 안 모두 저희에게는 맞지 않습니다.)<\/td>\n<\/tr>\n<tr>\n<td>긍정 맞장구: too / so<\/td>\n<td>긍정문에 “나도”: I can too. / So can I. (So 뒤 어순 도치)<\/td>\n<td>A: I can join the call. B: So can I. (A: 저 통화 들어갈 수 있어요. B: 저도요.)<\/td>\n<\/tr>\n<tr>\n<td>부정 맞장구: either / neither ★<\/td>\n<td>부정문에 “나도”: I can't either. / Neither can I. too X<\/td>\n<td>A: I can't join the call. B: Neither can I. (A: 저 통화 못 들어가요. B: 저도요.)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 공부 노트\">영어 EC 공부 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"영어 EC 문법 02 대조·양보\">영어 EC 문법 02 대조·양보<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"영어 EC 문법 04 분사 형용사 (-ed / -ing)\">영어 EC 문법 04 분사 형용사 (-ed / -ing)<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: 3. 둘을 짝짓는 표현: both / either / neither 문법 형태·규칙 예문 both A and B A와 B 둘 다. 복수 동사 Both the merchant and the PSP have agreed. (가맹점과 PSP 모두 동의했다.) either A or B ★ 둘 중 하나. 동사는 가까운 B에 맞춤 Either you or your manager needs to sign the form. (귀하나 매니저님 중 한 분이 서명해야 합니다.) neither A nor B ★ 둘 다 아님. 동사는 B에. neither ~ or X, not을 또 쓰지 않음 Neither the merchant nor the PSPs have replied. (가맹점도 PSP들도 답이 없다.) not only A but (also) B A뿐 아니라 B도. 동사는 B에 Not only the fee but also the settlement cycle has changed. (수수료뿐 아니라 정산 주기도 바뀌었다.) either / neither + 단수 명사 ★ 단수 명사 + 단수 동사. 셋 이상이면 any / none Neither option works for us. (두 안 모두 저희에게는 맞지 않습니다.) 긍정 맞장구: too / so 긍정문에 “나도”: I can too. / So can I. (So 뒤 어순 도치) A: I can join the call. B: So can I. (A: 저 통화 들어갈 수 있어요. B: 저도요.) 부정 맞장구: either / neither ★ 부정문에 “나도”: I can't either. / Neither can I. too X A: I can't join the call. B: Neither can I. (A: 저 통화 못 들어가요. B: 저도요.) 관련 영어 EC 공부 노트 이전: 영어 EC 문법 02 대조·양보 · 다음: 영어 EC 문법 04 분사 형용사 (-ed / -ing)"}, {"title": "영어 EC 문법 04 분사 형용사 (-ed / -ing)", "category": "english", "updated": "", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: 4. 분사 형용사 (-ed / -ing)<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>문법<\/th>\n<th>형태·규칙<\/th>\n<th>예문<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>과거분사 형용사 ★<\/td>\n<td>p.p. + 명사 = 이미 ~된 상태. furrowed eyebrows, a tilted head<\/td>\n<td>She listened with furrowed eyebrows. (그녀는 미간을 찌푸린 채 들었다.)<\/td>\n<\/tr>\n<tr>\n<td>현재분사 형용사<\/td>\n<td>-ing + 명사 = ~하고 있는, ~하게 만드는<\/td>\n<td>The meeting was boring, so many people left early. (회의가 지루해서 많은 사람이 일찍 나갔다.)<\/td>\n<\/tr>\n<tr>\n<td>감정 -ed vs -ing<\/td>\n<td>사람이 느끼면 -ed, 감정의 원인이면 -ing<\/td>\n<td>I was confused because the fee table was confusing. (수수료표가 헷갈려서 나는 혼란스러웠다.)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 공부 노트\">영어 EC 공부 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"영어 EC 문법 03 둘을 짝짓는 표현 - both / either / neither\">영어 EC 문법 03 둘을 짝짓는 표현 - both / either / neither<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"영어 EC 문법 05 동사 + A with B\">영어 EC 문법 05 동사 + A with B<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: 4. 분사 형용사 (-ed / -ing) 문법 형태·규칙 예문 과거분사 형용사 ★ p.p. + 명사 = 이미 ~된 상태. furrowed eyebrows, a tilted head She listened with furrowed eyebrows. (그녀는 미간을 찌푸린 채 들었다.) 현재분사 형용사 -ing + 명사 = ~하고 있는, ~하게 만드는 The meeting was boring, so many people left early. (회의가 지루해서 많은 사람이 일찍 나갔다.) 감정 -ed vs -ing 사람이 느끼면 -ed, 감정의 원인이면 -ing I was confused because the fee table was confusing. (수수료표가 헷갈려서 나는 혼란스러웠다.) 관련 영어 EC 공부 노트 이전: 영어 EC 문법 03 둘을 짝짓는 표현 - both / either / neither · 다음: 영어 EC 문법 05 동사 + A with B"}, {"title": "영어 EC 문법 05 동사 + A with B", "category": "english", "updated": "", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: 5. 동사 + A with B<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>문법<\/th>\n<th>형태·규칙<\/th>\n<th>예문<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>combine A with B ★<\/td>\n<td>A와 B를 합치다. 뒤에 to + 동사가 오면 목적<\/td>\n<td>Combine the transaction data with the fee table to calculate the settlement. (거래 데이터와 수수료표를 합쳐 정산액을 계산하세요.)<\/td>\n<\/tr>\n<tr>\n<td>replace A with B<\/td>\n<td>A를 B로 교체하다<\/td>\n<td>We replaced the old terminal with a new one. (오래된 단말기를 새 것으로 교체했다.)<\/td>\n<\/tr>\n<tr>\n<td>provide A with B<\/td>\n<td>A에게 B를 제공하다 (= provide B to A)<\/td>\n<td>Please provide us with the bank account details. (은행 계좌 정보를 제공해 주세요.)<\/td>\n<\/tr>\n<tr>\n<td>compare A with / to B<\/td>\n<td>A를 B와 비교하다<\/td>\n<td>Let's compare this year's fee with last year's. (올해 수수료를 작년과 비교해 봅시다.)<\/td>\n<\/tr>\n<tr>\n<td>share A with B<\/td>\n<td>A를 B와 공유하다<\/td>\n<td>I'll share the report with the partner. (보고서를 파트너사와 공유하겠습니다.)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 공부 노트\">영어 EC 공부 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"영어 EC 문법 04 분사 형용사 (-ed / -ing)\">영어 EC 문법 04 분사 형용사 (-ed / -ing)<\/a> · 다음: <a class=\"wl\" href=\"#\" data-page=\"영어 EC 문법 참고 - 가정법 한눈에 보기\">영어 EC 문법 참고 - 가정법 한눈에 보기<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: 5. 동사 + A with B 문법 형태·규칙 예문 combine A with B ★ A와 B를 합치다. 뒤에 to + 동사가 오면 목적 Combine the transaction data with the fee table to calculate the settlement. (거래 데이터와 수수료표를 합쳐 정산액을 계산하세요.) replace A with B A를 B로 교체하다 We replaced the old terminal with a new one. (오래된 단말기를 새 것으로 교체했다.) provide A with B A에게 B를 제공하다 (= provide B to A) Please provide us with the bank account details. (은행 계좌 정보를 제공해 주세요.) compare A with / to B A를 B와 비교하다 Let's compare this year's fee with last year's. (올해 수수료를 작년과 비교해 봅시다.) share A with B A를 B와 공유하다 I'll share the report with the partner. (보고서를 파트너사와 공유하겠습니다.) 관련 영어 EC 공부 노트 이전: 영어 EC 문법 04 분사 형용사 (-ed / -ing) · 다음: 영어 EC 문법 참고 - 가정법 한눈에 보기"}, {"title": "영어 EC 문법 참고 - 가정법 한눈에 보기", "category": "english", "updated": "", "order": 1, "html": "<blockquote>\n<p>원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다.<\/p>\n<\/blockquote>\n<ul>\n<li>원본 제목: 참고: 가정법 한눈에 보기<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>종류<\/th>\n<th>if절<\/th>\n<th>주절<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>가정법 과거<\/td>\n<td>과거형<\/td>\n<td>would + 동사원형<\/td>\n<td>지금 ~라면, 지금 ~할 텐데<\/td>\n<\/tr>\n<tr>\n<td>가정법 과거완료<\/td>\n<td>had p.p.<\/td>\n<td>would have p.p.<\/td>\n<td>그때 ~했더라면, 그때 ~했을 텐데<\/td>\n<\/tr>\n<tr>\n<td>혼합 가정법<\/td>\n<td>had p.p.<\/td>\n<td>would + 동사원형<\/td>\n<td>그때 ~했더라면, 지금 ~할 텐데<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>관련<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#\" data-page=\"영어 EC 공부 노트\">영어 EC 공부 노트<\/a><\/li>\n<li>이전: <a class=\"wl\" href=\"#\" data-page=\"영어 EC 문법 05 동사 + A with B\">영어 EC 문법 05 동사 + A with B<\/a><\/li>\n<\/ul>", "text": "원본 문서에서 자동으로 만든 페이지입니다. 내용은 원본에서 고치면 다음 동기화 때 반영됩니다. 원본 제목: 참고: 가정법 한눈에 보기 종류 if절 주절 뜻 가정법 과거 과거형 would + 동사원형 지금 ~라면, 지금 ~할 텐데 가정법 과거완료 had p.p. would have p.p. 그때 ~했더라면, 그때 ~했을 텐데 혼합 가정법 had p.p. would + 동사원형 그때 ~했더라면, 지금 ~ var byTitle = {};
DATA.pages.forEach(function (p) { byTitle[p.title] = p; });
var current = DATA.home;
var nav = document.getElementById("nav");
var doc = document.getElementById("doc");
var q = document.getElementById("q");
document.getElementById("built").textContent = "빌드 " + DATA.built;

function esc(s) {
  return s.replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function link(p, extra) {
  return '<a href="#" data-page="' + esc(p.title) + '"' + (p.title === current ? ' class="on"' : "") +
    ">" + esc(p.title) + (extra || "") + "</a>";
}

function snippet(text, term) {
  var i = text.toLowerCase().indexOf(term);
  if (i < 0) return "";
  var s = Math.max(0, i - 18), e = Math.min(text.length, i + term.length + 30);
  var part = text.slice(s, e);
  var j = i - s;
  return '<span class="hit">' + (s > 0 ? "…" : "") + esc(part.slice(0, j)) + "<mark>" +
    esc(part.slice(j, j + term.length)) + "</mark>" + esc(part.slice(j + term.length)) +
    (e < text.length ? "…" : "") + "</span>";
}

function drawNav() {
  var term = q.value.trim().toLowerCase();
  var out = "";
  if (!term) out += link(byTitle[DATA.home]);
  var groups = DATA.categories.slice();
  var known = {};
  groups.forEach(function (g) { known[g[0]] = true; });
  DATA.pages.forEach(function (p) {
    if (p.category !== "home" && !known[p.category]) { known[p.category] = true; groups.push([p.category, p.category]); }
  });
  var total = 0;
  groups.forEach(function (g) {
    var list = DATA.pages.filter(function (p) {
      if (p.category !== g[0]) return false;
      if (!term) return true;
      return p.title.toLowerCase().indexOf(term) >= 0 || p.text.toLowerCase().indexOf(term) >= 0;
    });
    if (g[0] === "journal") list.sort(function (a, b) { return a.title < b.title ? 1 : -1; });
    else list.sort(function (a, b) { return (a.order - b.order) || a.title.localeCompare(b.title, "ko"); });
    if (!list.length) return;
    total += list.length;
    out += "<h2>" + esc(g[1]) + " (" + list.length + ")</h2>";
    list.forEach(function (p) {
      var extra = term && p.title.toLowerCase().indexOf(term) < 0 ? snippet(p.text, term) : "";
      out += link(p, extra);
    });
  });
  if (term && !total) out = '<div class="empty">"' + esc(q.value.trim()) + '" 검색 결과 없음</div>';
  nav.innerHTML = out;
}

function show(title, push) {
  var p = byTitle[title];
  if (!p) return;
  current = title;
  var meta = p.updated ? "최종 수정 " + esc(p.updated) : "";
  doc.innerHTML = '<h1 class="title">' + esc(p.title) + "</h1>" +
    '<div class="meta">' + meta + "</div>" + p.html;
  drawNav();
  document.querySelector("main").scrollTop = 0;
  document.title = p.title + " - " + DATA.site;
  if (push !== false) history.replaceState(null, "", "#" + encodeURIComponent(title));
}

document.addEventListener("click", function (e) {
  var a = e.target.closest("a[data-page]");
  if (!a) return;
  e.preventDefault();
  show(a.getAttribute("data-page"));
});
document.getElementById("home").addEventListener("click", function () { q.value = ""; show(DATA.home); });
q.addEventListener("input", drawNav);
q.addEventListener("keydown", function (e) {
  if (e.key === "Enter") { var a = nav.querySelector("a[data-page]"); if (a) show(a.getAttribute("data-page")); }
  if (e.key === "Escape") { q.value = ""; drawNav(); }
});

var start = decodeURIComponent(location.hash.slice(1));
show(byTitle[start] ? start : DATA.home, false);
</script>
